<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>BACKSPACE — Support</title>
<!--
  backspace — /support (page four), phase one: the CONTACT US anchor.
  Mounts the ratified shared pair; the window is the merged bs-window
  subsystem (no bespoke panel exists on this page).

  DESIGN AUTHORITY (RULED — Eric, Aug 24): this page was never built by
  the previous engineer, so there is no dev-build witness. The design
  team's frames (A-4 rest · 1-1 CONTACT US · 1-2 request type · 1-3 form,
  all 1728x1117) are VISUAL REFERENCE, MIXED with the shipped pages' own
  grammar — not an exact-value port. Where the frames and the house
  diverge, the house wins and the deviation is labeled here. Measurements
  behind every ported value: reports/support_phase1_initiation_audit.md
  (Eric sanctioned the PNG convention, +-1px frame units).

  THE CLICK-TO-OPEN LADDER (RULED — the company, Aug 25; this SUPERSEDES
  the Aug 24 hover-lock grammar). HOUSE-WIDE RULE: only the two icon bars
  — the top-right utility cluster and the top-left away nav — keep
  hover-expansion. EVERY other menu requires a CLICK to trigger its
  secondary expansion or window pop-up. Recorded here because it governs
  every page still to come (FAQ's sub-list, hardware), not just this one.

  Each of the six items now runs four states:
    REST.
    FOCUSED. Hover — or the W/S cursor — pops the item out with the
      signal-red dot and the glow (home-menu grammar, verbatim). It
      opens NOTHING. Leaving retracts it.
    OPEN. A CLICK on the item draws its window out center-stage: the
      request type for CONTACT US, its own content for the other five.
      The window is the committed surface; the cursor is free to keep
      walking the menu while it stands.
    LOCKED. Choosing a request type, clicking the OPEN item again, or
      clicking the window's ground commits to the level below — the
      form — which is the level with something to lose.

  WHAT THIS RETIRED, and why: STICKY HOVER is gone. Sticky existed for
  exactly one reason — leaving a menu item must not tear down the window
  that item had opened. Hover opens nothing now, so there is nothing to
  protect and the item retracts on leave, which is the certified
  home-menu grammar restored. KEYBOARD PREVIEW PARITY is gone with it:
  W/S walks the cursor and opens nothing, because Enter is the click's
  twin. Both were ratified Aug 24 against the hover model and fall with
  it; the parity that MATTERS is preserved — click <-> Enter, and every
  hover state still has a keyboard twin.

  Touch and mouse now converge exactly: the old "first tap previews,
  second locks" two-step IS the click grammar, with no hover branch to
  special-case.

  CONTENT: CONTACT US is real. The other five ride the SAME ladder with
  LOREM through the STR manifest (Eric, Aug 24) — real copy swaps in at
  the keys, no code changes. FAQ's sub-list and answer states are OUT of
  phase one; nothing here precludes them.

  STAGE: blank black per the standing scene-format gate. SCENE SEAM is
  #bs-stage; video / bake / still all remain possible.

  MACHINE LAW on this page: three zones on one cursor — the top strip
  (away nav, SUPPORT DENIES as current, plus utilities; A/D) - the menu
  (W/S) - the locked window (keys remap inside; Tab enters the form only
  when locked). Wheel ownership SWITCHES with the lock: at menu level the
  wheel steps the menu on a MEASURED pitch (first away-page consumer of
  the C14 bridge); inside the locked window the wheel belongs to the
  panel's native scroll (the wheelNative seam in the shared chrome), and
  unlock hands it back. The Esc ladder walks ONE honest level per press
  through ONE function: field focus -> LOCKED -> plate -> sub -> item ->
  the cursor -> the page boundary. (Rest and idle coincide here — nothing
  else holds state at rest, as on /community.)
  THE PAGE LOCK IS CANCELLED (Eric, Aug 25): the menu never freezes — at
  any depth, hover carries the cursor, W/S and the wheel walk the menu,
  and clicking another item switches to it. `locked` survives only as
  LEVEL state (which face, the ladder, Tab gating). The remaining deny
  shakes are not locks: the away-nav's current section and invalid
  submits.

  SUBMIT IS A LABELED STUB pending the wiring ruling (endpoint / mailto /
  disabled-until-go-live): the full submit UX runs to a marked seam and
  says honestly that nothing was sent. No path leaves the site, so the
  THIRD PARTY overlay's second-consumer factoring trigger has NOT fired.
-->
<link rel="stylesheet" href="shared/bs-chrome.css">
<style>
  /* ── Page tokens ──────────────────────────────────────────────────────
     THE SHARED TOP LINE: the frames start the menu, the window and the
     rail on one line (window top 243, menu ink 247, rail ink 248 of
     1117) — 243/1117 -> 21.76vh. One token so the three cannot drift. */
  body[data-bs-page="support"] {
    --sup-top: 21.76vh;
    /* The marker, divider, field and option tokens this block used to
       define were FACTORED to the shared pair (Aug 28, the form-subsystem
       factoring): --bs-marker-warm + its fitted halo, --bs-rule/-above/
       -below, --bs-fld-above/-below, --bs-opt-below, --bs-label and
       --bs-dot-rest now carry /support's measured values as the house
       defaults. The measurement law comments travel with them; this
       file's git history and the initiation audit keep the full record. */
    /* The panel's own interior rhythm (component internals ride ui-scale,
       page placement rides frame fractions — the certified split). The
       frames draw 80px side pads in 1-2 and 52/86 in 1-3; harmonized to
       ONE symmetric 80px box, the internally consistent reading. */
    --sup-pad-x: calc(80px * var(--ui-scale));
    --sup-pad-t: calc(52px * var(--ui-scale));
    --sup-pad-b: calc(30px * var(--ui-scale));
  }

  /* ── The menu — SIX items, the home menu's own grammar ────────────────
     .bs-item is consumed VERBATIM from the shared chrome (pop-out, the
     signal-red dot, the glow ladder, the hit-area rhythm): this list and
     the title screen's menu are the same control in two placements. Only
     placement is page-side. Frame: x65 -> 3.76vw, which is the EXACT
     second term of the home menu's anchor — the away-page content column
     and the title-screen menu ride one rail. Pitch measured 45px uniform
     (gap 30 + the 15px line box); the superseded nine-layer table's
     30/65 group-skip problem does not exist in these frames. */
  #bs-support-menu {
    position: fixed;
    top: var(--sup-top);
    left: max(clamp(34px, 3.8vw, 68px), 3.76vw);
    z-index: 16;
    display: grid; gap: calc(30px * var(--ui-scale));
    color: var(--text-soft);
  }
  /* WEIGHT GRAMMAR (RULED — Eric, Aug 24, pointing at the EXPANDED
     AWAY-NAV as the reference: "besides the hovered item, all other at
     rest items should use this font styling").

     The correction: .bs-item is the HOME menu's grammar and rests at
     weight 600. This list rests at the CAPSULE's weight — 300 — and only
     the hovered/previewed item rises to 600. (The locked item holds the
     same rung: lock is preview committed, so it stays 600.) Porting
     .bs-item verbatim carried the home menu's 600 into rest, which is
     what Eric caught.

     MEASURED against the design frames before changing anything — the
     five untouched labels measure identically in A-4 and 1-1, which
     validates the metric as a control:
       AT REST  frame stroke-run 1.41-1.81  ->  light 300 off 4.1%,
                                                semibold 600 off 98.6%
       POPPED   frame stroke-run 4.05       ->  600 + --glow-text-hover
                                                off 4.6%, while 300 +
                                                the same glow is off
                                                42.7% (so the pop is a
                                                REAL weight step, not
                                                the glow alone)
     Label widths agree independently: frame 99 / 155 px vs light
     101 / 156 and semibold 107 / 170.

     Everything else in .bs-item is already identical to the capsule
     link (var(--font-ui), 14px×ui, 15px line, letter-spacing 0), so
     font-weight is the ENTIRE delta. The HOME menu is untouched —
     its 14/600 rest is certified law. */
  /* ── THE SUB-LIST + THE SUB-ITEMS — FACTORED to the shared pair
     (Aug 28): .bs-menu-slot / .bs-sublist-wrap / .bs-sublist /
     .bs-subitem and the hollow-ring chosen marker are house grammar now
     (the expand-downward model, ruled Aug 25). The descender-clip room,
     the hugged hit targets, the snap-on glow and the 184px swept-surface
     trim all moved verbatim; this page consumes them unchanged. */

  /* ── THE PLATE STACK — mechanics FACTORED to the shared .bs-stack /
     .bs-plate family (Aug 28): the downward 0fr→1fr expansion, the
     right-hand warm markers with the fitted halo and ranking grammar,
     and the hover/open treatments are house grammar now. Placement stays
     page-side, as everywhere.
     A BOUNDED COLUMN (PROVISIONAL, read BY EYE): the plates occupy
     roughly 34%-74% of the frame width; the source SVGs are gone and the
     renders aspect-distorted, so these two numbers await the 1728×1117
     PNG exports (the standing §6 block). */
  #bs-stack {
    position: fixed;
    left: 34vw; right: 26vw;
    top: var(--sup-top);
    max-height: calc(94vh - var(--sup-top));
    z-index: 12;
  }

  #bs-support-menu .bs-item { font-weight: 300; }
  #bs-support-menu .bs-item.kb-hover,
  #bs-support-menu .bs-item:focus-visible,
  #bs-support-menu .bs-item.active { font-weight: 600; }

  /* ── The window — the MERGED bs-window subsystem, placed and sized ────
     Frame rect x[577,1137] top 243 -> left 33.39vw, width 32.47vw. The
     component owns every transition; the page owns geometry only.
     Height is set in PX BY THE MACHINE from measured content (the
     measurePitch discipline: never hardcode what the content decides),
     capped for the form so it scrolls internally like the frame's own
     scrollbar shows. */
  #bs-panel {
    position: fixed;
    left: 33.39vw;
    top: var(--sup-top);
    width: 32.47vw;
    height: calc(139px * var(--ui-scale));   /* boot value; the machine measures */
    z-index: 18;
    color: var(--text-soft);
  }
  #bs-panel .sup-body {
    position: absolute; inset: 0;
    padding: var(--sup-pad-t) var(--sup-pad-x) var(--sup-pad-b);
    overflow: hidden auto;
    overscroll-behavior: contain;   /* the panel's scroll never leaks to the page */
    scrollbar-width: thin;
    scrollbar-color: #ffffff5c transparent;
  }
  #bs-panel .sup-body::-webkit-scrollbar { width: calc(5px * var(--ui-scale)); }
  #bs-panel .sup-body::-webkit-scrollbar-thumb {
    background: #ffffff5c;
  }
  #bs-panel .sup-body::-webkit-scrollbar-track { background: transparent; }
  .sup-view[hidden] { display: none; }

  /* Kicker + marker — the 1-2 grammar: dim right-aligned label, the warm
     marker dot at the content box's left edge on the kicker's own line. */
  .sup-kicker {
    position: relative;
    margin: 0;
    text-align: right;
    color: var(--bs-label);
    font-family: var(--font-ui); font-weight: 300;
    font-size: calc(11px * var(--ui-scale));
    line-height: calc(13px * var(--ui-scale));
    letter-spacing: .04em;
    /* Same title/content divider as the form's fields — the window's two
       other faces share the grammar so the rule does not appear and
       vanish as the ladder walks. (Eric named the FORM specifically;
       carrying it to the kicker is mine, and one line strikes it.) */
    padding-bottom: var(--bs-rule-above);
    border-bottom: 1px solid var(--bs-rule);
  }
  /* The marker sits at the CONTENT box's left edge, which is where the
     frames put it (1-2: dot x657-661 against a content box starting at
     657). It previously hung at calc(--sup-pad-x * -1), i.e. out at the
     window's own edge — wrong by the full 80px pad. */
  /* top is MEASURED into --bs-dot-y (see alignMarkers in the script):
     the dot's centre lands on the text's CAP MIDPOINT. The fallback is
     for a dead script only, and it is HALF THE LINE BOX — never 50%,
     which resolves against a padding box that now carries the divider's
     air and drops the dot ~6px (the measured bug this replaced). */
  .sup-mark::before {
    content: ''; position: absolute;
    top: var(--bs-dot-y, calc(6.5px * var(--ui-scale)));
    left: 0;
    width: calc(5px * var(--ui-scale)); height: calc(5px * var(--ui-scale));
    background: var(--bs-marker-warm); border-radius: 50%;
    box-shadow: var(--bs-marker-warm-glow);
    transform: translateY(-50%);
  }
  /* Prose runs LEFT — the frames' own split: labels right, prose left
     (the 1-3 textarea does exactly this). Readability decides. */
  .sup-prose {
    margin: var(--bs-rule-below) 0 0;
    color: var(--text-soft);
    font-family: var(--font-sans); font-weight: 300;
    font-size: calc(12px * var(--ui-scale));
    line-height: 1.75;
    letter-spacing: .02em;
  }

  /* ── Request type — the option list: FACTORED to the shared
     .bs-options / .bs-option family (Aug 28). Right-aligned bold rows on
     the frames' 27px pitch, targets hugging their labels; the set itself
     stays a PLACEHOLDER in STR keys pending Eric's manifest confirm. */

  /* ── The form — FACTORED to the shared .bs-form / .bs-form-grid /
     .bs-field / .bs-input / .bs-area family (Aug 28): the title→divider→
     value grammar, the warm field markers with cap-midpoint alignment and
     the pointer-answering rank all moved verbatim (Eric's Aug 24/25
     rulings travel with them). */

  /* The chosen request type is a CONTROL: it returns to the picker (and
     it is the Esc ladder's own next rung down). */
  /* The chosen type READS OUT; it does not act. No pointer cursor and no
     hover bloom, because nothing happens when you press it — the way
     back to the picker is Esc, or the corner control, which is now
     level-aware and does the same thing. */
  .sup-chosen {
    width: 100%; padding: 0; border: 0; background: none;
    text-align: right;
    color: var(--ink);
    font-family: var(--font-ui); font-weight: 600;
    font-size: calc(13px * var(--ui-scale));
    line-height: calc(17px * var(--ui-scale));
    text-shadow: var(--glow-text);
  }
  .sup-chosen:focus { outline: none; }
  /* .bs-foot / .bs-note / .bs-submit — factored with the form (Aug 28);
     the inverted submit plate is the shared default. */

  /* ── The right rail — LOCK-SIDE FURNITURE ─────────────────────────────
     Eric's ruling: it does NOT exist during hover. Frame x[1379,1669] —
     its right edge lands on 59/1728 from the frame edge, which IS the
     utility cluster's own 58px inset: the rail hangs on the house's
     established right line rather than a bespoke fraction (the mix
     ruling). Width keeps the frame fraction. */
  #bs-rail {
    position: fixed;
    top: var(--sup-top);
    right: calc(58px * var(--ui-scale));
    width: 16.78vw; min-width: calc(230px * var(--ui-scale));
    z-index: 14;
    display: grid; gap: calc(18px * var(--ui-scale));
    opacity: 0; visibility: hidden; pointer-events: none;
    transition: opacity var(--pop-fade), visibility 0s var(--pop-fade-duration);
  }
  #bs-rail.is-on {
    opacity: 1; visibility: visible; pointer-events: auto;
    transition: opacity var(--pop-fade), visibility 0s;
  }
  .sup-rail-copy {
    margin: 0;
    color: var(--text-soft);
    font-family: var(--font-sans); font-weight: 300;
    font-size: calc(11px * var(--ui-scale));
    line-height: 1.5;
    letter-spacing: .01em;
  }
  /* The email capsule — a plate, not a pill: this page's geometry is
     hard-edged (the window's own corners are square with triangle
     marks), so the house 999px pill would read foreign here. */
  .sup-plate {
    width: 100%;
    height: calc(25px * var(--ui-scale));
    display: flex; align-items: center; justify-content: center;
    padding: 0 calc(10px * var(--ui-scale));
    border: 0;
    background: #ffffff1f;
    color: var(--ink);
    font-family: var(--font-sans); font-weight: 300;
    font-size: calc(11px * var(--ui-scale));
    letter-spacing: .01em;
    white-space: nowrap;
    cursor: var(--cursor-target);
    text-shadow: var(--glow-text);
    transition: background .16s, color .16s, text-shadow .2s ease;
  }
  .sup-plate:hover, .sup-plate:focus-visible, .sup-plate.kb-hover {
    background: #ffffff2e; color: #fff; outline: none;
    text-shadow: var(--glow-text-hover);
  }
  /* The form door — the frame's white + square joined to a grey label
     plate. One control, two halves. */
  .sup-door {
    display: flex; align-items: stretch; gap: 0;
    border: 0; padding: 0; background: none;
    cursor: var(--cursor-target);
    width: max-content;
  }
  .sup-door-plus {
    width: calc(30px * var(--ui-scale)); height: calc(30px * var(--ui-scale));
    display: grid; place-items: center;
    background: #ededed; color: #0b0b0a;
    font-family: var(--font-sans); font-weight: 300;
    font-size: calc(15px * var(--ui-scale)); line-height: 1;
    box-shadow: 0 0 calc(16px * var(--ui-scale)) rgba(255,255,255,.18);
    transition: background .16s, box-shadow .2s ease;
  }
  .sup-door-label {
    height: calc(30px * var(--ui-scale));
    display: flex; align-items: center;
    padding: 0 calc(16px * var(--ui-scale));
    background: #ffffff1f;
    color: var(--ink);
    font-family: var(--font-sans); font-weight: 300;
    font-size: calc(11px * var(--ui-scale));
    letter-spacing: .01em; white-space: nowrap;
    text-shadow: var(--glow-text);
    transition: background .16s, color .16s, text-shadow .2s ease;
  }
  .sup-door:hover .sup-door-plus, .sup-door:focus-visible .sup-door-plus,
  .sup-door.kb-hover .sup-door-plus {
    background: #fff; box-shadow: 0 0 calc(24px * var(--ui-scale)) rgba(255,255,255,.40);
  }
  /* THE DOOR REPORTS ITS OWN STATE (Eric, Aug 25, with the reference
     shot): filled plate = "open the form", hollow outline = "the form is
     open". Pressing it is what empties it. Every hover/cursor rule above
     is re-stated here at higher specificity so the fill cannot creep
     back under the pointer while the form stands. */
  .sup-door.is-active .sup-door-plus,
  .sup-door.is-active:hover .sup-door-plus,
  .sup-door.is-active:focus-visible .sup-door-plus,
  .sup-door.is-active.kb-hover .sup-door-plus {
    background: transparent;
    border: 1px solid var(--ink);
    color: var(--ink);
    box-shadow: none;
  }
  /* It still answers the pointer — as light, not as fill. */
  .sup-door.is-active:hover .sup-door-plus,
  .sup-door.is-active:focus-visible .sup-door-plus,
  .sup-door.is-active.kb-hover .sup-door-plus {
    box-shadow: 0 0 calc(18px * var(--ui-scale)) rgba(255,255,255,.30);
  }
  .sup-door:hover .sup-door-label, .sup-door:focus-visible .sup-door-label,
  .sup-door.kb-hover .sup-door-label {
    background: #ffffff2e; color: #fff; text-shadow: var(--glow-text-hover);
  }
  .sup-door:focus-visible { outline: none; }

  /* THE REDRAW'S SILENT FRAME. drawPanel collapses the window instantly
     before drawing it out again — but an inline `transition:none` on the
     panel reaches ONLY the panel: measured, ::after kept `top,left` at
     0.5s and the content child kept `opacity` at 0.41s, so the traveling
     corner slid back over half a second while the frame snapped, and the
     redraw did not read as the bs-window mechanic at all. This class
     silences all three for exactly that one frame. ID beats the
     component's class selectors, so no !important is needed. */
  #bs-panel.sup-nofx,
  #bs-panel.sup-nofx::before,
  #bs-panel.sup-nofx::after,
  #bs-panel.sup-nofx > * { transition: none; animation: none; }

  /* Commit-arrival resolve for browsers WITHOUT view transitions (the
     shared chrome carries the real cross-document morph): the two morph
     participants fade in on the tempo's companion fade. Cold boot never
     runs this — T0 discipline, nothing choreographs at a deep link. */
  @keyframes bs-arrive { from { opacity: 0; } }
  html.bs-arrive #bs-corner,
  html.bs-arrive #bs-wordmark { animation: bs-arrive var(--pop-fade); }
  @media (prefers-reduced-motion: reduce) {
    html.bs-arrive #bs-corner,
    html.bs-arrive #bs-wordmark { animation: none; }
  }

  /* PROVISIONAL narrow-portrait rules — mobile grammar is Eric's later
     design; these only prevent collisions meanwhile. The window and the
     rail cannot coexist with the menu at phone width, so the window
     takes the stage and the rail stacks beneath it. */
  @media (max-width: 900px) {
    #bs-support-menu { left: 6vw; }
    /* ONE narrow layout for BOTH levels: menu on top, the window capped
       below it, the rail at the foot. They all fit at 375x812 (measured:
       menu 177-345, panel 390-634, rail 669-780), and the window scrolls
       internally for anything taller.

       THE MENU STAYS LIVE UNDER THE LOCK, and that is load-bearing, not
       cosmetic. An earlier version of this block faded it to
       opacity:0 + pointer-events:none once locked, which made LOCKED on
       any of the five lorem items a TERMINAL STATE on a device with no
       Esc key: door #1 is the locked item itself (dead under
       pointer-events:none), door #2 returns early while locked, and the
       rail — whose door and request-type row are the only other unlock()
       callers — is never rendered for a lorem item. Nothing on screen
       could descend the ladder. The same rule also made denial INVISIBLE,
       since denyLocked() shakes the locked item inside the faded menu —
       audible but unseen, against the house law. Both faults were the
       fade; keeping the menu live fixes them together and restores the
       invariant this comment used to merely claim. Mobile grammar
       remains Eric's later design; this is still collision-prevention
       only. */
    #bs-panel { left: 6vw; width: 88vw; top: 48vh; max-height: 30vh; }
    #bs-rail  { left: 6vw; right: auto; width: 88vw; top: auto; bottom: 4vh; }
  }
</style>
</head>
<body data-bs-page="support">

<script>
// Pre-paint arrival read (inline so the entrance class exists at first
// paint; runs in microseconds — T0 interactivity is untouched). The flag
// is consumed HERE, once; the machine reads window.__bsArrival. Arrivals
// commit from home OR any sibling section now that ROUTES.support exists.
(function(){
  var from = null;
  try {
    from = sessionStorage.getItem('bs-nav-from');
    sessionStorage.removeItem('bs-nav-from');
  } catch (e) {}
  window.__bsArrival = (from === 'home' || from === 'software' || from === 'community' || from === 'hardware' || from === 'cart');
  window.__bsArrivalFrom = window.__bsArrival ? from : null;
  if (window.__bsArrival && !(window.CSS && CSS.supports && CSS.supports('view-transition-name: a'))){
    document.documentElement.classList.add('bs-arrive');
  }
})();
</script>

<script src="shared/bs-chrome.js"></script>
<script>
(function(){
'use strict';
var C = window.BSChrome;
var T = C.T, SoundBus = C.SoundBus;
var wake = C.wake, denyOn = C.denyOn, shakeEl = C.shakeEl, clickOk = C.clickOk, hapticTick = C.hapticTick;

var arrival     = window.__bsArrival === true;
var arrivalFrom = window.__bsArrivalFrom;

// ── THE CONTENT MANIFEST ──────────────────────────────────────────────────
// Six items, one ladder. CONTACT US is real; the other five carry LOREM
// through STR keys (Eric, Aug 24) — real copy swaps in at `excerpt`/`body`
// with no code change, and `real: true` is the only flag that turns the
// rail on. FAQ's sub-list is out of phase one; nothing here precludes it.
// TWO KINDS OF ITEM (the company, Aug 25, frames 1-4):
//   'form'  — CONTACT US alone. Opens the bs-window: request type, then
//             the form. The only tertiary WINDOW on the page.
//   'panel' — everything else. NO window. A click opens the item, and the
//             detail lives in a STACK OF PLATES on the right that each
//             EXPAND DOWNWARD in place. An item may also carry a SUB-LIST
//             that opens inside the MENU itself, pushing the items below
//             it down; picking a sub-item is what fills the stack.
//             Frame 1/2 show FAQ with a sub-list; frame 3/4 show RETURN &
//             REFUND POLICY going straight to its plates.
//
// STRUCTURE IS DATA, every string is an STR KEY: real copy replaces the
// key lists (or the strings behind them) with NO code change. The lorem
// shape below is chosen to exercise both item shapes, not to predict the
// real one — how many subs and rows each item really has is a manifest
// edit. Row bodies all point at supLoremBody for now; the real manifest
// gives each row its own key.
var LOREM_ROWS = ['supLoremRow1','supLoremRow2','supLoremRow3',
                  'supLoremRow4','supLoremRow5','supLoremRow6'];
function loremRows(n){
  return LOREM_ROWS.slice(0, n).map(function(k){ return { key: k, body: 'supLoremBody' }; });
}
var ITEMS = [
  { key: 'supContact',  kind: 'form' },
  { key: 'supFaq',      kind: 'panel', subs: [
      { key: 'supLoremSub1', rows: loremRows(6) },
      { key: 'supLoremSub2', rows: loremRows(3) },
      { key: 'supLoremSub3', rows: loremRows(5) },
      { key: 'supLoremSub4', rows: loremRows(2) },
      { key: 'supLoremSub5', rows: loremRows(4) }
  ]},
  { key: 'supWarranty', kind: 'panel', rows: loremRows(4) },
  { key: 'supReturn',   kind: 'panel', rows: loremRows(5) },
  { key: 'supGuides',   kind: 'panel', subs: [
      { key: 'supLoremSub1', rows: loremRows(3) },
      { key: 'supLoremSub2', rows: loremRows(6) }
  ]},
  { key: 'supBusiness', kind: 'panel', rows: loremRows(3) }
];
function isForm(i){ return i >= 0 && ITEMS[i].kind === 'form'; }
function subsOf(i){ return (i >= 0 && ITEMS[i].subs) || null; }
// The rows a given (item, sub) shows — an item with subs has none of its own.
function rowsFor(i, sub){
  if (i < 0) return null;
  var ss = subsOf(i);
  if (ss) return (sub >= 0 && ss[sub]) ? ss[sub].rows : null;
  return ITEMS[i].rows || null;
}
// Request types — PLACEHOLDER SET pending Eric's manifest confirm.
var REQ_TYPES = ['supReqConsulting', 'supReqOrder', 'supReqWarranty', 'supReqReturns', 'supReqBusiness'];

// ── Wordmark route (clean paths in production, .html locally) ─────────────
// Both sibling away pages carry this line; support shipped without it, so
// the wordmark pointed at a literal home.html and would 404 on the clean-
// path deployment — while the ‹ control and the Esc boundary, which both
// go through C.ROUTES, resolved correctly. Dates to phase one, not the
// two-level rebuild.
document.getElementById('bs-wordmark-link').setAttribute('href', C.ROUTES.home);

// ── DOM ───────────────────────────────────────────────────────────────────
var menuEl   = document.getElementById('bs-support-menu');
var panel    = document.getElementById('bs-panel');
var panelBody= document.getElementById('bs-panel-body');
var vRequest = document.getElementById('sup-view-request');
var vForm    = document.getElementById('sup-view-form');
var optionsEl= document.getElementById('sup-options');
var railEl   = document.getElementById('bs-rail');
var chosenEl = document.getElementById('sup-f-type');
var noteEl   = document.getElementById('sup-note');
// The note is dual-purpose: static copy from a STR key, AND a transient
// submit/validation message. Writing textContent alone meant a locale swap
// re-rendered the STATIC key over a live message while leaving .is-said
// stuck on it — the honest "nothing was sent" erased, the generic
// invitation left glowing in committed ink. Routing every write through
// setNote keeps data-str pointing at whatever is actually displayed, so
// renderStrings re-renders the RIGHT string in the new locale for free.
function setNote(key, said){
  noteEl.setAttribute('data-str', key || 'supFormNote');
  noteEl.textContent = T(key || 'supFormNote');
  noteEl.classList.toggle('is-said', !!said);
}
var emailBtn = document.getElementById('sup-email');
var doorBtn  = document.getElementById('sup-door');
var cornerEl = document.getElementById('bs-corner');
var backBtn  = document.getElementById('bs-back');
var primary  = document.getElementById('bs-primary');
var fwdBtn   = primary.querySelector('.site-primary-nav__forward-button');
var links    = Array.prototype.slice.call(primary.querySelectorAll('.site-primary-nav__link'));

// ── i18n render — factored to the pair (C.renderStrings, Aug 28) ──────────
var renderStrings = C.renderStrings;

// ── STATE — one focus variable, two commit levels ─────────────────────────
// focusIdx: THE cursor. Hover and the keyboard drive the same variable
//   (house law). It opens nothing and it is free to keep walking while a
//   window stands, so it can outlive openIdx.
// openIdx : the item whose window is OPEN, or -1. Set only by a click or
//   its keyboard twin.
// locked  : the deeper level (the form) is showing.
// view    : which face the window is rendering.
var focusIdx = -1;
var openIdx  = -1;
// PANEL items only: which sub-item is chosen inside the open item, and
// which plate in the stack is expanded. Both -1 when they do not apply.
var subIdx   = -1;
var rowIdx   = -1;
var locked   = false;   // FORM item only — the form is showing
var view     = 'excerpt';        // 'excerpt' | 'request' | 'form'
var chosenType = null;           // STR key of the chosen request type

function isLocked(){ return locked; }

// ── Menu build — C.buildSlots, the factored sub-list accordion (Aug 28):
// .bs-item consumed verbatim from the shared chrome; the slot/sub-list
// structure and its certified event order are /support's own, now shared.
// The callbacks below keep this page's semantics exactly: hover carries
// the cursor and nothing else; the click is the trigger; door #1 is
// level-aware; sub-clicks gate on the journal's clickOk window.
var built = C.buildSlots(menuEl, ITEMS, {
  itemId:  function(idx){ return 'bs-sup-' + idx; },
  onFocus: function(idx){ if (focusIdx !== idx) setFocus(idx); },
  onBlur:  function(idx){ if (focusIdx === idx) setFocus(-1); },
  onClick: function(idx){
    setFocus(idx);                                   // the click also carries the cursor
    if (openIdx === idx){
      if (!clickOk()) return;
      // Door #1, level-aware: the form item commits down then retreats
      // back; a panel item only ever retreats (goBack unwinds its deeper
      // levels one rung per press, exactly as Esc and the corner ‹ do).
      if (isForm(idx) && !locked){ lock(); return; }
      goBack();
      return;
    }
    if (clickOk()) openFor(idx);                     // switching is never denied
  },
  onSub: function(idx, sIdx){ if (clickOk()) chooseSub(idx, sIdx); }
});
var menuItems = built.items;
var subWraps  = built.subWraps;   // per item: the animating wrapper, or null
var subEls    = built.subEls;     // per item: its sub-item buttons, or null

// Menu pitch — MEASURED (item top -> next item top), never hardcoded, so
// the wheel trigger follows any spacing tune. The frames draw a UNIFORM
// 45px pitch, so one measured pitch honestly describes the whole list.
var menuPitch = 45;
function measurePitch(){ menuPitch = C.measureListPitch(menuItems, menuPitch); }

// ── Request-type options ──────────────────────────────────────────────────
var optionEls = [];
REQ_TYPES.forEach(function(k){
  var b = document.createElement('button');
  b.type = 'button';
  b.className = 'bs-option';
  b.setAttribute('role', 'option');
  b.setAttribute('data-str', k);
  b.setAttribute('data-req', k);
  b.addEventListener('mouseenter', function(){ if (!C.rail.isTouch()) setOptionFocus(optionEls.indexOf(b)); });
  // The options are NOT sticky. Sticky hover is the MENU's grammar — it
  // holds because leaving a menu item must not tear down the window the
  // item opened. Inside the window there is nothing to protect, so the
  // cursor follows the pointer and leaves with it (Eric, Aug 25: the last
  // hovered option kept glowing after the mouse left). Moving between two
  // options fires leave-then-enter in the same frame, so the light hands
  // over without a flicker.
  b.addEventListener('mouseleave', function(){
    if (C.rail.isTouch()) return;
    if (optionIdx === optionEls.indexOf(b)) setOptionFocus(-1);
  });
  // clickOk() is the journal's one-commit-per-400ms gate. chooseType was
  // the ONLY commit door that skipped it, and the picker's option 0
  // overlaps the form's request-type row, so a double-click committed on
  // the first click and the second landed on that row — which DOES gate
  // on clickOk(), passed because nothing had stamped the window — and
  // retreated straight back out. One double-click round-tripped the lock.
  b.addEventListener('click', function(){ wake(); if (clickOk()) chooseType(k); });
  optionsEl.appendChild(b);
  optionEls.push(b);
});
var optionIdx = -1;
function setOptionFocus(i){
  optionIdx = i;
  optionEls.forEach(function(o, n){ o.classList.toggle('kb-hover', n === i); });
}
function chooseType(k){
  chosenType = k;
  optionEls.forEach(function(o){
    o.classList.toggle('is-chosen', o.getAttribute('data-req') === k);
    o.setAttribute('aria-selected', String(o.getAttribute('data-req') === k));
  });
  SoundBus.play('commit'); hapticTick();
  // CHOOSING THE TYPE **IS** THE COMMIT (Eric, Aug 24): the form is the
  // level with something to lose, so it is the level that locks.
  if (openIdx >= 0) locked = true;      // choosing the type IS the commit
  if (locked) showFace(openIdx, true);
  render();
}

// ── The window ────────────────────────────────────────────────────────────
// HEIGHT IS MEASURED, never hardcoded (the measurePitch discipline): the
// panel is sized from the live content so a manifest edit needs no CSS.
// The form is CAPPED at the frame's own 600/1117 so it scrolls internally
// — which is exactly what frame 1-3's scrollbar shows.
var FORM_CAP_VH = 53.71;

// ── THE TWO LEVELS (RULED — Eric, Aug 24, relaying the design team) ──────
// There is NO separate excerpt rung. The window carrying the request type
// IS the preview; the level BELOW it is the one worth locking, because
// that is where there is something to LOSE (for CONTACT US, a half-filled
// form). The excerpt face I had invented is retired for the real item and
// survives only as the lorem items' own two levels.
//   PREVIEW   real -> the request-type face   ·  lorem -> its excerpt
//   LOCKED    real -> the form                ·  lorem -> its deeper body
// Only the FORM item ever opens the window, so its two faces are the
// only faces. Panel items live entirely in the menu and the stack.
function faceFor(i, locked){ return locked ? 'form' : 'request'; }
function viewEl(){ return view === 'form' ? vForm : vRequest; }
function measurePanel(){
  var el = viewEl();
  var was = el.hidden;
  if (was) el.hidden = false;
  var cs = getComputedStyle(panelBody);
  var pad = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);
  var h = el.scrollHeight + pad;
  if (was) el.hidden = true;
  var cap = window.innerHeight * FORM_CAP_VH / 100;
  if (view === 'form') h = Math.min(h, cap);
  // CEIL, never round: a half-pixel short and the panel grows a scrollbar
  // it does not need (the content would overflow its own measured box).
  return Math.ceil(h);
}
function sizePanel(){ panel.style.height = measurePanel() + 'px'; }

// Fill and show item i's face at the given level.
function setFace(i, locked){
  view = faceFor(i, locked);
  vRequest.hidden = (view !== 'request');
  vForm.hidden    = (view !== 'form');
  if (view === 'request') setOptionFocus(-1);
  renderChosen();
  sizePanel();
}
// A LEVEL change inside one item: the content snaps, the frame resizes on
// the tempo. (House law — surfaces fade, content snaps.)
function showFace(i, locked){ setFace(i, locked); }

// AN ITEM change: REDRAW (Eric, Aug 24 — "make the pop up window redraw
// itself every time I hover to another menu item"). The window is not a
// container whose contents swap; it is DRAWN FRESH per item, so the
// expansion mechanic runs every time. The collapse is INSTANTANEOUS —
// the transition is suppressed for exactly that frame — so a redraw costs
// ONE draw-out on the tempo instead of a retract plus a draw. The face is
// swapped and re-measured while collapsed, so nothing of the outgoing
// item is ever visible inside the incoming frame.
function drawPanel(i, locked){
  // .sup-nofx silences the panel AND its corner pseudo-elements AND the
  // content child — an inline transition:none on the panel alone leaves
  // the traveler and the content fade still running (measured).
  panel.classList.add('sup-nofx');
  panel.classList.remove('is-open');
  panel.classList.remove('is-hidden');
  void panel.offsetWidth;                 // commit the collapsed seed square
  setFace(i, locked);                     // swap + resize while invisible
  void panel.offsetWidth;
  panel.classList.remove('sup-nofx');
  void panel.offsetWidth;                 // commit the restored transitions
  panel.classList.add('is-open');         // …then draw out on the tempo
}
function hidePanel(){
  // .is-open STAYS. Removing it would cancel bsw-fall, and a cancelled
  // animation drops the fill back to whatever the normal cascade says —
  // which snapped a half-drawn window to its FULL frame at full opacity
  // and only then faded it. Leaving the class on keeps the animation
  // declared, so the fill holds exactly where the draw had reached and
  // the whole window fades from there. .is-hidden still wins every
  // conflict it cares about (pointer-events, visibility, opacity): it is
  // the same specificity and later in the sheet.
  // drawPanel() removes BOTH classes before re-opening, so the next draw
  // still restarts the animation from its first frame.
  panel.classList.add('is-hidden');
}
function renderChosen(){
  chosenEl.textContent = chosenType ? T(chosenType) : '—';
  chosenEl.setAttribute('aria-label', T('supReqType'));
}
/* MARKER ALIGNMENT — MEASURED, never assumed (Eric, Aug 24: "can we have
   the glow dots align to the texts vertically"). A dot centred on its
   line BOX is wrong twice over: the box carries leading, and once the
   divider's padding joined the box, top:50% fell a further 5.9px
   (measured) below the text — a regression the divider introduced. The
   eye aligns a dot to the text's CAP MIDPOINT, so the machine solves
   that offset per element from REAL font metrics and writes it into
   --bs-dot-y. Re-runs when the webfont lands and at every scale change,
   because both move the metrics; the frames put the marker in this same
   band (1-3px above the x-height centre across every sampled label). */
function alignMarkers(){
  var ks = document.querySelectorAll('.sup-kicker');
  for (var i = 0; i < ks.length; i++){
    var y = C.capMid(ks[i]);
    if (y !== null) ks[i].style.setProperty('--bs-dot-y', y.toFixed(2) + 'px');
  }
  var fs = document.querySelectorAll('.bs-field');
  for (var j = 0; j < fs.length; j++){
    var lab = fs[j].querySelector('label');
    if (!lab) continue;
    var yy = C.capMid(lab);
    if (yy !== null) fs[j].style.setProperty('--bs-dot-y', yy.toFixed(2) + 'px');
  }
  // The plates' right-hand markers ride the same solve, offset by the
  // plate's own top padding since the marker is placed against the ROW
  // while the metrics come from the TITLE inside it.
  var rs = document.querySelectorAll('.bs-plate');
  for (var k = 0; k < rs.length; k++){
    var ttl = rs[k].querySelector('.bs-plate-title');
    if (!ttl) continue;
    var mid = C.capMid(ttl);
    if (mid === null) continue;
    var padTop = parseFloat(getComputedStyle(rs[k]).paddingTop) || 0;
    rs[k].style.setProperty('--bs-dot-y', (padTop + mid).toFixed(2) + 'px');
  }
}

// ── THE PLATE STACK — the panel items' whole detail level ────────────────
// Built from the manifest every time (openIdx, subIdx) changes. Each plate
// expands DOWNWARD in place; one at a time, which is what the frames draw.
var stackEl = document.getElementById('bs-stack');
var rowEls  = [];
// Built through C.buildPlates — the factored plate stack (Aug 28); the
// manifest shape and the one-open-at-a-time grammar are unchanged.
function buildStack(){
  var rows = rowsFor(openIdx, subIdx);
  rowIdx = -1;
  rowEls = C.buildPlates(stackEl, rows, {
    onToggle: function(i){ if (clickOk()) toggleRow(i); }
  });
  if (!rows) return;
  renderStrings(stackEl);
  alignMarkers();      // the plates are new DOM — solve their markers too
}
// Picking a sub-item is what FILLS the stack (frames 1/2).
function chooseSub(i, sIdx){
  if (openIdx !== i) return;
  subIdx = sIdx;
  buildStack();
  SoundBus.play('commit'); hapticTick();
  render();
}
// One plate open at a time — pressing the open one closes it.
function toggleRow(i){
  var opening = (rowIdx !== i);
  rowIdx = opening ? i : -1;
  SoundBus.play(opening ? 'commit' : 'detent'); hapticTick();
  render();
}

// ── Render from state ─────────────────────────────────────────────────────
function render(){
  for (var i = 0; i < menuItems.length; i++){
    menuItems[i].classList.toggle('kb-hover', i === focusIdx && !isLocked());
    // .active marks the OPEN item — it holds its popped rendering while
    // the cursor is free to walk elsewhere.
    menuItems[i].classList.toggle('active', i === openIdx);
  }
  // State hook only — no CSS consumes it since the narrow-width lock
  // override was removed (it made LOCKED a terminal state). Kept as the
  // seam Eric's mobile grammar will want.
  panel.classList.toggle('sup-locked', isLocked());
  // THE RAIL now rides the ACTIVE real item at BOTH levels. Eric's earlier
  // "the rail belongs to LOCK" was ruled against the EXCERPT state, which
  // no longer exists: the preview is the request type itself, and the
  // rail's own door is the way INTO the locked form — gating it behind the
  // lock would leave both that door and the support address unreachable.
  // Frames 1-2 and 1-3 draw the rail at both levels. LABELED: one line
  // returns it to lock-only.
  // The corner control names its current job (see cornerBack).
  backBtn.setAttribute('aria-label', openIdx >= 0 ? T('navBack') : T('navHome'));
  // The form door empties while the form is up (see .sup-door.is-active).
  doorBtn.classList.toggle('is-active', isLocked());
  var railOn = isForm(openIdx);
  railEl.classList.toggle('is-on', railOn);
  railEl.setAttribute('aria-hidden', String(!railOn));
  // THE SUB-LISTS: only the open item's list is out, and only its chosen
  // sub carries the hollow ring. Tab reaches a list only while it is out.
  for (var w = 0; w < subWraps.length; w++){
    if (!subWraps[w]) continue;
    var on = (w === openIdx);
    subWraps[w].classList.toggle('is-on', on);
    for (var q = 0; q < subEls[w].length; q++){
      subEls[w][q].classList.toggle('is-chosen', on && q === subIdx);
      subEls[w][q].tabIndex = on ? 0 : -1;
    }
  }
  // THE STACK: present whenever the open panel item has rows to show —
  // which, for an item WITH a sub-list, means only after a sub is picked.
  var stackRows = rowsFor(openIdx, subIdx);
  var stackOn = !isForm(openIdx) && !!stackRows && stackRows.length > 0;
  stackEl.classList.toggle('is-on', stackOn);
  stackEl.setAttribute('aria-hidden', String(!stackOn));
  for (var r2 = 0; r2 < rowEls.length; r2++){
    rowEls[r2].classList.toggle('is-open', r2 === rowIdx);
    rowEls[r2].setAttribute('aria-expanded', String(r2 === rowIdx));
    rowEls[r2].tabIndex = stackOn ? 0 : -1;
  }
  // Tab enters the FORM only when locked (the machine law). The options
  // are the PREVIEW's own control, so they are reachable while it is up.
  var tabbable = isLocked();
  vForm.querySelectorAll('input, textarea, button').forEach(function(el){ el.tabIndex = tabbable ? 0 : -1; });
  optionEls.forEach(function(el){ el.tabIndex = (openIdx >= 0 && !isLocked()) ? 0 : -1; });
  railEl.querySelectorAll('button').forEach(function(el){ el.tabIndex = railOn ? 0 : -1; });
}

// THE CURSOR ONLY. It no longer touches the window — that is openFor's
// job now, and the two are deliberately independent so the cursor can
// keep walking while a window stands.
function setFocus(i){
  if (i === focusIdx) return;
  if (i >= 0 && C.rail.index() >= 0) C.rail.focus(-1);   // one cursor
  focusIdx = i;
  if (i >= 0){ SoundBus.play('detent'); hapticTick(); }
  render();
}
function focusStep(dir){
  var next;
  if (focusIdx < 0) next = dir > 0 ? 0 : ITEMS.length - 1;
  else {
    next = focusIdx + dir;
    if (next < 0 || next >= ITEMS.length) return false;   // wall — clamp, no wrap
  }
  setFocus(next);
  return true;
}

// ── OPEN / CLOSE — the click's own level ──────────────────────────────────
// Opening is where the REDRAW lives now (Eric, Aug 24: every new item
// re-runs the expansion from the seed square). Clicking a different item
// while one stands redraws for the new one.
function openFor(i){
  openIdx = i;
  locked = false;
  subIdx = -1;
  SoundBus.play('commit'); hapticTick();
  if (isForm(i)){
    buildStack();               // clears it — the form item has no plates
    drawPanel(i, false);        // …and the window draws instead
  } else {
    hidePanel();                // panel items never open the window
    buildStack();               // empty until a sub is picked, if it has subs
  }
  render();
}
function closeItem(){
  if (openIdx < 0) return;
  openIdx = -1;
  locked = false;
  subIdx = -1;
  // Never leave the keyboard inside a surface that is going away. The MENU
  // is deliberately excluded — the cursor outlives the item it opened.
  var a = document.activeElement;
  if (a && (panel.contains(a) || stackEl.contains(a)) && a.blur) a.blur();
  hidePanel();
  buildStack();
  render();
}

// ── LOCK / UNLOCK — the level below ───────────────────────────────────────
function lock(){
  if (openIdx < 0 || locked) return;
  locked = true;
  SoundBus.play('commit'); hapticTick();
  showFace(openIdx, true);  // a LEVEL change, not an item change — no redraw
  render();
}
// Lock retreats to PREVIEW — the ladder mirrors its own ascent (ratified).
function unlock(){
  if (!isLocked()) return;
  locked = false;
  // Retreating a level must not leave the keyboard inside the panel: the
  // form's controls are about to be untabbable, and a stranded focus
  // silently eats the menu's own keys.
  var _a = document.activeElement;
  if (_a && panel.contains(_a) && _a.blur) _a.blur();
  showFace(openIdx, false);
  render();
  SoundBus.play('detent'); hapticTick();
}
// denyLocked is GONE with the page lock (Eric, Aug 25). The deny shakes
// that REMAIN are not locks and are untouched: the away-nav's current
// section (ruled cross-page grammar), invalid submits (validation law),
// and the email capsule's copy failure (nothing fails silently).

// ── THE ESC LADDER — one honest level per press, through ONE function ─────
// field focus -> LOCKED -> OPEN -> the cursor -> boundary.
// The click grammar (the company, Aug 25) gives the ladder a real fifth
// rung: the window has its own press now, because the cursor no longer
// dies with it — hover opens nothing, so the cursor can outlive the
// window and must be cleared on its own step. (The cursor's rung and
// idle coincide — nothing else holds state at rest, the /community
// precedent.) Instrumented under ?dev.
// The rung list IS the ladder — walked by C.makeLadder (the factored
// instrumented walker, Aug 28): first live rung steps, one per press.
var ladder = C.makeLadder([
  { name: 'field',
    when: function(){
      if (!isLocked()) return false;
      var a = document.activeElement;
      return !!(a && panel.contains(a) && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA'));
    },
    // Blur only — parking focus on the panel's scroller swallows the
    // machine's keys (measured; the record is in this file's history).
    step: function(){ document.activeElement.blur(); } },
  { name: 'locked', when: isLocked, step: unlock },
  { name: 'plate',
    when: function(){ return rowIdx >= 0; },
    step: function(){ rowIdx = -1; render(); } },
  { name: 'sub',
    when: function(){ return subIdx >= 0; },
    step: function(){ subIdx = -1; buildStack(); render(); } },
  { name: 'window',
    when: function(){ return openIdx >= 0; },
    step: closeItem },
  { name: 'cursor',
    when: function(){ return focusIdx >= 0; },
    step: function(){ setFocus(-1); } },
  { name: 'boundary',
    when: function(){ return true; },
    step: function(){ if (arrival) popBoundary(); } }
]);
function goBack(){ ladder.back(); }

// ── The panel owns its keys while locked ──────────────────────────────────
// The #bs-icons exemption pattern: the machine stays blind to keys inside
// the window, so W/S/A/D typed into a field are text, not menu input.
// Esc still walks THE ladder — one function, both routes.
panel.addEventListener('keydown', function(e){
  if (openIdx < 0) return;
  e.stopPropagation();
  if (e.key === 'Escape'){ e.preventDefault(); wake(); goBack(); return; }
  if (view === 'request'){
    var k = e.key;
    if (k === 'w' || k === 'W' || k === 'ArrowUp' || k === 's' || k === 'S' || k === 'ArrowDown'){
      e.preventDefault(); wake();
      var down = (k === 's' || k === 'S' || k === 'ArrowDown');
      var n = optionIdx < 0 ? (down ? 0 : optionEls.length - 1) : optionIdx + (down ? 1 : -1);
      if (n < 0 || n >= optionEls.length) return;            // ends clamp silently
      setOptionFocus(n);
      SoundBus.play('detent'); hapticTick();
      return;
    }
    if (k === 'Enter' && optionIdx >= 0){
      e.preventDefault(); wake();
      chooseType(optionEls[optionIdx].getAttribute('data-req'));
    }
  }
});
// Leaving the WINDOW clears the option cursor outright — the backstop for
// a pointer that exits fast enough to skip an option's own mouseleave, or
// one that leaves from the panel's padding rather than off an option.
// pointerleave does not fire on child transitions, so moving among the
// options never trips it.
panel.addEventListener('pointerleave', function(e){
  if (e.pointerType && e.pointerType !== 'mouse') return;
  if (optionIdx >= 0) setOptionFocus(-1);
});

// DOOR #2 IS RETIRED (Eric, Aug 25: clicking empty window space "will
// also send me to a form field… seems to be a bug"). The window's GROUND
// is now inert.
//
// It was ratified as half of "TWO DOORS, ONE LOCK" on Aug 24 — but that
// was ruled when the window held a passive EXCERPT, where its ground was
// the only thing there to click. The window now holds the request-type
// picker: its own controls are the way forward, so a click on bare fill
// commits nothing. Door #1 (clicking the open menu item again) is
// unaffected and remains the commit for the five lorem items, whose
// windows carry no controls of their own.
//
// Nothing replaces the handler: the document-level sweep in the shared
// chrome already calls wake() on every pointerdown, and its stopPropagation
// guarded nothing (bindSweep listens on pointerdown, not click).

// The form's request-type row is a CONTROL: it retreats to the picker —
// which is the same rung the Esc ladder walks. (It was never wired in the
// first build.) The form's field values survive in the DOM, so choosing
// again returns to a form that kept everything.
// The request-type readout has NO click handler: retreating to the picker
// from here was Eric's Aug 25 strike. Esc and the level-aware corner
// control are the ways back, and both walk the one ladder function.

// ── The rail's two controls ───────────────────────────────────────────────
// The email capsule COPIES (Eric, Aug 24). mailto: was the alternative and
// is deliberately NOT used: it is an external hand-off, which would fire
// the THIRD PARTY overlay's second-consumer factoring trigger.
var _copyT = null;
emailBtn.addEventListener('click', function(){
  wake();
  var addr = T('supEmail');
  var said = function(){
    emailBtn.setAttribute('data-str', 'supEmailCopied');
    emailBtn.textContent = T('supEmailCopied');
    SoundBus.play('commit'); hapticTick();
    clearTimeout(_copyT);
    _copyT = setTimeout(function(){
      emailBtn.setAttribute('data-str', 'supEmail');
      emailBtn.textContent = T('supEmail');
    }, 1400);
  };
  var failed = function(){ denyOn(emailBtn); };   // nothing fails silently
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(addr).then(said).catch(failed);
    return;
  }
  try {
    var ta = document.createElement('textarea');
    ta.value = addr; ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
    document.body.appendChild(ta); ta.select();
    var ok = document.execCommand('copy');
    document.body.removeChild(ta);
    ok ? said() : failed();
  } catch (err) { failed(); }
});
// The form door — the rail's own way into the locked level, skipping the
// request-type choice (the form's first row still carries it, and Submit
// denies until it is set). From PREVIEW this is a COMMIT.
doorBtn.addEventListener('click', function(){
  wake();
  if (!isForm(openIdx)) return;
  if (!isLocked()){
    if (!clickOk()) return;
    lock();
  } else {
    showFace(openIdx, true);
  }
  var first = document.getElementById('sup-f-name');
  try { first.focus({ preventScroll: true }); } catch (e) {}
});

// ── Submit — a LABELED STUB to a marked seam ──────────────────────────────
// Validation denies LOUDLY: the offending field shakes and takes focus;
// nothing fails silently. On a valid submit the UX runs to completion and
// then says honestly that nothing was sent — the wiring ruling (endpoint /
// mailto fallback / disabled-until-go-live) drops in AT THE SEAM BELOW
// with no rework. NOTE: if the ruling sends anything off-site, the THIRD
// PARTY overlay gains its second consumer and must be factored into the
// shared pair first (canon §7).
vForm.addEventListener('submit', function(e){
  e.preventDefault();
  wake();
  var bad = null;
  if (!chosenType) bad = chosenEl;
  // The factored house validation grammar (C.validateFields, Aug 28) —
  // same required set, same email test, first offender back.
  if (!bad) bad = C.validateFields([
    document.getElementById('sup-f-name'),
    document.getElementById('sup-f-email'),
    document.getElementById('sup-f-subject'),
    document.getElementById('sup-f-requests')
  ]);
  if (bad){
    setNote('supInvalid', false);
    denyOn(bad.closest('.bs-field') || bad);
    try { bad.focus({ preventScroll: true }); } catch (err) {}
    return;
  }
  SoundBus.play('commit'); hapticTick();
  // ══ SUBMIT SEAM — the wiring ruling lands HERE ══════════════════════
  // if (ENDPOINT) fetch(ENDPOINT, {...}); else if (MAILTO) ...; else:
  setNote('supSubmitPending', true);
});

// ── Corner nav ────────────────────────────────────────────────────────────
var pillPrimary = C.bindPill(primary, fwdBtn);
pillPrimary.onOpenChange = function(open){
  links.forEach(function(l){ l.tabIndex = open ? 0 : -1; });
  primary.setAttribute('aria-expanded', String(open));
};
pillPrimary.onOpenChange(false);

var _leaving = false;
function leaveHome(){
  if (_leaving || !clickOk()) return;
  _leaving = true;
  if (arrival && arrivalFrom === 'home'){
    setTimeout(function(){
      if (_leaving && !document.hidden){ _leaving = false; location.assign(C.ROUTES.home); }
    }, 350);
    history.back();
    return;
  }
  location.assign(C.ROUTES.home);
}
function popBoundary(){
  if (_leaving) return;
  _leaving = true;
  setTimeout(function(){
    if (_leaving && !document.hidden){ _leaving = false; location.assign(C.ROUTES.home); }
  }, 350);
  history.back();
}
// THE CORNER ‹ IS LEVEL-AWARE (RULED — Eric, Aug 25): once a second
// level or higher is open, it descends ONE level instead of leading
// home — the pointer's equivalent of Esc, through the very same ladder
// function, so the two can never disagree. Below that it keeps its
// labeled HOME semantic (the witness grammar, and the divergence from
// Esc's strict-LIFO boundary pop that is already on record).
// The WORDMARK deliberately does NOT change: it stays the unconditional
// route home, so there is always one press that leaves the page no
// matter how deep the ladder goes.
function cornerBack(){
  // clickOk gates the descent for the same reason it gates every other
  // commit/back door (journal canon): without it a double-click drops
  // TWO levels. leaveHome() carries its own gate already.
  if (openIdx >= 0){ if (clickOk()) goBack(); return; }   // level 2+ -> one down
  leaveHome();                                            // level 0-1 -> home, as labeled
}
(backBtn.closest('.bs-hit') || backBtn).addEventListener('click', function(){ wake(); cornerBack(); });

// SUPPORT is the current section — it DENIES with the shake (ruled).
links.forEach(function(link){
  link.addEventListener('click', function(e){
    e.stopPropagation();
    wake();
    var sec = link.getAttribute('data-section');
    if (sec !== 'support' && C.ROUTES[sec]){
      if (clickOk()) C.nav.commit(sec);
      return;
    }
    denyOn(link);
  });
});
primary.addEventListener('click', function(e){
  if (e.target.closest('.site-primary-nav__link')) return;
  wake();
  if (pillPrimary.touchOpenConsumed()) return;
  if (C.rail.lockIndex() === RAIL_PILL) C.rail.unlock();
  else C.rail.lock(RAIL_PILL);
});

// ── Mount ─────────────────────────────────────────────────────────────────
var RAIL_BACK = 0, RAIL_PILL = 1;
C.init({
  page: 'support',
  leadingControls: [
    { headEl: backBtn, pill: null, activate: cornerBack },   // keyboard twin
    { headEl: primary, pill: pillPrimary, trayAxis: 'x',
      trayItems: function(){ return links; } }
  ],
  touchSurfaces: [document.getElementById('bs-stage'), menuEl],
  sweepRoots: [cornerEl, menuEl, panel, railEl, stackEl],
  hooks: {
    // THE PAGE LOCK IS CANCELLED (Eric, Aug 25). The machine's lock
    // gates — frozen menu, denied W/S and wheel, hover suppression,
    // Enter suppression — all key off this hook, so reporting false
    // retires the whole freeze in one place. The page KEEPS its internal
    // `locked` level state: the Esc ladder, the window faces, the form
    // door and Tab gating all still need to know WHICH level is showing;
    // they just no longer freeze anything around it.
    // The idle sweep is the one thing the machine's lock check was
    // protecting (a half-filled form must never be swept by attract) —
    // that guard moved into idleReset below, where it belongs.
    isLocked:       function(){ return false; },
    goBack:         goBack,
    escapeFromRail: function(){ setFocus(0); },      // rail -> the primary surface
    enterAtPrimary: function(){
      // Enter is the CLICK's twin, rung for rung: it claims the cursor
      // cold, opens, and then walks the same level-aware door #1 —
      // the form item commits down then retreats back; a panel item
      // retreats (its deeper levels are chosen by their own controls).
      if (focusIdx < 0){ setFocus(0); return; }
      if (openIdx !== focusIdx){ openFor(focusIdx); return; }
      if (isForm(focusIdx) && !locked){ lock(); return; }
      goBack();
    },
    verticalStep:   function(down){
      // At the FIRST item, W/^ hands the cursor to the icon bar (the home
      // menu's own top-wall zone transition).
      if (!down && focusIdx === 0){ setFocus(-1); C.rail.focus(0); return; }
      focusStep(down ? 1 : -1);
    },
    railVertical:   function(down){
      if (down){ C.rail.focus(-1); setFocus(0); }     // strip -> menu
    },
    horizontalCold: function(){ /* A/D drive the rail only — inert here */ },
    // WHEEL OWNERSHIP SWITCHES WITH THE LOCK. At menu level the wheel
    // steps the menu on the measured pitch; inside the locked window it
    // belongs to the panel's native scroll and the bridge hands off
    // entirely (ends clamp silently, as everywhere).
    wheelNative:    function(e){
      // The STACK owns its wheel whenever it can actually scroll.
      if (stackEl.contains(e.target)){
        return stackEl.scrollHeight > stackEl.clientHeight + 1;
      }
      if (!panelBody.contains(e.target)) return false;
      if (isLocked()) return true;          // the locked panel owns its wheel outright
      // While merely OPEN the wheel still belongs to the MENU, so the
      // cursor can walk past a standing window — UNLESS the panel is
      // genuinely clipped, which the provisional narrow-width cap can
      // do; its own content must stay reachable.
      return panelBody.scrollHeight > panelBody.clientHeight + 1;
    },
    wheelStep:      focusStep,
    wheelPitch:     function(){ return menuPitch; },
    clearPrimary:   function(){ if (focusIdx >= 0 && !isLocked()) setFocus(-1); },
    // Attract: everything pops back in — the window included. A LOCKED
    // window is exempt upstream (armIdle re-arms without resetting), so
    // a half-filled form is never swept away.
    idleReset:      function(){
      setFocus(-1); C.rail.focus(-1);
      // The machine used to skip idleReset entirely while the page was
      // locked; with the lock cancelled the page guards itself: attract
      // clears the cursor everywhere but never sweeps the FORM level —
      // a half-filled form is the one state with something to lose.
      if (!locked) closeItem();
    },
    onLangChange:   function(T2){
      links.forEach(function(l){ l.textContent = T2(l.getAttribute('data-section')); });
      renderStrings();
      // Re-render whichever face is live, at its current level.
      if (openIdx >= 0) setFace(openIdx, isLocked());
      else renderChosen();
      document.title = T2('supportTitle');
    },
    onFontsReady:   function(){
      measurePitch();
      alignMarkers();                       // the webfont's metrics are the real ones
      if (openIdx >= 0) sizePanel();
    },
    devState:       function(){
      return { focusIdx: focusIdx, openIdx: openIdx, subIdx: subIdx, rowIdx: rowIdx,
               locked: locked, view: view, rung: ladder.last(),
               chosenType: chosenType, menuPitch: menuPitch, arrival: arrival,
               railOn: railEl.classList.contains('is-on') };
    }
  }
});

// ── Boot — cold or arrived, interactive at first paint ────────────────────
renderStrings();
links.forEach(function(l){ l.textContent = T(l.getAttribute('data-section')); });
// The init-time rule-6 pass saw the sub-items EMPTY (their STR labels
// render just above, after C.init) — re-solve now that n is real.
C.normalizeWordGlow();
renderChosen();
measurePitch();
alignMarkers();
render();

window.addEventListener('resize', function(){
  alignMarkers();                           // --ui-scale moved: so did the metrics
  if (openIdx >= 0) sizePanel();
});
window.addEventListener('pageshow', function(e){
  if (e.persisted){
    _leaving = false;
    closeItem();
    setFocus(-1);
    C.rail.focus(-1);
  }
});

})();
</script>
</body>
</html>
