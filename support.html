<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#040402">
<title>BACKSPACE — Support</title>
<!--
  backspace — /support (page four), phase one: the CONTACT US anchor.
  Mounts the ratified shared pair; the window is the merged bs-window
  subsystem (no bespoke panel exists on this page).

  DESIGN AUTHORITY (RULED — Eric, Aug 24): this page was never built by
  the previous engineer, so there is no dev-build witness. The design
  team's frames (A-4 rest · 1-1 CONTACT US · 1-2 request type · 1-3 form,
  all 1728x1117) are VISUAL REFERENCE, MIXED with the shipped pages' own
  grammar — not an exact-value port. Where the frames and the house
  diverge, the house wins and the deviation is labeled here. Measurements
  behind every ported value: reports/support_phase1_initiation_audit.md
  (Eric sanctioned the PNG convention, +-1px frame units).

  THE CLICK-TO-OPEN LADDER (RULED — the company, Aug 25; this SUPERSEDES
  the Aug 24 hover-lock grammar). HOUSE-WIDE RULE: only the two icon bars
  — the top-right utility cluster and the top-left away nav — keep
  hover-expansion. EVERY other menu requires a CLICK to trigger its
  secondary expansion or window pop-up. Recorded here because it governs
  every page still to come (FAQ's sub-list, hardware), not just this one.

  Each of the six items now runs four states:
    REST.
    FOCUSED. Hover — or the W/S cursor — pops the item out with the
      signal-red dot and the glow (home-menu grammar, verbatim). It
      opens NOTHING. Leaving retracts it.
    OPEN. A CLICK on the item draws its window out center-stage: the
      request type for CONTACT US, its own content for the other five.
      The window is the committed surface; the cursor is free to keep
      walking the menu while it stands.
    LOCKED. Choosing a request type, clicking the OPEN item again, or
      clicking the window's ground commits to the level below — the
      form — which is the level with something to lose.

  WHAT THIS RETIRED, and why: STICKY HOVER is gone. Sticky existed for
  exactly one reason — leaving a menu item must not tear down the window
  that item had opened. Hover opens nothing now, so there is nothing to
  protect and the item retracts on leave, which is the certified
  home-menu grammar restored. KEYBOARD PREVIEW PARITY is gone with it:
  W/S walks the cursor and opens nothing, because Enter is the click's
  twin. Both were ratified Aug 24 against the hover model and fall with
  it; the parity that MATTERS is preserved — click <-> Enter, and every
  hover state still has a keyboard twin.

  Touch and mouse now converge exactly: the old "first tap previews,
  second locks" two-step IS the click grammar, with no hover branch to
  special-case.

  CONTENT: CONTACT US is real. The other five ride the SAME ladder with
  LOREM through the STR manifest (Eric, Aug 24) — real copy swaps in at
  the keys, no code changes. FAQ's sub-list and answer states are OUT of
  phase one; nothing here precludes them.

  STAGE: blank black per the standing scene-format gate. SCENE SEAM is
  #bs-stage; video / bake / still all remain possible.

  MACHINE LAW on this page: three zones on one cursor — the top strip
  (away nav, SUPPORT DENIES as current, plus utilities; A/D) - the menu
  (W/S) - the locked window (keys remap inside; Tab enters the form only
  when locked). Wheel ownership SWITCHES with the lock: at menu level the
  wheel steps the menu on a MEASURED pitch (first away-page consumer of
  the C14 bridge); inside the locked window the wheel belongs to the
  panel's native scroll (the wheelNative seam in the shared chrome), and
  unlock hands it back. The Esc ladder walks ONE honest level per press
  through ONE function, and the click grammar gives it a real fifth rung:
  field focus -> LOCKED -> OPEN -> the cursor -> the page boundary. The
  window now closes on its own press, because the cursor can outlive it.
  (Rest and idle coincide here — nothing else holds state at rest, as on
  /community.) Denial is visible and audible everywhere: the current
  away-nav section, foreign axes, a frozen menu under the lock, invalid
  submits.

  SUBMIT IS A LABELED STUB pending the wiring ruling (endpoint / mailto /
  disabled-until-go-live): the full submit UX runs to a marked seam and
  says honestly that nothing was sent. No path leaves the site, so the
  THIRD PARTY overlay's second-consumer factoring trigger has NOT fired.
-->
<link rel="stylesheet" href="shared/bs-chrome.css">
<style>
  /* ── Page tokens ──────────────────────────────────────────────────────
     THE SHARED TOP LINE: the frames start the menu, the window and the
     rail on one line (window top 243, menu ink 247, rail ink 248 of
     1117) — 243/1117 -> 21.76vh. One token so the three cannot drift. */
  body[data-bs-page="support"] {
    --sup-top: 21.76vh;
    /* NEW MARKER VOCABULARY (canon §9 entry owed — noted at close per
       the seed). The frames' field/kicker markers are NOT the signal-red
       menu dot: measured warm white ~#f2e7d5 at 5x5. The menu's own dot
       measured #9d1f00 EXACTLY — the house token, untouched. Two marker
       vocabularies by design; do not harmonize them. */
    --sup-marker: #f2e7d5;
    /* THE MARKER'S HALO — FITTED to the frame, not guessed (Eric's Aug 24
       close-ups show it plainly; my first pass built a 7px shadow and was
       far too tight). Measured radial falloff of the request-type marker
       in 1-3, with EMPTY window regions as the control (they read 0.0-0.5
       above fill, so the tail is real glow and not the translucent fill
       compositing over the lit scene):
         r 0-3 +95 · 6-9 +24 · 12-15 +19 · 18-21 +13 · 24-27 +7 ·
         30-33 +4 · 36-39 +3 · reaching ~40px before it dies.
       A blur of a 5px dot cannot make that plateau, so the ladder carries
       SPREAD — the house's own dot-glow idiom (.bs-item::before is
       0 0 12px 2px; .bs-round is 0 0 15px 1px). Fitted ladder tracks the
       frame within ~1-6 luma from r=6 outward. Radii <=44px: rule 5's
       96px cap is a FILTER-chain rule anyway, and box-shadows compose in
       parallel like text-shadow rings — no texture inflation.
       The dot's own colour is EXACT: the frame's core pixel reads
       (242,231,213) = #f2e7d5. */
    --sup-marker-glow:
      0 0 calc(9px  * var(--ui-scale))                              rgba(242, 231, 213, .85),
      0 0 calc(32px * var(--ui-scale)) calc(3px  * var(--ui-scale)) rgba(242, 231, 213, .42),
      0 0 calc(44px * var(--ui-scale)) calc(14px * var(--ui-scale)) rgba(242, 231, 213, .16);
    /* THE FIELD DIVIDER (RULED — Eric, Aug 24: "there is actually a
       divider line in between form titles and the text input area").
       It sits between every title and its value, spanning the field's
       full column. NOTE ON SOURCING, honestly: the line is NOT resolvable
       in the 1728px PNG export — the label->value gap profiles flat at
       the fill level — so this is built from Eric's close-up plus the
       house's own hairline token rather than measured off the frame.
       --panel-line is what the chrome already uses for exactly this. */
    --sup-rule: var(--panel-line);
    /* THE RULE SITS IN THE MIDDLE (RULED — Eric, Aug 24, on the preview
       close-up: "too close to CONTACT US and too far from the excerpt...
       the divider should sit in middle between the upper and lower
       elements, with equal paddings").
       Equal INK-to-rule distance is NOT equal CSS padding: the two
       neighbours carry different half-leading (the kicker is a 13px line
       box on 11px caps; the prose is a 1.75 box on 12px WITH descenders;
       the form's value is a 17px box on 13px caps). So the CSS values
       differ on purpose, and they are MEASURED — verified in the browser
       with canvas font metrics (actualBoundingBox*), not eyeballed.
       Retune by re-running that measurement, never by nudging one side. */
    --sup-rule-above: calc(14px * var(--ui-scale));
    --sup-rule-below: calc(8px  * var(--ui-scale));
    --sup-fld-above:  calc(7px  * var(--ui-scale));
    --sup-fld-below:  calc(4px  * var(--ui-scale));
    /* The picker needs its own value: its options ride a 27px line box
       (the frame's option pitch), whose half-leading pushes the first
       option's ink 3.7px further down than the prose's would go. */
    --sup-opt-below:  calc(4px  * var(--ui-scale));
    /* The panel's own interior rhythm (component internals ride ui-scale,
       page placement rides frame fractions — the certified split). The
       frames draw 80px side pads in 1-2 and 52/86 in 1-3; harmonized to
       ONE symmetric 80px box, the internally consistent reading. */
    --sup-pad-x: calc(80px * var(--ui-scale));
    --sup-pad-t: calc(52px * var(--ui-scale));
    --sup-pad-b: calc(30px * var(--ui-scale));
    --sup-label: #ffffff94;
    /* Where a field's marker sits when the pointer is elsewhere. The
       hovered field's dot takes the fitted halo at full; this is the
       rank the others fall to, and it is the tunable if the resting
       dots read too faint. */
    --sup-dot-rest: .45;
  }

  /* ── The menu — SIX items, the home menu's own grammar ────────────────
     .bs-item is consumed VERBATIM from the shared chrome (pop-out, the
     signal-red dot, the glow ladder, the hit-area rhythm): this list and
     the title screen's menu are the same control in two placements. Only
     placement is page-side. Frame: x65 -> 3.76vw, which is the EXACT
     second term of the home menu's anchor — the away-page content column
     and the title-screen menu ride one rail. Pitch measured 45px uniform
     (gap 30 + the 15px line box); the superseded nine-layer table's
     30/65 group-skip problem does not exist in these frames. */
  #bs-support-menu {
    position: fixed;
    top: var(--sup-top);
    left: max(clamp(34px, 3.8vw, 68px), 3.76vw);
    z-index: 16;
    display: grid; gap: calc(30px * var(--ui-scale));
    color: var(--text-soft);
  }
  /* WEIGHT GRAMMAR (RULED — Eric, Aug 24, pointing at the EXPANDED
     AWAY-NAV as the reference: "besides the hovered item, all other at
     rest items should use this font styling").

     The correction: .bs-item is the HOME menu's grammar and rests at
     weight 600. This list rests at the CAPSULE's weight — 300 — and only
     the hovered/previewed item rises to 600. (The locked item holds the
     same rung: lock is preview committed, so it stays 600.) Porting
     .bs-item verbatim carried the home menu's 600 into rest, which is
     what Eric caught.

     MEASURED against the design frames before changing anything — the
     five untouched labels measure identically in A-4 and 1-1, which
     validates the metric as a control:
       AT REST  frame stroke-run 1.41-1.81  ->  light 300 off 4.1%,
                                                semibold 600 off 98.6%
       POPPED   frame stroke-run 4.05       ->  600 + --glow-text-hover
                                                off 4.6%, while 300 +
                                                the same glow is off
                                                42.7% (so the pop is a
                                                REAL weight step, not
                                                the glow alone)
     Label widths agree independently: frame 99 / 155 px vs light
     101 / 156 and semibold 107 / 170.

     Everything else in .bs-item is already identical to the capsule
     link (var(--font-ui), 14px×ui, 15px line, letter-spacing 0), so
     font-weight is the ENTIRE delta. The HOME menu is untouched —
     its 14/600 rest is certified law. */
  #bs-support-menu .bs-item { font-weight: 300; }
  #bs-support-menu .bs-item.kb-hover,
  #bs-support-menu .bs-item:focus-visible,
  #bs-support-menu .bs-item.active { font-weight: 600; }

  /* ── The window — the MERGED bs-window subsystem, placed and sized ────
     Frame rect x[577,1137] top 243 -> left 33.39vw, width 32.47vw. The
     component owns every transition; the page owns geometry only.
     Height is set in PX BY THE MACHINE from measured content (the
     measurePitch discipline: never hardcode what the content decides),
     capped for the form so it scrolls internally like the frame's own
     scrollbar shows. */
  #bs-panel {
    position: fixed;
    left: 33.39vw;
    top: var(--sup-top);
    width: 32.47vw;
    height: calc(139px * var(--ui-scale));   /* boot value; the machine measures */
    z-index: 18;
    color: var(--text-soft);
  }
  #bs-panel .sup-body {
    position: absolute; inset: 0;
    padding: var(--sup-pad-t) var(--sup-pad-x) var(--sup-pad-b);
    overflow: hidden auto;
    overscroll-behavior: contain;   /* the panel's scroll never leaks to the page */
    scrollbar-width: thin;
    scrollbar-color: #ffffff5c transparent;
  }
  #bs-panel .sup-body::-webkit-scrollbar { width: calc(5px * var(--ui-scale)); }
  #bs-panel .sup-body::-webkit-scrollbar-thumb {
    background: #ffffff5c;
  }
  #bs-panel .sup-body::-webkit-scrollbar-track { background: transparent; }
  .sup-view[hidden] { display: none; }

  /* Kicker + marker — the 1-2 grammar: dim right-aligned label, the warm
     marker dot at the content box's left edge on the kicker's own line. */
  .sup-kicker {
    position: relative;
    margin: 0;
    text-align: right;
    color: var(--sup-label);
    font-family: var(--font-ui); font-weight: 300;
    font-size: calc(11px * var(--ui-scale));
    line-height: calc(13px * var(--ui-scale));
    letter-spacing: .04em;
    /* Same title/content divider as the form's fields — the window's two
       other faces share the grammar so the rule does not appear and
       vanish as the ladder walks. (Eric named the FORM specifically;
       carrying it to the kicker is mine, and one line strikes it.) */
    padding-bottom: var(--sup-rule-above);
    border-bottom: 1px solid var(--sup-rule);
  }
  /* The marker sits at the CONTENT box's left edge, which is where the
     frames put it (1-2: dot x657-661 against a content box starting at
     657). It previously hung at calc(--sup-pad-x * -1), i.e. out at the
     window's own edge — wrong by the full 80px pad. */
  /* top is MEASURED into --sup-dot-y (see alignMarkers in the script):
     the dot's centre lands on the text's CAP MIDPOINT. The fallback is
     for a dead script only, and it is HALF THE LINE BOX — never 50%,
     which resolves against a padding box that now carries the divider's
     air and drops the dot ~6px (the measured bug this replaced). */
  .sup-mark::before {
    content: ''; position: absolute;
    top: var(--sup-dot-y, calc(6.5px * var(--ui-scale)));
    left: 0;
    width: calc(5px * var(--ui-scale)); height: calc(5px * var(--ui-scale));
    background: var(--sup-marker); border-radius: 50%;
    box-shadow: var(--sup-marker-glow);
    transform: translateY(-50%);
  }
  /* Prose runs LEFT — the frames' own split: labels right, prose left
     (the 1-3 textarea does exactly this). Readability decides. */
  .sup-prose {
    margin: var(--sup-rule-below) 0 0;
    color: var(--text-soft);
    font-family: var(--font-sans); font-weight: 300;
    font-size: calc(12px * var(--ui-scale));
    line-height: 1.75;
    letter-spacing: .02em;
  }

  /* ── Request type — the option list ───────────────────────────────────
     Frame 1-2 draws one option twice; that is an ARTIFACT, not a repeat
     (seed). Shipped as one list, right-aligned bold on the frame's 27px
     pitch. The set itself is a PLACEHOLDER pending Eric's manifest
     confirm — it lives in STR keys, so the real list is a copy edit. */
  .sup-options { margin-top: var(--sup-opt-below); display: grid; }
  /* THE TARGET HUGS THE LABEL. These were width:100% blocks, so although
     the text is right-aligned every option's hit box spanned the whole
     content width — a click 400px to the LEFT of "warranty & repair", on
     what plainly looks like empty window, selected it. That is the other
     half of Eric's Aug 25 report, and it would have kept firing after
     door #2 was retired. The box now sizes to its label and is pushed
     right by the auto margin; the left padding keeps a generous vicinity
     (the house's .bs-hit philosophy: bounded, not unbounded). */
  .sup-option {
    display: block;
    width: max-content; max-width: 100%;
    margin-left: auto;
    padding: 0 0 0 calc(24px * var(--ui-scale));
    border: 0; background: none;
    text-align: right;
    color: var(--ink);
    font-family: var(--font-ui); font-weight: 600;
    font-size: calc(13px * var(--ui-scale));
    line-height: calc(27px * var(--ui-scale));   /* the frame's option pitch */
    letter-spacing: 0;
    text-shadow: var(--glow-text);
    cursor: var(--cursor-target);
    transition: color .16s, text-shadow .2s ease;
  }
  /* ONE visual channel for the cursor (house law): the bloom renders only
     through .kb-hover, which mouseenter and the keyboard both drive. */
  .sup-option.kb-hover, .sup-option:focus-visible {
    color: #fff; outline: none;
    text-shadow: var(--glow-text-hover);
  }
  .sup-option.is-chosen { color: #fff; }

  /* ── The form ─────────────────────────────────────────────────────────
     Frame 1-3: two columns, labels right-aligned above right-aligned
     values, a marker dot per field at its column's left edge. The values
     are real inputs with no chrome — the design draws typed text, not
     boxes, so the field IS its value. Focus lights the marker and the
     value's glow (the house's one focus channel). */
  .sup-form { display: grid; gap: calc(30px * var(--ui-scale)); }
  .sup-grid {
    display: grid; grid-template-columns: 1fr 1fr;
    column-gap: calc(61px * var(--ui-scale));
    row-gap: calc(30px * var(--ui-scale));
  }
  /* title -> divider -> value. The label is a stretched grid item, so its
     own border IS the full-column rule; no extra element needed. */
  .sup-field { position: relative; display: grid; gap: var(--sup-fld-below); }
  .sup-field--wide { grid-column: 1 / -1; }
  .sup-field > label {
    text-align: right;
    color: var(--sup-label);
    font-family: var(--font-ui); font-weight: 300;
    font-size: calc(11px * var(--ui-scale));
    line-height: calc(13px * var(--ui-scale));
    letter-spacing: .04em;
    padding-bottom: var(--sup-fld-above);
    border-bottom: 1px solid var(--sup-rule);
  }
  .sup-field::before {
    content: ''; position: absolute; left: 0;
    top: var(--sup-dot-y, calc(6.5px * var(--ui-scale)));   /* cap midpoint — measured */
    width: calc(5px * var(--ui-scale)); height: calc(5px * var(--ui-scale));
    background: var(--sup-marker); border-radius: 50%;
    box-shadow: var(--sup-marker-glow);
    transform: translateY(-50%);
    /* THE MARKER ANSWERS THE POINTER (RULED — Eric, Aug 25): the dot on
       the field under the mouse glows, every other dot sits dim.
       The frames could not draw this — a static mock holds one level for
       every dot — so the HOVER state takes the measured halo and rest
       ranks BELOW it. That asymmetry is the only arrangement in which
       the dots can indicate anything: the alternative (rest at full,
       hover brighter) would push past the fitted calibration and still
       leave the other dots undimmed.
       0.2s ease is the house's own glow-transition timing (icon bar,
       menu) — this is a hover answer, not a pop-out, so it does not
       ride --pop-motion. */
    opacity: var(--sup-dot-rest);
    transition: opacity .2s ease;
  }
  /* :focus-within is the KEYBOARD TWIN — tabbing the form lights the
     same dot the mouse would (house law: every hover state has one).
     Native :hover is right HERE, unlike the menu and the option list:
     form fields are not on the machine's focus variable, they are native
     controls, and every other control inside this panel (.sup-chosen,
     .sup-plate, .sup-door, .sup-submit) already answers natively. */
  .sup-field:hover::before,
  .sup-field:focus-within::before { opacity: 1; }
  @media (prefers-reduced-motion: reduce) {
    .sup-field::before { transition: none; }
  }
  .sup-input, .sup-area {
    width: 100%;
    background: none; border: 0; padding: 0;
    color: var(--ink);
    font-family: var(--font-ui); font-weight: 600;
    font-size: calc(13px * var(--ui-scale));
    line-height: calc(17px * var(--ui-scale));
    letter-spacing: 0;
    text-align: right;
    text-shadow: var(--glow-text);
    caret-color: var(--ink);
    cursor: var(--cursor-target);
    transition: text-shadow .2s ease;
  }
  .sup-input:focus, .sup-area:focus { outline: none; text-shadow: var(--glow-text-hover); }
  .sup-input::placeholder, .sup-area::placeholder { color: #ffffff42; }
  /* The long field wraps, so it reads LEFT — the frame's own choice. It
     otherwise takes the SAME treatment as every other value (the face,
     the weight, the ink, the glow): in the close-up its content is bold
     white, not a lighter prose face. The field IS its value, here too.
     Frame line spacing measures ~16px on ~11-12px text -> 1.4. */
  .sup-area {
    text-align: left; resize: none;
    min-height: calc(96px * var(--ui-scale));
    line-height: 1.45;
  }
  /* The chosen request type is a CONTROL: it returns to the picker (and
     it is the Esc ladder's own next rung down). */
  /* The chosen type READS OUT; it does not act. No pointer cursor and no
     hover bloom, because nothing happens when you press it — the way
     back to the picker is Esc, or the corner control, which is now
     level-aware and does the same thing. */
  .sup-chosen {
    width: 100%; padding: 0; border: 0; background: none;
    text-align: right;
    color: var(--ink);
    font-family: var(--font-ui); font-weight: 600;
    font-size: calc(13px * var(--ui-scale));
    line-height: calc(17px * var(--ui-scale));
    text-shadow: var(--glow-text);
  }
  .sup-chosen:focus { outline: none; }
  .sup-foot {
    display: flex; align-items: flex-end; justify-content: space-between;
    gap: calc(24px * var(--ui-scale));
    margin-top: calc(6px * var(--ui-scale));
  }
  .sup-note {
    margin: 0; max-width: 62%;
    color: var(--sup-label);
    font-family: var(--font-sans); font-weight: 300;
    font-size: calc(11px * var(--ui-scale));
    line-height: 1.5;
  }
  .sup-note.is-said { color: var(--ink); text-shadow: var(--glow-text); }
  /* Submit — the one INVERTED control in the interface, exactly as the
     frame draws it: light plate, dark ink. */
  .sup-submit {
    flex: none;
    padding: calc(7px * var(--ui-scale)) calc(22px * var(--ui-scale));
    border: 0; border-radius: 0;
    background: #ededed;
    color: #0b0b0a;
    font-family: var(--font-ui); font-weight: 300;
    font-size: calc(12px * var(--ui-scale));
    letter-spacing: .04em;
    cursor: var(--cursor-target);
    box-shadow: 0 0 calc(18px * var(--ui-scale)) rgba(255,255,255,.20);
    transition: background .16s, box-shadow .2s ease;
  }
  .sup-submit:hover, .sup-submit:focus-visible, .sup-submit.kb-hover {
    background: #fff; outline: none;
    box-shadow: 0 0 calc(26px * var(--ui-scale)) rgba(255,255,255,.42);
  }

  /* ── The right rail — LOCK-SIDE FURNITURE ─────────────────────────────
     Eric's ruling: it does NOT exist during hover. Frame x[1379,1669] —
     its right edge lands on 59/1728 from the frame edge, which IS the
     utility cluster's own 58px inset: the rail hangs on the house's
     established right line rather than a bespoke fraction (the mix
     ruling). Width keeps the frame fraction. */
  #bs-rail {
    position: fixed;
    top: var(--sup-top);
    right: calc(58px * var(--ui-scale));
    width: 16.78vw; min-width: calc(230px * var(--ui-scale));
    z-index: 14;
    display: grid; gap: calc(18px * var(--ui-scale));
    opacity: 0; visibility: hidden; pointer-events: none;
    transition: opacity var(--pop-fade), visibility 0s var(--pop-fade-duration);
  }
  #bs-rail.is-on {
    opacity: 1; visibility: visible; pointer-events: auto;
    transition: opacity var(--pop-fade), visibility 0s;
  }
  .sup-rail-copy {
    margin: 0;
    color: var(--text-soft);
    font-family: var(--font-sans); font-weight: 300;
    font-size: calc(11px * var(--ui-scale));
    line-height: 1.5;
    letter-spacing: .01em;
  }
  /* The email capsule — a plate, not a pill: this page's geometry is
     hard-edged (the window's own corners are square with triangle
     marks), so the house 999px pill would read foreign here. */
  .sup-plate {
    width: 100%;
    height: calc(25px * var(--ui-scale));
    display: flex; align-items: center; justify-content: center;
    padding: 0 calc(10px * var(--ui-scale));
    border: 0;
    background: #ffffff1f;
    color: var(--ink);
    font-family: var(--font-sans); font-weight: 300;
    font-size: calc(11px * var(--ui-scale));
    letter-spacing: .01em;
    white-space: nowrap;
    cursor: var(--cursor-target);

     before drawing it out again — but an inline `transition:none` on the
     panel reaches ONLY the panel: measured, ::after kept `top,left` at
     0.5s and the content child kept `opacity` at 0.41s, so the traveling
     corner slid back over half a second while the frame snapped, and the
     redraw did not read as the bs-window mechanic at all. This class

var panel    = document.getElementById('bs-panel');

// There is NO separate excerpt rung. The window carrying the request type
// IS the preview; the level BELOW it is the one worth locking, because
// that is where there is something to LOSE (for CONTACT US, a half-filled
// form). The excerpt face I had invented is retired for the real item and
// survives only as the lorem items' own two levels.
//   PREVIEW   real -> the request-type face   ·  lorem -> its excerpt
//   LOCKED    real -> the form                ·  lorem -> its deeper body

  vForm.hidden    = (view !== 'form');

    excerptCopy.textContent   = locked ? T('supLoremBody') : T('supLoremExcerpt');

// AN ITEM change: REDRAW (Eric, Aug 24 — "make the pop up window redraw
// itself every time I hover to another menu item"). The window is not a
// container whose contents swap; it is DRAWN FRESH per item, so the
// expansion mechanic runs every time. The collapse is INSTANTANEOUS —
// the transition is suppressed for exactly that frame — so a redraw costs
// ONE draw-out on the tempo instead of a retract plus a draw. The face is
// swapped and re-measured while collapsed, so nothing of the outgoing
// item is ever visible inside the incoming frame.
function drawPanel(i, locked){
  // .sup-nofx silences the panel AND its corner pseudo-elements AND the
  // content child — an inline transition:none on the panel alone leaves
  // the traveler and the content fade still running (measured).
  panel.classList.add('sup-nofx');
  panel.classList.remove('is-open');
  panel.classList.remove('is-hidden');
  void panel.offsetWidth;                 // commit the collapsed seed square
  setFace(i, locked);                     // swap + resize while invisible
  void panel.offsetWidth;
  panel.classList.remove('sup-nofx');
  void panel.offsetWidth;                 // commit the restored transitions
  panel.classList.add('is-open');         // …then draw out on the tempo
}
function hidePanel(){
  // .is-open STAYS. Removing it would cancel bsw-fall, and a cancelled
  // animation drops the fill back to whatever the normal cascade says —
  // which snapped a half-drawn window to its FULL frame at full opacity
  // and only then faded it. Leaving the class on keeps the animation
  // declared, so the fill holds exactly where the draw had reached and
  // the whole window fades from there. .is-hidden still wins every
  // conflict it cares about (pointer-events, visibility, opacity): it is
  // the same specificity and later in the sheet.
  // drawPanel() removes BOTH classes before re-opening, so the next draw
  // still restarts the animation from its first frame.
  panel.classList.add('is-hidden');
}
function renderChosen(){
  chosenEl.textContent = chosenType ? T(chosenType) : '—';
  chosenEl.setAttribute('aria-label', T('supReqType'));
}
/* MARKER ALIGNMENT — MEASURED, never assumed (Eric, Aug 24: "can we have
   the glow dots align to the texts vertically"). A dot centred on its
   line BOX is wrong twice over: the box carries leading, and once the
   divider's padding joined the box, top:50% fell a further 5.9px
   (measured) below the text — a regression the divider introduced. The
   eye aligns a dot to the text's CAP MIDPOINT, so the machine solves
   that offset per element from REAL font metrics and writes it into
   --sup-dot-y. Re-runs when the webfont lands and at every scale change,
   because both move the metrics; the frames put the marker in this same
   band (1-3px above the x-height centre across every sampled label). */
var _mctx = null;
function capMidOf(el){
  if (!_mctx) _mctx = document.createElement('canvas').getContext('2d');
  var cs = getComputedStyle(el);
  _mctx.font = cs.fontStyle + ' ' + cs.fontWeight + ' ' + cs.fontSize + ' ' + cs.fontFamily;
  var cap = _mctx.measureText('H');
  var lh = parseFloat(cs.lineHeight);
  var fa = cap.fontBoundingBoxAscent, fd = cap.fontBoundingBoxDescent;
  var ca = cap.actualBoundingBoxAscent;
  // Old engines report none of these — leave the CSS fallback in charge.
  if (!isFinite(lh) || !isFinite(fa) || !isFinite(fd) || !isFinite(ca)) return null;
  return (lh - (fa + fd)) / 2 + fa - ca / 2;     // line-box top -> cap midpoint
}
function alignMarkers(){
  var ks = document.querySelectorAll('.sup-kicker');
  for (var i = 0; i < ks.length; i++){
    var y = capMidOf(ks[i]);
    if (y !== null) ks[i].style.setProperty('--sup-dot-y', y.toFixed(2) + 'px');
  }
  var fs = document.querySelectorAll('.sup-field');
  for (var j = 0; j < fs.length; j++){
    var lab = fs[j].querySelector('label');
    if (!lab) continue;
    var yy = capMidOf(lab);
    if (yy !== null) fs[j].style.setProperty('--sup-dot-y', yy.toFixed(2) + 'px');
  }
}

// ── Render from state ─────────────────────────────────────────────────────
function render(){
  for (var i = 0; i < menuItems.length; i++){
    menuItems[i].classList.toggle('kb-hover', i === focusIdx && !isLocked());
    // .active marks the OPEN item — it holds its popped rendering while
    // the cursor is free to walk elsewhere.
    menuItems[i].classList.toggle('active', i === openIdx);
  }
  // State hook only — no CSS consumes it since the narrow-width lock
  // override was removed (it made LOCKED a terminal state). Kept as the
  // seam Eric's mobile grammar will want.
  panel.classList.toggle('sup-locked', isLocked());
  // THE RAIL now rides the ACTIVE real item at BOTH levels. Eric's earlier
  // "the rail belongs to LOCK" was ruled against the EXCERPT state, which
  // no longer exists: the preview is the request type itself, and the
  // rail's own door is the way INTO the locked form — gating it behind the
  // lock would leave both that door and the support address unreachable.
  // Frames 1-2 and 1-3 draw the rail at both levels. LABELED: one line
  // returns it to lock-only.
  // The corner control names its current job (see cornerBack).
  backBtn.setAttribute('aria-label', openIdx >= 0 ? T('navBack') : T('navHome'));
  // The form door empties while the form is up (see .sup-door.is-active).
  doorBtn.classList.toggle('is-active', isLocked());
  var railOn = openIdx >= 0 && ITEMS[openIdx].real;
  railEl.classList.toggle('is-on', railOn);
  railEl.setAttribute('aria-hidden', String(!railOn));
  // Tab enters the FORM only when locked (the machine law). The options
  // are the PREVIEW's own control, so they are reachable while it is up.
  var tabbable = isLocked();
  vForm.querySelectorAll('input, textarea, button').forEach(function(el){ el.tabIndex = tabbable ? 0 : -1; });
  optionEls.forEach(function(el){ el.tabIndex = (openIdx >= 0 && !isLocked()) ? 0 : -1; });
  railEl.querySelectorAll('button').forEach(function(el){ el.tabIndex = railOn ? 0 : -1; });
}

// THE CURSOR ONLY. It no longer touches the window — that is openFor's
// job now, and the two are deliberately independent so the cursor can
// keep walking while a window stands.
function setFocus(i){
  if (i === focusIdx) return;
  if (i >= 0 && C.rail.index() >= 0) C.rail.focus(-1);   // one cursor
  focusIdx = i;
  if (i >= 0){ SoundBus.play('detent'); hapticTick(); }
  render();
}
function focusStep(dir){
  if (isLocked()){ denyLocked(); return false; }
  var next;
  if (focusIdx < 0) next = dir > 0 ? 0 : ITEMS.length - 1;
  else {
    next = focusIdx + dir;
    if (next < 0 || next >= ITEMS.length) return false;   // wall — clamp, no wrap
  }
  setFocus(next);
  return true;
}

// ── OPEN / CLOSE — the click's own level ──────────────────────────────────
// Opening is where the REDRAW lives now (Eric, Aug 24: every new item
// re-runs the expansion from the seed square). Clicking a different item
// while one stands redraws for the new one.
function openFor(i){
  openIdx = i;
  locked = false;
  SoundBus.play('commit'); hapticTick();
  drawPanel(i, false);
  render();
}
function closeWindow(){
  if (openIdx < 0) return;
  openIdx = -1;
  locked = false;
  // Never leave the keyboard inside a window that is going away.
  var a = document.activeElement;
  if (a && panel.contains(a) && a.blur) a.blur();
  hidePanel();
  render();
}

// ── LOCK / UNLOCK — the level below ───────────────────────────────────────
function lock(){
  if (openIdx < 0 || locked) return;
  locked = true;
  SoundBus.play('commit'); hapticTick();
  showFace(openIdx, true);  // a LEVEL change, not an item change — no redraw
  render();
}
// Lock retreats to PREVIEW — the ladder mirrors its own ascent (ratified).
function unlock(){
  if (!isLocked()) return;
  locked = false;
  // Retreating a level must not leave the keyboard inside the panel: the
  // form's controls are about to be untabbable, and a stranded focus
  // silently eats the menu's own keys.
  var _a = document.activeElement;
  if (_a && panel.contains(_a) && _a.blur) _a.blur();
  showFace(openIdx, false);
  render();
  SoundBus.play('detent'); hapticTick();
}
function denyLocked(){
  var el = menuItems[openIdx];
  if (el && !el.classList.contains('bs-shake')) denyOn(el);
}

// ── THE ESC LADDER — one honest level per press, through ONE function ─────
// field focus -> LOCKED -> OPEN -> the cursor -> boundary.
// The click grammar (the company, Aug 25) gives the ladder a real fifth
// rung: the window has its own press now, because the cursor no longer
// dies with it — hover opens nothing, so the cursor can outlive the
// window and must be cleared on its own step. (The cursor's rung and
// idle coincide — nothing else holds state at rest, the /community
// precedent.) Instrumented under ?dev.
var lastRung = null;
function goBack(){
  if (isLocked()){
    var a = document.activeElement;
    // 1. a focused field hands back to the window level.
    if (a && panel.contains(a) && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA')){
      lastRung = 'field';
      a.blur();
      // Deliberately do NOT park focus on the panel body. Chrome makes a
      // scroller focusable, and focus sitting there meant the panel's own
      // keydown swallowed every later key — measured: after Esc out of a
      // field, W/S no longer walked the menu at PREVIEW, breaking the
      // ratified parity rule. Blurring hands the keys back to the machine.
      return;
    }
    // 2. LOCKED retreats to OPEN (which, for the real item, IS the
    //    request-type face).
    lastRung = 'locked';
    unlock();
    return;
  }
  // 3. OPEN retracts the window. The cursor SURVIVES it — it was never
  //    the thing that opened it.
  if (openIdx >= 0){ lastRung = 'window'; closeWindow(); return; }
  // 4. the cursor clears.
  if (focusIdx >= 0){ lastRung = 'cursor'; setFocus(-1); return; }
  // 5. rest -> the page boundary (a TRUE history pop; cold boot is silent).
  lastRung = 'boundary';
  if (arrival) popBoundary();
}

// ── The panel owns its keys while locked ──────────────────────────────────
// The #bs-icons exemption pattern: the machine stays blind to keys inside
// the window, so W/S/A/D typed into a field are text, not menu input.
// Esc still walks THE ladder — one function, both routes.
panel.addEventListener('keydown', function(e){
  if (openIdx < 0) return;
  e.stopPropagation();
  if (e.key === 'Escape'){ e.preventDefault(); wake(); goBack(); return; }
  if (view === 'request'){
    var k = e.key;
    if (k === 'w' || k === 'W' || k === 'ArrowUp' || k === 's' || k === 'S' || k === 'ArrowDown'){
      e.preventDefault(); wake();
      var down = (k === 's' || k === 'S' || k === 'ArrowDown');
      var n = optionIdx < 0 ? (down ? 0 : optionEls.length - 1) : optionIdx + (down ? 1 : -1);
      if (n < 0 || n >= optionEls.length) return;            // ends clamp silently
      setOptionFocus(n);
      SoundBus.play('detent'); hapticTick();
      return;
    }
    if (k === 'Enter' && optionIdx >= 0){
      e.preventDefault(); wake();
      chooseType(optionEls[optionIdx].getAttribute('data-req'));
    }
  }
});
// Leaving the WINDOW clears the option cursor outright — the backstop for
// a pointer that exits fast enough to skip an option's own mouseleave, or
// one that leaves from the panel's padding rather than off an option.
// pointerleave does not fire on child transitions, so moving among the
// options never trips it.
panel.addEventListener('pointerleave', function(e){
  if (e.pointerType && e.pointerType !== 'mouse') return;
  if (optionIdx >= 0) setOptionFocus(-1);
});

// DOOR #2 IS RETIRED (Eric, Aug 25: clicking empty window space "will
// also send me to a form field… seems to be a bug"). The window's GROUND
// is now inert.
//
// It was ratified as half of "TWO DOORS, ONE LOCK" on Aug 24 — but that
// was ruled when the window held a passive EXCERPT, where its ground was
// the only thing there to click. The window now holds the request-type
// picker: its own controls are the way forward, so a click on bare fill
// commits nothing. Door #1 (clicking the open menu item again) is
// unaffected and remains the commit for the five lorem items, whose
// windows carry no controls of their own.
//
// Nothing replaces the handler: the document-level sweep in the shared
// chrome already calls wake() on every pointerdown, and its stopPropagation
// guarded nothing (bindSweep listens on pointerdown, not click).

// The form's request-type row is a CONTROL: it retreats to the picker —
// which is the same rung the Esc ladder walks. (It was never wired in the
// first build.) The form's field values survive in the DOM, so choosing
// again returns to a form that kept everything.
// The request-type readout has NO click handler: retreating to the picker
// from here was Eric's Aug 25 strike. Esc and the level-aware corner
// control are the ways back, and both walk the one ladder function.

// ── The rail's two controls ───────────────────────────────────────────────
// The email capsule COPIES (Eric, Aug 24). mailto: was the alternative and
// is deliberately NOT used: it is an external hand-off, which would fire
// the THIRD PARTY overlay's second-consumer factoring trigger.
var _copyT = null;
emailBtn.addEventListener('click', function(){
  wake();
  var addr = T('supEmail');
  var said = function(){
    emailBtn.setAttribute('data-str', 'supEmailCopied');
    emailBtn.textContent = T('supEmailCopied');
    SoundBus.play('commit'); hapticTick();
    clearTimeout(_copyT);
    _copyT = setTimeout(function(){
      emailBtn.setAttribute('data-str', 'supEmail');
      emailBtn.textContent = T('supEmail');
    }, 1400);
  };
  var failed = function(){ denyOn(emailBtn); };   // nothing fails silently
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(addr).then(said).catch(failed);
    return;
  }
  try {
    var ta = document.createElement('textarea');
    ta.value = addr; ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
    document.body.appendChild(ta); ta.select();
    var ok = document.execCommand('copy');
    document.body.removeChild(ta);
    ok ? said() : failed();
  } catch (err) { failed(); }
});
// The form door — the rail's own way into the locked level, skipping the
// request-type choice (the form's first row still carries it, and Submit
// denies until it is set). From PREVIEW this is a COMMIT.
doorBtn.addEventListener('click', function(){
  wake();
  if (openIdx < 0 || !ITEMS[openIdx].real) return;
  if (!isLocked()){
    if (!clickOk()) return;
    lock();
  } else {
    showFace(openIdx, true);
  }
  var first = document.getElementById('sup-f-name');
  try { first.focus({ preventScroll: true }); } catch (e) {}
});

// ── Submit — a LABELED STUB to a marked seam ──────────────────────────────
// Validation denies LOUDLY: the offending field shakes and takes focus;
// nothing fails silently. On a valid submit the UX runs to completion and
// then says honestly that nothing was sent — the wiring ruling (endpoint /
// mailto fallback / disabled-until-go-live) drops in AT THE SEAM BELOW
// with no rework. NOTE: if the ruling sends anything off-site, the THIRD
// PARTY overlay gains its second consumer and must be factored into the
// shared pair first (canon §7).
vForm.addEventListener('submit', function(e){
  e.preventDefault();
  wake();
  var bad = null;
  if (!chosenType) bad = chosenEl;
  if (!bad){
    var required = [
      document.getElementById('sup-f-name'),
      document.getElementById('sup-f-email'),
      document.getElementById('sup-f-subject'),
      document.getElementById('sup-f-requests')
    ];
    for (var i = 0; i < required.length; i++){
      var f = required[i];
      var v = (f.value || '').trim();
      var okEmail = (f.type !== 'email') || /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
      if (!v || !okEmail){ bad = f; break; }
    }
  }
  if (bad){
    setNote('supInvalid', false);
    denyOn(bad.closest('.sup-field') || bad);
    try { bad.focus({ preventScroll: true }); } catch (err) {}
    return;
  }
  SoundBus.play('commit'); hapticTick();
  // ══ SUBMIT SEAM — the wiring ruling lands HERE ══════════════════════
  // if (ENDPOINT) fetch(ENDPOINT, {...}); else if (MAILTO) ...; else:
  setNote('supSubmitPending', true);
});

// ── Corner nav ────────────────────────────────────────────────────────────
var pillPrimary = C.bindPill(primary, fwdBtn);
pillPrimary.onOpenChange = function(open){
  links.forEach(function(l){ l.tabIndex = open ? 0 : -1; });
  primary.setAttribute('aria-expanded', String(open));
};
pillPrimary.onOpenChange(false);

var _leaving = false;
function leaveHome(){
  if (_leaving || !clickOk()) return;
  _leaving = true;
  if (arrival && arrivalFrom === 'home'){
    setTimeout(function(){
      if (_leaving && !document.hidden){ _leaving = false; location.assign(C.ROUTES.home); }
    }, 350);
    history.back();
    return;
  }
  location.assign(C.ROUTES.home);
}
function popBoundary(){
  if (_leaving) return;
  _leaving = true;
  setTimeout(function(){
    if (_leaving && !document.hidden){ _leaving = false; location.assign(C.ROUTES.home); }
  }, 350);
  history.back();
}
// THE CORNER ‹ IS LEVEL-AWARE (RULED — Eric, Aug 25): once a second
// level or higher is open, it descends ONE level instead of leading
// home — the pointer's equivalent of Esc, through the very same ladder
// function, so the two can never disagree. Below that it keeps its
// labeled HOME semantic (the witness grammar, and the divergence from
// Esc's strict-LIFO boundary pop that is already on record).
// The WORDMARK deliberately does NOT change: it stays the unconditional
// route home, so there is always one press that leaves the page no
// matter how deep the ladder goes.
function cornerBack(){
  // clickOk gates the descent for the same reason it gates every other
  // commit/back door (journal canon): without it a double-click drops
  // TWO levels. leaveHome() carries its own gate already.
  if (openIdx >= 0){ if (clickOk()) goBack(); return; }   // level 2+ -> one down
  leaveHome();                                            // level 0-1 -> home, as labeled
}
(backBtn.closest('.bs-hit') || backBtn).addEventListener('click', function(){ wake(); cornerBack(); });

// SUPPORT is the current section — it DENIES with the shake (ruled).
links.forEach(function(link){
  link.addEventListener('click', function(e){
    e.stopPropagation();
    wake();
    var sec = link.getAttribute('data-section');
    if (sec !== 'support' && C.ROUTES[sec]){
      if (clickOk()) C.nav.commit(sec);
      return;
    }
    denyOn(link);
  });
});
primary.addEventListener('click', function(e){
  if (e.target.closest('.site-primary-nav__link')) return;
  wake();
  if (pillPrimary.touchOpenConsumed()) return;
  if (C.rail.lockIndex() === RAIL_PILL) C.rail.unlock();
  else C.rail.lock(RAIL_PILL);
});

// ── Mount ─────────────────────────────────────────────────────────────────
var RAIL_BACK = 0, RAIL_PILL = 1;
C.init({
  page: 'support',
  leadingControls: [
    { headEl: backBtn, pill: null, activate: cornerBack },   // keyboard twin
    { headEl: primary, pill: pillPrimary, trayAxis: 'x',
      trayItems: function(){ return links; } }
  ],
  touchSurfaces: [document.getElementById('bs-stage'), menuEl],
  sweepRoots: [cornerEl, menuEl, panel, railEl],
  hooks: {
    isLocked:       isLocked,
    denyLocked:     denyLocked,
    goBack:         goBack,
    escapeFromRail: function(){ setFocus(0); },      // rail -> the primary surface
    enterAtPrimary: function(){
      // Enter is the CLICK's twin, rung for rung: it claims the cursor
      // cold, then opens, then commits.
      if (focusIdx < 0){ setFocus(0); return; }
      if (openIdx !== focusIdx){ openFor(focusIdx); return; }
      lock();
    },
    verticalStep:   function(down){
      // At the FIRST item, W/^ hands the cursor to the icon bar (the home
      // menu's own top-wall zone transition).
      if (!down && focusIdx === 0){ setFocus(-1); C.rail.focus(0); return; }
      focusStep(down ? 1 : -1);
    },
    railVertical:   function(down){
      if (down){ C.rail.focus(-1); setFocus(0); }     // strip -> menu
    },
    horizontalCold: function(){ /* A/D drive the rail only — inert here */ },
    // WHEEL OWNERSHIP SWITCHES WITH THE LOCK. At menu level the wheel
    // steps the menu on the measured pitch; inside the locked window it
    // belongs to the panel's native scroll and the bridge hands off
    // entirely (ends clamp silently, as everywhere).
    wheelNative:    function(e){
      if (!panelBody.contains(e.target)) return false;
      if (isLocked()) return true;          // the locked panel owns its wheel outright
      // While merely OPEN the wheel still belongs to the MENU, so the
      // cursor can walk past a standing window — UNLESS the panel is
      // genuinely clipped, which the provisional narrow-width cap can
      // do; its own content must stay reachable.
      return panelBody.scrollHeight > panelBody.clientHeight + 1;
    },
    wheelStep:      focusStep,
    wheelPitch:     function(){ return menuPitch; },
    clearPrimary:   function(){ if (focusIdx >= 0 && !isLocked()) setFocus(-1); },
    // Attract: everything pops back in — the window included. A LOCKED
    // window is exempt upstream (armIdle re-arms without resetting), so
    // a half-filled form is never swept away.
    idleReset:      function(){ setFocus(-1); closeWindow(); C.rail.focus(-1); },
    onLangChange:   function(T2){
      links.forEach(function(l){ l.textContent = T2(l.getAttribute('data-section')); });
      renderStrings();
      // Re-render whichever face is live, at its current level.
      if (openIdx >= 0) setFace(openIdx, isLocked());
      else renderChosen();
      document.title = T2('supportTitle');
    },
    onFontsReady:   function(){
      measurePitch();
      alignMarkers();                       // the webfont's metrics are the real ones
      if (openIdx >= 0) sizePanel();
    },
    devState:       function(){
      return { focusIdx: focusIdx, openIdx: openIdx, locked: locked, view: view, rung: lastRung,
               chosenType: chosenType, menuPitch: menuPitch, arrival: arrival,
               railOn: railEl.classList.contains('is-on') };
    }
  }
});

// ── Boot — cold or arrived, interactive at first paint ────────────────────
renderStrings();
links.forEach(function(l){ l.textContent = T(l.getAttribute('data-section')); });
renderChosen();
measurePitch();
alignMarkers();
render();

window.addEventListener('resize', function(){
  alignMarkers();                           // --ui-scale moved: so did the metrics
  if (openIdx >= 0) sizePanel();
});
window.addEventListener('pageshow', function(e){
  if (e.persisted){
    _leaving = false;
    closeWindow();
    setFocus(-1);
    C.rail.focus(-1);
  }
});

})();
</script>
</body>
</html>
