<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#040402">
<title>BACKSPACE — Cart</title>
<!--
  backspace — /cart (the dedicated cart page; Eric's sixth word, Aug 28:
  "upon close inspection, the cart page isn't actually too complicated,
  let's build it along with the product page"). A DESTINATION, not a
  section: the away pill stays four; the utility cart circle and
  /hardware's view-cart seam commit here through ROUTES.cart (one line,
  house-wide). GEOMETRY from the B-2 frames (outlined SVGs; extracted by
  bbox pass + true-aspect renders, values in the build report): the page
  reuses the tray's own construction rails — 65 (3.76vw), the divider
  1223 (70.78vw), 1671 (3.30vw inset) — with the section rule at y275.

  THE GRAMMAR (the design team's note frame, translated):
  · click any small frame -> the big frame shows that product's preview
    + the detail column shows its information;
  · FILLED triangle = checked, HOLLOW = unchecked (the checkbox);
  · checked items surface in ORDER SUMMARY — they are the final order;
  · the X on a summary card is where DELETION lives;
  · qty steppers on the cards; promo/apply, totals, checkout below.

  SEAMS, honest: item money runs on the RULED FAKE $1 placeholder
  (Eric, Aug 29) — the frames' $4141 / $2499 stay the on-record
  do-not-port statics; shipping and tax render "—" (those sources are
  still unruled). checkout / apply / kickstarter DENY with the shake —
  commerce wiring and the third-party overlay question are phase 2+.
  The item-switch rows in the detail column are a LABELED INTERPRETATION
  of the note's "click button -> expand below" (design confirm owed).

  The preview mounts the shared stage ball (bs-ball.js — factored at
  this, its second consumer); the desk GLB rebinds behind the same api.
-->
<link rel="stylesheet" href="shared/bs-chrome.css">
<style>
  body[data-bs-page="cart"] {
    --ct-top: 22.02vh;          /* rails y246 */
    --ct-rule: 24.62vh;         /* the section rule y275 */
    --ct-crumb: 22.33vh;        /* breadcrumb ink y249 */
  }

  /* ── Construction: the tray's rails carried up the page ─────────────── */
  .ct-rail {
    position: fixed; width: 1px;
    top: var(--ct-top); height: calc(98.12vh - var(--ct-top));
    background: var(--panel-line);
    pointer-events: none;
  }
  #ct-rail-l   { left: max(clamp(34px, 3.8vw, 68px), 3.76vw); }
  #ct-rail-div { left: 70.78vw; }
  #ct-rail-r   { right: 3.30vw; }
  #ct-rule {
    position: fixed; left: 1.91vw; right: 1.91vw;
    top: var(--ct-rule); height: 1px;
    background: var(--panel-line);
    pointer-events: none;
  }

  /* ── Breadcrumb: CART › CHECKOUT ────────────────────────────────────── */
  #ct-crumbs {
    position: fixed; left: 5.56vw; top: var(--ct-crumb);
    z-index: 16;
    display: flex; align-items: baseline;
    gap: calc(14px * var(--ui-scale));
    font-family: var(--font-ui);
    font-size: calc(12px * var(--ui-scale));
    letter-spacing: .08em;
  }
  #ct-crumbs .ct-crumb-sep { color: #e6e6e6; opacity: .5; font-weight: 300; }
  /* BOTH crumbs are buttons since the checkout state landed (Eric,
     Aug 31): .is-here rides whichever names the standing state; the
     other one is the way back/forward. */
  .ct-crumb-btn {
    background: none; border: 0; padding: 0;
    color: var(--bs-label); font-weight: 300;
    font-family: var(--font-ui);
    font-size: calc(12px * var(--ui-scale));
    letter-spacing: .08em;
    cursor: var(--cursor-target);
    transition: color .16s;
  }
  .ct-crumb-btn:hover, .ct-crumb-btn:focus-visible { color: #fff; outline: none; }
  .ct-crumb-btn.is-here {
    color: var(--ink); font-weight: 600; text-shadow: var(--glow-text);
    pointer-events: none;
  }
  #ct-summary-head {
    position: fixed; left: 72.5vw; top: var(--ct-crumb);
    color: var(--text-soft);
    font-family: var(--font-ui); font-weight: 300;
    font-size: calc(11px * var(--ui-scale));
    letter-spacing: .12em;
  }

  /* ── The big preview (95,305,715,467) — the selected item's stage ───── */
  #ct-preview {
    position: fixed;
    left: 5.50vw; top: 27.31vh;
    width: 41.38vw; height: 41.83vh;
    background: #4a4a4a5c;
    z-index: 4;
  }
  #ct-preview canvas {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    display: block;
  }
  /* The preview's corner triangle mirrors the SELECTED item's checkbox. */
  .ct-tri {
    position: absolute; top: 0; left: 0;
    width: calc(11px * var(--ui-scale)); height: calc(11px * var(--ui-scale));
    display: block; overflow: visible;
    cursor: var(--cursor-target);
    z-index: 2;
  }
  .ct-tri path {
    fill: none; stroke: #fefefe99; stroke-width: 1.1;
    vector-effect: non-scaling-stroke;
    transition: fill .16s, stroke .16s;
  }
  .ct-tri.is-checked path { fill: #fefefe; stroke: #fefefe; }
  .ct-tri:hover path, .ct-tri:focus-visible path { stroke: #fff; filter: drop-shadow(0 0 4px rgba(255,255,255,.6)); }
  .ct-tri:focus-visible { outline: none; }

  /* ── The thumbnail grid — the slot chrome recycled (rows pitch 105) ── */
  #ct-grid {
    position: fixed;
    left: 5.50vw; top: 70.28vh;
    width: 41.38vw;
    max-height: calc(98.12vh - 70.28vh);
    display: flex; flex-wrap: wrap;
    gap: calc(15px * var(--ui-scale)) calc(25px * var(--ui-scale));
    overflow: hidden auto;
    overscroll-behavior: contain;
    scrollbar-width: thin;
    scrollbar-color: #ffffff5c transparent;
    z-index: 4;
  }
  .ct-thumb {
    position: relative;
    flex: none;
    width: calc(160px * var(--ui-scale)); height: calc(90px * var(--ui-scale));
    background: #4a4a4a5c;
    border: 0; padding: 0;
    transition: background .16s;
  }
  .ct-thumb.is-filled { cursor: var(--cursor-target); }
  /* PHOTO HOVER (sixteenth word): the opaque render hid the old
     background lift — the grey backdrop stays underneath, and hovering
     now lifts THROUGH the photo: the image brightens and the frame
     glows. Photo-less boxes keep the plain lift. */
  .ct-thumb.is-filled:hover, .ct-thumb.is-filled:focus-visible {
    background: #5c5c5c5c; outline: none;
    box-shadow: 0 0 calc(14px * var(--ui-scale)) rgba(255, 255, 255, .16);
  }
  .ct-thumb.is-filled:hover .ct-thumb-img,
  .ct-thumb.is-filled:focus-visible .ct-thumb-img { filter: brightness(1.28); }
  .ct-thumb.is-live { background: #5c5c5c7a; }   /* the previewed one */
  /* THE MINUS (sixteenth word): the FOCUSED thumbnail carries a remove
     control at its top right — thumbnail-level deletion joins the
     summary card's X. */
  .ct-thumb-minus {
    position: absolute; top: 0; right: 0;
    width: calc(28px * var(--ui-scale)); height: calc(28px * var(--ui-scale));
    color: var(--text-soft);
    cursor: var(--cursor-target);
    z-index: 2;
    transition: color .16s;
  }
  /* Drawn dash, equal insets top and right — doubled to 10px×ui on
     Eric's word (Aug 29); hit box 18→28 keeps the symmetric surround. */
  .ct-thumb-minus::after {
    content: '';
    position: absolute;
    top: calc(10px * var(--ui-scale));
    right: calc(10px * var(--ui-scale));
    width: calc(8px * var(--ui-scale));
    height: max(1px, calc(1.2px * var(--ui-scale)));
    background: currentColor;
    transition: box-shadow .2s ease;
  }
  .ct-thumb-minus:hover, .ct-thumb-minus:focus-visible {
    color: #fff; outline: none;
  }
  .ct-thumb-minus:hover::after, .ct-thumb-minus:focus-visible::after {
    box-shadow: 0 0 calc(6px * var(--ui-scale)) rgba(255, 255, 255, .65);
  }
  .ct-thumb-name {
    position: absolute; left: calc(9px * var(--ui-scale)); bottom: calc(7px * var(--ui-scale));
    color: var(--text-soft);
    font-family: var(--font-ui); font-weight: 300;
    font-size: calc(11px * var(--ui-scale));
    letter-spacing: .02em;
    pointer-events: none;
  }
  /* The color chips retired (thirteenth word) — thumbnails carry the
     actual preview photo snapped when the item was added. */
  .ct-thumb-img {
    position: absolute; inset: 0;
    background-size: cover; background-position: center;
    pointer-events: none;
    transition: filter .2s ease;
  }

  /* ── The detail column (845..1189) ──────────────────────────────────── */
  #ct-detail {
    position: fixed;
    left: 48.90vw; top: 27.31vh;
    width: 19.91vw;
    bottom: calc(100vh - 98.12vh);
    z-index: 4;
    display: flex; flex-direction: column;
    gap: calc(12px * var(--ui-scale));
  }
  /* Item-switch rows — LABELED INTERPRETATION of the note's "click
     button -> expand below": one row per cart item; the open row is the
     previewed one and its details render below. */
  #ct-rows {
    display: grid; gap: calc(6px * var(--ui-scale));
    max-height: calc(102px * var(--ui-scale));
    overflow: hidden auto;
    overscroll-behavior: contain;
    scrollbar-width: thin;
    scrollbar-color: #ffffff5c transparent;
  }
  .ct-row {
    display: flex; align-items: stretch;
    height: calc(30px * var(--ui-scale));
    border: 0; padding: 0; background: none;
    cursor: var(--cursor-target);
    flex: none;
  }
  .ct-row-chip {
    flex: none;
    width: calc(30px * var(--ui-scale));
    display: grid; place-items: center;
    background: #ededed; color: #0b0b0a;
    font-family: var(--font-ui); font-weight: 300;
    font-size: calc(11px * var(--ui-scale));
  }
  .ct-row-bar {
    flex: none;
    width: calc(87px * var(--ui-scale));
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 calc(8px * var(--ui-scale));
    background: #4a4a4a5c;
    color: var(--text-soft);
    font-family: var(--font-ui); font-weight: 300;
    font-size: calc(10px * var(--ui-scale));
    letter-spacing: .04em;
    white-space: nowrap;
    transition: background .16s, color .16s;
  }
  .ct-row:hover .ct-row-bar, .ct-row:focus-visible .ct-row-bar { background: #5c5c5c5c; color: #fff; }
  .ct-row:focus-visible { outline: none; }
  .ct-row.is-live .ct-row-bar { color: var(--ink); font-weight: 600; }
  /* Kickstarter — drawn per the frames; an EXTERNAL hand-off seam: the
     click DENIES until the third-party overlay ruling (phase 2+). */
  #ct-kick {
    position: absolute; right: 0; top: 0;
    width: calc(133px * var(--ui-scale));
    display: grid; gap: calc(0px * var(--ui-scale));
  }
  #ct-kick-btn {
    height: calc(30px * var(--ui-scale));
    border: 0;
    background: #fefefe;
    color: #05ce78;
    font-family: var(--font-ui); font-weight: 600;
    font-size: calc(11px * var(--ui-scale));
    letter-spacing: .08em;
    cursor: var(--cursor-target);
    transition: background .16s;
  }
  #ct-kick-btn:hover, #ct-kick-btn:focus-visible { background: #fff; outline: none; }
  #ct-kick-note {
    height: calc(30px * var(--ui-scale));
    display: flex; align-items: center; justify-content: center;
    background: #4a4a4a5c;
    color: var(--bs-label);
    font-family: var(--font-ui); font-weight: 300;
    font-size: calc(9px * var(--ui-scale));
    letter-spacing: .02em;
    text-align: center;
  }
  #ct-title {
    margin-top: calc(160px * var(--ui-scale));   /* the frames' air above the title */
    color: var(--ink);
    font-family: var(--font-ui); font-weight: 600;
    font-size: calc(14px * var(--ui-scale));
    letter-spacing: .04em;
    text-shadow: var(--glow-text);
  }
  #ct-specs {
    display: grid; gap: calc(6px * var(--ui-scale));
    color: var(--text-soft);
    font-family: var(--font-ui); font-weight: 300;
    font-size: calc(11px * var(--ui-scale));
    line-height: 1.5;
    letter-spacing: .02em;
  }
  #ct-specs .ct-spec-k { color: var(--bs-label); margin-right: calc(8px * var(--ui-scale)); }
  /* ── ORDER SUMMARY (1243..1651) ─────────────────────────────────────── */
  #ct-summary {
    position: fixed;
    left: 71.93vw; right: 4.46vw;
    top: 27.31vh; bottom: calc(100vh - 98.12vh);
    z-index: 4;
    display: flex; flex-direction: column;
    gap: calc(15px * var(--ui-scale));
  }
  #ct-items-head {
    flex: none;
    height: calc(30px * var(--ui-scale));
    display: flex; align-items: center;
    padding-left: calc(12px * var(--ui-scale));
    background: #4a4a4a5c;
    color: var(--text-soft);
    font-family: var(--font-ui); font-weight: 300;
    font-size: calc(12px * var(--ui-scale));
    letter-spacing: .04em;
    position: relative;
  }
  #ct-items-count {
    position: absolute; right: 0; top: 0;
    width: calc(30px * var(--ui-scale)); height: calc(30px * var(--ui-scale));
    display: grid; place-items: center;
    background: #ededed; color: #0b0b0a;
    font-family: var(--font-ui); font-weight: 600;
    font-size: calc(12px * var(--ui-scale));
  }
  #ct-cards {
    flex: 1; min-height: 0;
    display: grid; gap: calc(15px * var(--ui-scale));
    grid-auto-rows: max-content;
    overflow: hidden auto;
    overscroll-behavior: contain;
    scrollbar-width: thin;
    scrollbar-color: #ffffff5c transparent;
  }
  .ct-card {
    position: relative;
    height: calc(115px * var(--ui-scale));
    background: #4a4a4a5c;
  }
  .ct-card-chipimg {
    position: absolute;
    left: calc(11px * var(--ui-scale)); top: calc(31px * var(--ui-scale));
    width: calc(87px * var(--ui-scale)); height: calc(65px * var(--ui-scale));
    border: 1px solid var(--panel-line);
  }
  .ct-card-title {
    position: absolute;
    left: calc(110px * var(--ui-scale)); top: calc(16px * var(--ui-scale));
    right: calc(36px * var(--ui-scale));
    color: var(--ink);
    font-family: var(--font-ui); font-weight: 600;
    font-size: calc(11px * var(--ui-scale));
    letter-spacing: .02em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .ct-card-sub {
    position: absolute;
    left: calc(110px * var(--ui-scale)); top: calc(34px * var(--ui-scale));
    right: calc(36px * var(--ui-scale));
    color: var(--bs-label);
    font-family: var(--font-ui); font-weight: 300;
    font-size: calc(9px * var(--ui-scale));
    letter-spacing: .02em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .ct-card-x {
    position: absolute; right: calc(10px * var(--ui-scale)); top: calc(10px * var(--ui-scale));
    width: calc(14px * var(--ui-scale)); height: calc(14px * var(--ui-scale));
    background: none; border: 0; padding: 0;
    color: var(--text-soft);
    font-family: var(--font-sans); font-weight: 300;
    font-size: calc(13px * var(--ui-scale)); line-height: 1;
    cursor: var(--cursor-target);
    transition: color .16s;
  }
  .ct-card-x:hover, .ct-card-x:focus-visible { color: #fff; outline: none; text-shadow: var(--glow-text); }
  .ct-step {
    position: absolute;
    left: calc(110px * var(--ui-scale)); bottom: calc(14px * var(--ui-scale));
    display: flex; align-items: stretch;
    height: calc(20px * var(--ui-scale));
  }
  .ct-step button {
    width: calc(20px * var(--ui-scale));
    border: 0; padding: 0;
    background: #ededed; color: #101010;
    font-family: var(--font-sans); font-weight: 300;
    font-size: calc(12px * var(--ui-scale)); line-height: 1;
    cursor: var(--cursor-target);
    transition: background .16s;
  }
  .ct-step button:hover, .ct-step button:focus-visible { background: #fff; outline: none; }
  .ct-step .ct-step-n {
    width: calc(29px * var(--ui-scale));
    display: grid; place-items: center;
    background: #4a4a4a;
    color: var(--ink);
    font-family: var(--font-ui); font-weight: 300;
    font-size: calc(11px * var(--ui-scale));
  }
  .ct-card-price {
    position: absolute;
    right: calc(12px * var(--ui-scale)); bottom: calc(16px * var(--ui-scale));
    color: #e6e6e6;
    font-family: var(--font-ui); font-weight: 300;
    font-size: calc(12px * var(--ui-scale));
    letter-spacing: .04em;
  }
  #ct-foot {
    flex: none;
    display: grid; gap: calc(6px * var(--ui-scale));
  }
  .ct-bar {
    position: relative;
    height: calc(30px * var(--ui-scale));
    display: flex; align-items: center;
    padding-left: calc(12px * var(--ui-scale));
    background: #4a4a4a5c;
    color: var(--text-soft);
    font-family: var(--font-ui); font-weight: 300;
    font-size: calc(12px * var(--ui-scale));
    letter-spacing: .04em;
  }
  .ct-bar .ct-bar-btn {
    position: absolute; right: 0; top: 0;
    width: calc(99px * var(--ui-scale)); height: 100%;
    border: 0;
    background: #ededed; color: #6a6a6c;
    font-family: var(--font-ui); font-weight: 300;
    font-size: calc(11px * var(--ui-scale));
    letter-spacing: .04em;
    cursor: var(--cursor-target);
    transition: background .16s, color .16s;
  }
  .ct-bar .ct-bar-btn:hover, .ct-bar .ct-bar-btn:focus-visible { background: #fff; color: #0b0b0a; outline: none; }
  #ct-promo-in {
    flex: 1; min-width: 0;
    background: none; border: 0; padding: 0;
    margin-right: calc(105px * var(--ui-scale));
    color: var(--ink);
    font-family: var(--font-ui); font-weight: 600;
    font-size: calc(12px * var(--ui-scale));
    caret-color: var(--ink);
    cursor: var(--cursor-target);
  }
  #ct-promo-in:focus { outline: none; text-shadow: var(--glow-text); }
  #ct-promo-in::placeholder { color: #ffffff42; }
  #ct-total-amt {
    position: absolute; right: 0; top: 0;
    width: calc(99px * var(--ui-scale)); height: 100%;
    display: grid; place-items: center;
    background: #ededed; color: #040402;
    font-family: var(--font-ui); font-weight: 600;
    font-size: calc(12px * var(--ui-scale));
  }
  .ct-subline {
    display: flex; align-items: baseline; justify-content: space-between;
    padding: 0 calc(2px * var(--ui-scale));
    color: var(--mid);
    font-family: var(--font-ui); font-weight: 300;
    font-size: calc(10px * var(--ui-scale));
    letter-spacing: .04em;
  }
  #ct-checkout {
    margin-top: calc(6px * var(--ui-scale));
    height: calc(30px * var(--ui-scale));
    border: 0;
    background: #fefefe; color: #333333;
    font-family: var(--font-ui); font-weight: 300;
    font-size: calc(12px * var(--ui-scale));
    letter-spacing: .06em;
    cursor: var(--cursor-target);
    transition: background .16s;
  }
  #ct-checkout:hover, #ct-checkout:focus-visible { background: #fff; outline: none; }

  /* ═══ THE CHECKOUT STATE (Eric's word, Aug 31) ═══════════════════════
     State swap on the fade token: the cart-state left content fades
     OUT, then the windows fade IN (sequential handoff — the house
     closing-then-arriving grammar). The receipt column never moves. */
  #ct-preview, #ct-grid, #ct-detail { transition: opacity var(--pop-fade); }
  body[data-ct-state="checkout"] #ct-preview,
  body[data-ct-state="checkout"] #ct-grid,
  body[data-ct-state="checkout"] #ct-detail {
    opacity: 0; visibility: hidden; pointer-events: none;
    transition: opacity var(--pop-fade), visibility 0s var(--pop-fade-duration);
  }
  #co-root {
    opacity: 0; visibility: hidden;
    transition: opacity var(--pop-fade), visibility 0s var(--pop-fade-duration);
  }
  body[data-ct-state="checkout"] #co-root {
    opacity: 1; visibility: visible;
    transition: opacity var(--pop-fade) var(--pop-fade-duration), visibility 0s var(--pop-fade-duration);
  }

  /* The windows — frame-true placements ("1 checkout" group; x92 →
     5.32vw etc.), the house translucent plate, the corner triangle. */
  .co-window {
    position: fixed;
    background: var(--bsw-fill);
    z-index: 5;
  }
  .co-tri {
    position: absolute; top: 0; left: 0;
    width: calc(9px * var(--ui-scale)); height: calc(12px * var(--ui-scale));
    background: linear-gradient(to bottom right,
      var(--ink) calc(50% - .5px), transparent calc(50% + .5px));
    pointer-events: none;
  }
  #co-shipping { left: 5.32vw; top: 27.31vh; width: 63.72vw; height: 36.26vh; }
  #co-billing  { left: 5.32vw;  top: 66.25vh; width: 30.73vw; }
  #co-payment  { left: 37.79vw; top: 66.25vh; width: 13.89vw; }
  #co-faster   { left: 53.36vw; top: 66.25vh; width: 15.68vw; height: 10.56vh; }
  .co-head {
    position: absolute; left: calc(14px * var(--ui-scale)); top: calc(13px * var(--ui-scale));
    margin: 0;
    color: var(--ink);
    font-family: var(--font-ui); font-weight: 600;
    font-size: calc(12px * var(--ui-scale));
    letter-spacing: .04em;
  }

  /* Shipping: the tab row (frame y371) and the address book grid
     (2-up 230×110 cards, frame pitch 248/130). */
  .co-tabs {
    position: absolute; left: calc(21px * var(--ui-scale)); top: 5.91vh;
    display: flex; gap: calc(8px * var(--ui-scale));
  }
  .co-tab {
    height: calc(25px * var(--ui-scale));
    padding: 0 calc(12px * var(--ui-scale));
    background: #4a4a4a8a; border: 0;
    color: var(--text-soft);
    font-family: var(--font-ui); font-weight: 300;
    font-size: calc(10px * var(--ui-scale));
    letter-spacing: .04em;
    cursor: var(--cursor-target);
    transition: background .16s, color .16s;

// ── Read-outs ───────────────────────────────────────────────────────────
function sizeText(sel){
  var cl = parseFloat(sel.size.custom.len), cw = parseFloat(sel.size.custom.wid);
  if (cl > 0 && cw > 0) return cl + ' × ' + cw + ' ' + sel.size.unit;
  var sz = HW.sizes[sel.size.preset];
  return T(sz.key) + ' — ' + sz.cm[0] + ' × ' + sz.cm[1] + ' cm';
}
function partText(sel, part){
  var p = sel.parts[part];
  var fam = HW.families[p.family];
  var fin = fam.finishes[p.finish] || fam.finishes[0];
  return T(fam.key) + ' · ' + T(fin.key) + ' · ' + T(HW.colors[p.color.idx].key);
}
function configLine(sel){
  return sizeText(sel) + ' · ' + partText(sel, 'III');
}

// ── The triangle checkbox (shared recipe with /hardware's slots) ───────
var TRI_NS = 'http://www.w3.org/2000/svg';
function makeTri(item, cls){
  var svg = document.createElementNS(TRI_NS, 'svg');
  svg.setAttribute('class', cls + (item.checked ? ' is-checked' : ''));
  svg.setAttribute('viewBox', '0 0 10 10');
  svg.setAttribute('role', 'checkbox');
  svg.setAttribute('aria-checked', String(!!item.checked));
  svg.setAttribute('tabindex', '0');
  svg.setAttribute('aria-label', T(item.classKey) + ' — include at checkout');
  var path = document.createElementNS(TRI_NS, 'path');
  path.setAttribute('d', 'M0.5 0.5 H9 L0.5 9.5 Z');
  svg.appendChild(path);
  function toggle(e){
    e.stopPropagation();
    wake();
    if (!clickOk()) return;
    item.checked = !item.checked;
    save();
    SoundBus.play(item.checked ? 'commit' : 'detent'); hapticTick();
    render();
  }
  svg.addEventListener('click', toggle);
  svg.addEventListener('keydown', function(e){
    if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); toggle(e); }
  });
  return svg;
}

function selectItem(i){
  if (i === selIdx) return;
  selIdx = i;
  SoundBus.play('detent'); hapticTick();
  render();
}
function removeItem(i){
  ITEMS.splice(i, 1);
  if (selIdx >= ITEMS.length) selIdx = ITEMS.length - 1;
  save();
  SoundBus.play('detent'); hapticTick();
  render();
}

// ── Render ──────────────────────────────────────────────────────────────
function render(){
  // grid — items + empties to the frames' resting count
  gridEl.innerHTML = '';
  var n = Math.max(8, ITEMS.length);
  for (var i = 0; i < n; i++){
    (function(idx){
      var item = ITEMS[idx] || null;
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'ct-thumb' + (item ? ' is-filled' : '') + (idx === selIdx ? ' is-live' : '');
      b.setAttribute('role', 'listitem');
      b.tabIndex = item ? 0 : -1;
      if (item){
        b.appendChild(makeTri(item, 'ct-tri'));
        var name = document.createElement('span');
        name.className = 'ct-thumb-name';
        name.textContent = T(item.classKey);
        if (item.img){
          var photo = document.createElement('span');
          photo.className = 'ct-thumb-img';
          photo.style.backgroundImage = 'url(' + item.img + ')';
          b.insertBefore(photo, b.firstChild);   // behind the triangle + name
        }
        b.appendChild(name);
        if (idx === selIdx){
          // the focused product's remove control (sixteenth word) — a
          // role-button span: a real <button> may not nest in the thumb.
          var minus = document.createElement('span');
          minus.className = 'ct-thumb-minus';   // the dash is drawn by the CSS
          minus.setAttribute('role', 'button');
          minus.setAttribute('tabindex', '0');
          minus.setAttribute('aria-label', 'Remove from cart');
          var removeIt = function(e){
            e.stopPropagation();
            wake();
            if (clickOk()) removeItem(idx);
          };
          minus.addEventListener('click', removeIt);
          minus.addEventListener('keydown', function(e){
            if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); removeIt(e); }
          });
          b.appendChild(minus);
        }
        b.setAttribute('aria-label', T(item.classKey) + ' — toggle for checkout, preview');
        // THE TENTH WORD (Eric, Aug 29): the frame itself checks and
        // unchecks — and still drives the big preview + detail column
        // (the note's small-frame -> big-frame rule), one click, both.
        b.addEventListener('click', function(e){
          e.stopPropagation();
          wake();
          if (!clickOk()) return;
          item.checked = !item.checked;
          selIdx = idx;
          save();
          SoundBus.play(item.checked ? 'commit' : 'detent'); hapticTick();
          render();
        });
      }
      gridEl.appendChild(b);
    })(i);
  }

  // the big preview's corner triangle mirrors the selected item
  var old = previewEl.querySelector('.ct-tri');
  if (old) old.remove();
  var sel = ITEMS[selIdx] || null;
  if (sel) previewEl.insertBefore(makeTri(sel, 'ct-tri'), previewEl.firstChild);
  Ball.show(!!sel);
  if (sel) Ball.set(stageParamsFor(sel.sel));

  // item-switch rows (labeled interpretation of the note)
  rowsEl.innerHTML = '';
  ITEMS.forEach(function(item, i){
    var r = document.createElement('button');
    r.type = 'button';
    r.className = 'ct-row' + (i === selIdx ? ' is-live' : '');
    r.setAttribute('role', 'tab');
    r.setAttribute('aria-selected', String(i === selIdx));
    var chip = document.createElement('span');
    chip.className = 'ct-row-chip';
    chip.textContent = (i + 1);
    var bar = document.createElement('span');
    bar.className = 'ct-row-bar';
    var lbl = document.createElement('span');
    lbl.textContent = T(item.classKey);
    var arrow = document.createElement('span');
    arrow.textContent = i === selIdx ? '▾' : '▸';
    bar.appendChild(lbl); bar.appendChild(arrow);
    r.appendChild(chip); r.appendChild(bar);
    r.addEventListener('click', function(e){
      e.stopPropagation();
      wake();
      selectItem(i);
    });
    rowsEl.appendChild(r);
  });

  // detail
  titleEl.textContent = sel ? T('cartItemDeskTitle') : '—';
  specsEl.innerHTML = '';
  if (sel){
    var lines = [
      [T('cartSpecSize'), sizeText(sel.sel)],
      [T('hwSubDesktop') + ' III', partText(sel.sel, 'III')],
      [T('hwSubDesklegs') + ' IV', partText(sel.sel, 'IV')],
      [T('hwSubDesklegs') + ' V', partText(sel.sel, 'V')]
    ];
    lines.forEach(function(l){
      var d = document.createElement('div');
      var k = document.createElement('span');
      k.className = 'ct-spec-k';
      k.textContent = l[0];
      d.appendChild(k);
      d.appendChild(document.createTextNode(l[1]));
      specsEl.appendChild(d);
    });
  }

  // order summary — CHECKED items are the final order
  var checked = ITEMS.filter(function(it){ return it.checked; });
  countEl.textContent = checked.length;
  cardsEl.innerHTML = '';
  checked.forEach(function(item){
    var idx = ITEMS.indexOf(item);
    var card = document.createElement('div');
    card.className = 'ct-card';
    card.appendChild(makeTri(item, 'ct-tri'));
    var img = document.createElement('span');
    img.className = 'ct-card-chipimg';
    if (item.img){
      img.style.backgroundImage = 'url(' + item.img + ')';
      img.style.backgroundSize = 'cover';
      img.style.backgroundPosition = 'center';
    } else {
      img.style.background = '#00000066';       // photo slot, dark until one exists
    }
    var title = document.createElement('span');
    title.className = 'ct-card-title';
    title.textContent = T('cartItemDeskTitle');
    var sub = document.createElement('span');
    sub.className = 'ct-card-sub';
    sub.textContent = configLine(item.sel);
    var x = document.createElement('button');
    x.className = 'ct-card-x';
    x.type = 'button';
    x.textContent = '×';
    x.setAttribute('aria-label', 'Remove');
    x.addEventListener('click', function(e){
      e.stopPropagation();
      wake();
      if (clickOk()) removeItem(idx);            // the X is where deletion lives
    });
    var step = document.createElement('span');
    step.className = 'ct-step';
    var minus = document.createElement('button');
    minus.type = 'button'; minus.textContent = '−';
    minus.setAttribute('aria-label', 'Fewer');
    var nEl = document.createElement('span');
    nEl.className = 'ct-step-n';
    nEl.textContent = item.qty || 1;
    var plus = document.createElement('button');
    plus.type = 'button'; plus.textContent = '+';
    plus.setAttribute('aria-label', 'More');
    minus.addEventListener('click', function(e){
      e.stopPropagation(); wake();
      item.qty = Math.max(1, (item.qty || 1) - 1);
      save(); SoundBus.play('detent'); hapticTick(); render();
    });
    plus.addEventListener('click', function(e){
      e.stopPropagation(); wake();
      item.qty = (item.qty || 1) + 1;
      save(); SoundBus.play('detent'); hapticTick(); render();
    });
    step.appendChild(minus); step.appendChild(nEl); step.appendChild(plus);
    var price = document.createElement('span');
    price.className = 'ct-card-price';
    price.textContent = '$' + PLACEHOLDER_PRICE_USD;   // the ruled $1 (unit)
    card.appendChild(img); card.appendChild(title); card.appendChild(sub);
    card.appendChild(x); card.appendChild(step); card.appendChild(price);
    cardsEl.appendChild(card);
  });
  // ══ PRICE SEAMS, the item side now fed ══ every item is the $1
  // placeholder (Eric, Aug 29): subtotal/total = Σ checked qty × $1.
  // Shipping and tax stay "—" — those sources are still unruled.
  var sum = 0;
  checked.forEach(function(it){ sum += (it.qty || 1) * PLACEHOLDER_PRICE_USD; });
  document.getElementById('ct-total-amt').textContent = '$' + sum;
  document.getElementById('ct-subtotal-amt').textContent = '$' + sum;
}

// The forms — the factored .bs-field grammar (its third consumer),
// structure as data; every label an STR key.
function buildField(spec){
  var wrap = document.createElement('div');
  wrap.className = 'bs-field' + (spec.wide ? ' bs-field--wide' : '');
  var lab = document.createElement('label');
  lab.setAttribute('data-str', spec.str);
  lab.setAttribute('for', spec.id);
  var inp = document.createElement('input');
  inp.className = 'bs-input';
  inp.id = spec.id; inp.type = 'text';
  inp.autocomplete = 'off';
  inp.spellcheck = false;
  wrap.appendChild(lab); wrap.appendChild(inp);
  return { wrap: wrap, input: inp };
}
var SHIP_SPEC = [
  { key: 'name',    id: 'co-s-name',    str: 'coFullName' },
  { key: 'country', id: 'co-s-country', str: 'coCountry' },
  { key: 'phone',   id: 'co-s-phone',   str: 'coPhone' },
  { key: 'city',    id: 'co-s-city',    str: 'coCity' },
  { key: 'postal',  id: 'co-s-postal',  str: 'coPostal' },
  { key: 'street',  id: 'co-s-street',  str: 'coStreet' },
  { key: 'company', id: 'co-s-company', str: 'coCompanyLine', wide: true, opt: true }
];
var BILL_SPEC = [
  // six fields, the design's own set (p3 draws phone in billing too)
  { key: 'name',    id: 'co-b-name',    str: 'coFullName' },
  { key: 'country', id: 'co-b-country', str: 'coCountry' },
  { key: 'phone',   id: 'co-b-phone',   str: 'coPhone' },
  { key: 'city',    id: 'co-b-city',    str: 'coCity' },
  { key: 'postal',  id: 'co-b-postal',  str: 'coPostal' },
  { key: 'street',  id: 'co-b-street',  str: 'coStreet' }
];
var shipF = {}, billF = {};
SHIP_SPEC.forEach(function(s){ var f = buildField(s); shipF[s.key] = f; document.getElementById('co-ship-form').appendChild(f.wrap); });
BILL_SPEC.forEach(function(s){ var f = buildField(s); billF[s.key] = f; document.getElementById('co-bill-form').appendChild(f.wrap); });
// payment — the fields render and NOTHING persists or prefills them;
// the real charge path is the commerce phase's to rule.
(function(){
  var form = document.getElementById('co-pay-form');
  var num  = buildField({ id: 'co-p-num',  str: 'coCardNumber' });
  num.input.inputMode = 'numeric';
  var name = buildField({ id: 'co-p-name', str: 'coCardName' });
  form.appendChild(num.wrap); form.appendChild(name.wrap);
  // expiration: the design draws ONE label over ONE line, both dates
  // BELOW it around a centered dash (Eric's reference, Aug 31)
  var exp = document.createElement('div');
  exp.className = 'bs-field';
  var lab = document.createElement('label');
  lab.setAttribute('data-str', 'coCardExp');
  lab.setAttribute('for', 'co-p-exp-a');
  var vals = document.createElement('div');
  vals.className = 'co-exp-vals';
  var a = document.createElement('input');
  a.className = 'bs-input'; a.id = 'co-p-exp-a'; a.type = 'text';
  a.autocomplete = 'off'; a.spellcheck = false; a.inputMode = 'numeric';
  var dash = document.createElement('span');
  dash.className = 'co-dash'; dash.textContent = '-';
  var b = document.createElement('input');
  b.className = 'bs-input'; b.id = 'co-p-exp-b'; b.type = 'text';
  b.autocomplete = 'off'; b.spellcheck = false; b.inputMode = 'numeric';
  b.setAttribute('aria-label', 'Expiration end (MM / YY)');
  vals.appendChild(a); vals.appendChild(dash); vals.appendChild(b);
  exp.appendChild(lab); exp.appendChild(vals);
  form.appendChild(exp);
})();

// THE ADDRESS BOOK — localStorage on the cartStore's discipline (v1
// schema, try/catch, LABELED default pending the persistence ruling).
// Addresses only — payment data is NEVER stored.
var BOOK = (function(){
  try {
    var d = JSON.parse(localStorage.getItem('bs-addr-v1') || 'null');
    if (d && d.v === 1 && Array.isArray(d.list)) return d.list;
  } catch(e){}
  return [];
})();
function saveBookStore(){ try { localStorage.setItem('bs-addr-v1', JSON.stringify({ v: 1, list: BOOK })); } catch(e){} }
var bookSel = -1;
var bookEl  = document.getElementById('co-book');
function renderBook(){
  bookEl.innerHTML = '';
  BOOK.forEach(function(a, i){
    var c = document.createElement('button');
    c.type = 'button';
    c.className = 'co-card' + (i === bookSel ? ' is-sel' : '');
    c.setAttribute('role', 'listitem');
    var b = document.createElement('b'); b.textContent = a.name || '—';
    c.appendChild(b);
    [[a.street, a.city].filter(Boolean).join(', '),
     [a.postal, a.country].filter(Boolean).join(' · '),
     a.phone || ''].forEach(function(line){
      var s = document.createElement('span'); s.textContent = line; c.appendChild(s);
    });
    c.addEventListener('click', function(e){
      e.stopPropagation(); wake();
      if (!clickOk()) return;
      bookSel = i;
      Object.keys(shipF).forEach(function(k){ shipF[k].input.value = a[k] || ''; });
      syncBilling();
      SoundBus.play('detent'); hapticTick();
      renderBook();
    });
    bookEl.appendChild(c);
  });
}

// The tab row: address book TOGGLES the card grid · add new clears ·
// save banks the fields (update the chosen card, else a new one) — the
// save flow is a LABELED interpretation awaiting design confirm.
var tabBook = document.getElementById('co-tab-book');
var tabNew  = document.getElementById('co-tab-new');
var tabSave = document.getElementById('co-tab-save');
tabBook.addEventListener('click', function(e){
  e.stopPropagation(); wake();
  if (!clickOk()) return;
  var on = shipWin.classList.toggle('is-book');
  tabBook.classList.toggle('is-on', on);
  tabBook.setAttribute('aria-pressed', String(on));
  SoundBus.play(on ? 'commit' : 'detent'); hapticTick();
});
tabNew.addEventListener('click', function(e){
  e.stopPropagation(); wake();
  if (!clickOk()) return;
  bookSel = -1;
  Object.keys(shipF).forEach(function(k){ shipF[k].input.value = ''; });
  renderBook();
  shipF.name.input.focus();
  SoundBus.play('detent'); hapticTick();
});
tabSave.addEventListener('click', function(e){
  e.stopPropagation(); wake();
  if (!clickOk()) return;
  var req = SHIP_SPEC.filter(function(s){ return !s.opt; }).map(function(s){ return shipF[s.key].input; });
  var bad = C.validateFields(req);
  if (bad){ denyOn(tabSave); bad.focus(); return; }   // the house invalid-submit deny
  var entry = {};
  SHIP_SPEC.forEach(function(s){ entry[s.key] = shipF[s.key].input.value.trim(); });
  if (bookSel >= 0) BOOK[bookSel] = entry;
  else { BOOK.push(entry); bookSel = BOOK.length - 1; }
  saveBookStore();
  renderBook();
  shipWin.classList.add('is-book');                   // the save's receipt: the book shows
  tabBook.classList.add('is-on');
  tabBook.setAttribute('aria-pressed', 'true');
  SoundBus.play('commit'); hapticTick();
});

// The expandables — the note group's law: collapsed by default, the
// head is the toggle.
function bindExp(winId){
  var win = document.getElementById(winId);
  var head = win.querySelector('.co-exp-head');
  head.addEventListener('click', function(e){
    e.stopPropagation(); wake();
    if (!clickOk()) return;
    var open = win.classList.toggle('is-open');
    head.setAttribute('aria-expanded', String(open));
    SoundBus.play(open ? 'commit' : 'detent'); hapticTick();
  });
  return win;
}
function collapseExp(win){
  win.classList.remove('is-open');
  win.querySelector('.co-exp-head').setAttribute('aria-expanded', 'false');
}
var billWin = bindExp('co-billing');
var payWin  = bindExp('co-payment');

// use-shipping-as-billing: checked mirrors the shipping fields live and
// rests the billing form; unchecking frees it (values kept).
var useShip = document.getElementById('co-useship-in');
function syncBilling(){
  if (!useShip.checked) return;
  BILL_SPEC.forEach(function(s){ billF[s.key].input.value = shipF[s.key] ? shipF[s.key].input.value : ''; });
}
useShip.addEventListener('change', function(){
  wake();
  document.getElementById('co-bill-form').classList.toggle('co-bill-off', useShip.checked);
  syncBilling();
  SoundBus.play('detent'); hapticTick();
});
SHIP_SPEC.forEach(function(s){
  shipF[s.key].input.addEventListener('input', function(){ syncBilling(); });
});

// The state machine: crumbs + the summary's checkout button walk the
// two states; the FINAL submission (checkout while in checkout) denies.
function setPageState(s){
  if (pageState === s) return;
  pageState = s;
  document.body.setAttribute('data-ct-state', s);
  crumbCart.classList.toggle('is-here', s === 'cart');
  crumbCheckout.classList.toggle('is-here', s === 'checkout');
  if (s === 'cart') crumbCart.setAttribute('aria-current', 'page'); else crumbCart.removeAttribute('aria-current');
  if (s === 'checkout') crumbCheckout.setAttribute('aria-current', 'page'); else crumbCheckout.removeAttribute('aria-current');
  coRoot.setAttribute('aria-hidden', String(s !== 'checkout'));
  if (s === 'checkout'){
    Ball.show(false);
    collapseExp(billWin); collapseExp(payWin);        // collapsed by default — the note's law
  } else {
    render();                                          // restores preview + ball per selection
  }
}
crumbCheckout.addEventListener('click', function(e){
  e.stopPropagation(); wake();
  if (pageState !== 'cart' || !clickOk()) return;
  SoundBus.play('commit'); hapticTick();
  setPageState('checkout');
});
crumbCart.addEventListener('click', function(e){
  e.stopPropagation(); wake();
  if (pageState !== 'checkout' || !clickOk()) return;
  SoundBus.play('detent'); hapticTick();
  setPageState('cart');
});
(function(){
  var co = document.getElementById('ct-checkout');
  co.addEventListener('click', function(e){
    e.stopPropagation(); wake();
    if (pageState === 'cart'){
      if (clickOk()){ SoundBus.play('commit'); hapticTick(); setPageState('checkout'); }
      return;
    }
    denyOn(co);   // the final submission — commerce wiring is unruled
  });
})();

var _leaving = false;
function leaveBack(){
  if (_leaving || !clickOk()) return;
  _leaving = true;
  if (arrival){
    setTimeout(function(){
      if (_leaving && !document.hidden){ _leaving = false; location.assign(C.ROUTES.home); }
    }, 350);
    history.back();
    return;
  }
  location.assign(C.ROUTES.home);
}
(backBtn.closest('.bs-hit') || backBtn).addEventListener('click', function(){ wake(); leaveBack(); });

links.forEach(function(link){
  link.addEventListener('click', function(e){
    e.stopPropagation();
    wake();
    var sec = link.getAttribute('data-section');
    if (C.ROUTES[sec]){ if (clickOk()) C.nav.commit(sec); return; }
    denyOn(link);
  });
});
primary.addEventListener('click', function(e){
  if (e.target.closest('.site-primary-nav__link')) return;
  wake();
  if (pillPrimary.touchOpenConsumed()) return;
  if (C.rail.lockIndex() === RAIL_PILL) C.rail.unlock();
  else C.rail.lock(RAIL_PILL);
});

// ── Mount ───────────────────────────────────────────────────────────────
var RAIL_BACK = 0, RAIL_PILL = 1;
var ladder = C.makeLadder([
  // the checkout rungs (Eric, Aug 31): field → window → state, then
  // the page boundary — one instrumented walker, house law.
  { name: 'field', when: function(){
      return pageState === 'checkout' && document.activeElement &&
             coRoot.contains(document.activeElement) &&
             document.activeElement.classList.contains('bs-input');
    },
    step: function(){ document.activeElement.blur(); } },
  { name: 'window', when: function(){
      return pageState === 'checkout' && !!coRoot.querySelector('.co-exp.is-open');
    },
    step: function(){
      Array.prototype.forEach.call(coRoot.querySelectorAll('.co-exp.is-open'), collapseExp);
    } },
  { name: 'state', when: function(){ return pageState === 'checkout'; },
    step: function(){ SoundBus.play('detent'); setPageState('cart'); } },
  { name: 'boundary', when: function(){ return true; },
    step: function(){ if (arrival) leaveBack(); } }
]);
C.init({
  page: 'cart',
  leadingControls: [
    { headEl: backBtn, pill: null, activate: leaveBack },
    { headEl: primary, pill: pillPrimary, trayAxis: 'x',
      trayItems: function(){ return links; } }
  ],
  touchSurfaces: [document.getElementById('bs-stage')],
  sweepRoots: [cornerEl, gridEl, cardsEl, document.getElementById('ct-detail'), coRoot],
  hooks: {
    isLocked:       function(){ return false; },
    goBack:         function(){ ladder.back(); },
    escapeFromRail: function(){},
    enterAtPrimary: function(){},
    verticalStep:   function(){},
    railVertical:   function(){},
    horizontalCold: function(){},
    wheelNative:    function(e){
      if (gridEl.contains(e.target))  return gridEl.scrollHeight > gridEl.clientHeight + 1;
      if (cardsEl.contains(e.target)) return cardsEl.scrollHeight > cardsEl.clientHeight + 1;
      if (bookEl.contains(e.target))  return bookEl.scrollHeight > bookEl.clientHeight + 1;
      var rows = document.getElementById('ct-rows');
      if (rows.contains(e.target)) return rows.scrollHeight > rows.clientHeight + 1;
      return false;
    },
    wheelStep:      function(){ return false; },
    wheelPitch:     function(){ return 55; },
    clearPrimary:   function(){},
    idleReset:      function(){ C.rail.focus(-1); },
    onLangChange:   function(T2){
      links.forEach(function(l){ l.textContent = T2(l.getAttribute('data-section')); });
      renderStrings();
      render();
      document.title = T2('cartTitle');
    },
    onFontsReady:   function(){},
    devState:       function(){
      window.__ctBall = Ball;
      return { items: ITEMS.length, checked: ITEMS.filter(function(i){ return i.checked; }).length,
               selIdx: selIdx, arrival: arrival,
               state: pageState, book: BOOK.length };
    }
  }
});

// ── Boot ────────────────────────────────────────────────────────────────
renderStrings();
links.forEach(function(l){ l.textContent = T(l.getAttribute('data-section')); });
document.getElementById('ct-promo-in').setAttribute('placeholder', T('cartPromo'));
C.normalizeWordGlow();
Ball.boot();
Ball.stage({ cx: 0.5, cy: 0.55, rad: 0.36 });    // centered in the preview frame
(function backfillPhotos(){
  var dirty = false;
  ITEMS.forEach(function(it){
    var stale = !it.img || it.img.slice(0, 15) === 'data:image/jpeg';
    if (stale && it.sel){
      var img = snapshotOf(stageParamsFor(it.sel));
      if (img){ it.img = img; dirty = true; }
    }
  });
  if (dirty) save();
})();
render();

window.addEventListener('pageshow', function(e){
  if (e.persisted){
    _leaving = false;
    ITEMS = C.cartStore.load();                  // /hardware may have changed the truth
    if (selIdx >= ITEMS.length) selIdx = ITEMS.length - 1;
    if (selIdx < 0 && ITEMS.length) selIdx = 0;
    render();
  }
});
// Cross-tab, same truth.
window.addEventListener('storage', function(e){
  if (e.key === C.cartStore.key){
    ITEMS = C.cartStore.load();
    if (selIdx >= ITEMS.length) selIdx = ITEMS.length - 1;
    if (selIdx < 0 && ITEMS.length) selIdx = 0;
    render();
  }
});

})();
</script>
</body>
</html>
