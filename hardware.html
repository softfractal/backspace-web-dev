<html lang="en">

<title>BACKSPACE — Hardware</title>
<!--
  backspace — /hardware (page five), phase one: the OASIS catalog. The
  founder's directive made this page the reason the site exists: class
  select on the left, the stage in the center, the customization column
  on the right. Cart tray and checkout are PHASE 2 by Eric's Aug 28 word.

  GEOMETRY AUTHORITY: the six B-1 frames as extracted by the GM
  (product_frames_geometry.csv / product_frames_values.md) through the
  proportional layer (reports/product_frames_proportional.md): place →
  vw/vh fractions, chrome → px × --ui-scale, solved values → runtime.
  The 0.9 note applies: --ui-scale is 1920-based, so frame-measured
  chrome renders 0.9× at the frames' own 1728×1117 — shipped, certified
  behavior on all four siblings; nothing here retunes it.

  ERIC'S AUG 28 RULINGS BUILT IN:
  · blue dot #125277 = right/product-menu active — RATIFIED into the
    vocabulary (may extend house-wide; this page is its first consumer).
  · the window draw on THIS page is the revived v2 DIAGONAL mechanic
    (.bs-window--diag): the design team drew the second BR triangle
    because they designed against v2. /support keeps its waterfall.
  · the stage carries a live TEXTURE BALL as the product placeholder —
    a WebGL PBR sphere consuming the selection state through the
    STAGE-BINDING SEAM (applySelectionToStage). The eventual desk GLB
    (color ramp + procedural nodes in its texture map) replaces the
    ball BEHIND the seam; the interaction layer never changes.
  · color is the one live SLIDE BAR (the per-color scrubbers of Eric's
    p1 reference: tick strips, A/D on the active row); metallic and
    roughness arrive as PRESETS — carried by the FINISH choice, whose
    manifest rows hold {metal, rough}. Structures live now.
  · the custom size input is BUILT LIVE and drives the ball's scale.
    The ops free-size gate stands for COMMERCE wiring, not for the
    visual (nothing sells in phase one — the cart denies).
  · the eight unreal classes PREVIEW as coming-soon (the locked-classes
    game pattern): selecting one re-targets the stage to the notice;
    desk is the only real product and the resting selection.
  · type is LIVE FACES at ui-scaled sizes matched to the outlined
    frames' estimates (÷0.9 derivation) — sizes grow with the window.
    Per-rung values are PROVISIONAL pending the §5.1 design confirm.

  THE MACHINE on this page: the class menu is the primary W/S surface
  (the shared .bs-item grammar verbatim — red dot, shift, 300/600).
  The right product menu is click-to-open (Enter's twin via Tab focus),
  blue-dot grammar, expand-downward sub-lists in the factored slots.
  Choosing a CUSTOM sub selects a part and draws the options panel
  (diagonal window, right-anchored 3.30vw); inside it W/S walks the
  color rows and A/D scrubs the active row — axes never double-book.
  The Esc ladder (C.makeLadder): field → panel+sub → header → cursor →
  boundary. NO page locks. Idle attract restores the resting state but
  never sweeps a half-filled custom-size input (something to lose).

  FACTORED MACHINERY CONSUMED (the Aug 28 trio — this page is the
  second consumer that fired the trigger): C.buildSlots (class menu),
  the .bs-menu-slot/.bs-sublist/.bs-subitem accordion CSS (right menu),
  C.makeLadder, the .bs-field form grammar + C.validateFields (custom
  size), C.capMid + --bs-dot-y (every marker), C.measureListPitch.

  DO-NOT-PORT (values companion §6), honored: lowercase "cart", the
  static $3499/$4141 (the price slot runs on the RULED FAKE $1
  placeholder — Eric, Aug 29 — never the frames' statics; the real
  per-configuration source rides the phase-2 cart session), the
  mocked-in cursor,
  the frames' embedded desk renders. The BR triangle is NOT on the list
  anymore — it came back with the diagonal ruling.
-->
<link rel="stylesheet" href="shared/bs-chrome.css">
<style>
  /* ── Page tokens — the proportional layer's canonical values ────────── */
  body[data-bs-page="hardware"] {
    /* Class menu: the 3.76vw rail (the shipped rail — the frames re-draw
       it exactly); OASIS header top 246.4/1117. */
    --hw-left-top: 22.06vh;
    /* Right menu: INTRODUCTION top 242.4/1117 (matches /support's
       21.76vh to 0.7px — ported as drawn, NOT harmonized); text rail
       inset 64/1728, the near-mirror of the left rail. */
    --hw-right-top: 21.70vh;
    /* The options panel (diagonal bs-window), right-anchored: right
       edge = the tray's right rail = ONE 3.30vw rail (x1671). */
    --hw-panel-right: 3.30vw;
    --hw-panel-top: 38.94vh;
    --hw-panel-w: 26.33vw;
    --hw-panel-maxh: 37.69vh;
    --hw-text-inset: max(clamp(34px, 3.8vw, 68px), 3.76vw);
    /* THE CART'S TOP EDGE drives the panel and the add row (Eric, Sept 5:
       "when cart is collapsed, the customization interface and add to cart
       bar gets dropped ... when cart is expanded [they] get pushed up" —
       the SAME gap to the cart in both states). Collapsed: the strip's
       top. Expanded (body.hw-cart-open): the rails' top. */
    --hw-cart-top: 95.34vh;
    --hw-cart-gap: 4.745vh;          /* add row bottom → cart top: the frame's 53px (944 − 891) */
    --hw-panel-lift: 0.716vh;        /* panel bottom → add row top: the frame's 8px (856 → 864) */
    --hw-cart-delay: var(--pop-fade-duration);   /* the DESCENT waits for the band's contents to fade, like the rule; the ascent is immediate */   /* where the TEXTS sit from the window edge — OASIS's x and INTRODUCTION's right edge (65.7px at the frame, both sides): the left rail's own expression (Eric, Sept 5) */
    /* Introduction plates: 19.04 / 39.58 / 60.19vw · top 31.51vh ·
       w 19.27vw · aspect locked 333/309 (proposal, on the record). */
    --hw-plate-top: 31.51vh;
    --hw-plate-w: 19.27vw;
  }
  body.hw-cart-open { --hw-cart-top: 84.51vh; --hw-cart-delay: 0s; }

  /* ── The stage — the flexing center. The BALL canvas fills it; the
     coming-soon notice replaces it for unreal classes. ────────────────── */
  #hw-ball {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    display: block;
    z-index: 1;                     /* above the bg, below every control */
    pointer-events: none;
    opacity: 1;
    transition: opacity var(--pop-fade);
  }
  #hw-ball.is-off { opacity: 0; }
  #hw-coming {
    position: fixed;
    left: 26vw; right: 32vw;        /* the stage's own midfield */
    top: 44vh;
    z-index: 2;
    text-align: center;
    opacity: 0; visibility: hidden; pointer-events: none;
    transition: opacity var(--pop-fade), visibility 0s var(--pop-fade-duration);
  }
  #hw-coming.is-on {
    opacity: 1; visibility: visible;
    transition: opacity var(--pop-fade), visibility 0s;
  }
  #hw-coming .hw-coming-head {
    color: var(--ink);
    font-family: var(--font-ui); font-weight: 600;
    font-size: calc(22px * var(--ui-scale));
    letter-spacing: .14em;
    text-shadow: var(--bloom-rest);   /* standing copy (HOTNESS LAW) */
  }
  #hw-coming .hw-coming-sub {
    margin-top: calc(10px * var(--ui-scale));
    color: var(--text-soft);
    font-family: var(--font-sans); font-weight: 300;
    font-size: calc(12px * var(--ui-scale));
    line-height: 1.6;
  }

  /* ── The class menu (left) — the RPG class select. .bs-item consumed
     VERBATIM (the shared grammar IS the frame's: red dot at the rail,
     the 33px×ui shift, 300 rest / 600 active); placement page-side. ──── */
  #hw-class-head {
    position: fixed;
    top: var(--hw-left-top);
    left: max(clamp(34px, 3.8vw, 68px), 3.76vw);
    z-index: 16;
    color: var(--ink);
    font-family: var(--font-ui); font-weight: 600;
    /* TWELFTH WORD (Eric, Aug 29): the eleventh reverted — his eye
       confirms the seventh word's balance: OASIS at 17px×ui, the
       INTRODUCTION/CUSTOM heads at −25% (12.75). This pairing is now
       twice-ruled; treat it as settled. */
    /* THE TYPE PASS (Eric, Sept 3, from the design team's Figma): OASIS shares
       the 14 rung with the menus (their 14 → our 14, WideSemiBold); the
       17px×ui of the twelfth word is superseded. */
    font-size: calc(14px * var(--ui-scale));
    line-height: calc(15px * var(--ui-scale));
    letter-spacing: .08em;
    /* HOTNESS LAW: a STANDING title (never hovers) — glows at rest at the
       reference's rest hotness; g solved by the harness (Sept 3). */
    text-shadow: var(--bloom-rest); --bloom-g-rest: .514;   /* re-solved on the 14 rung */
  }
  #hw-class-menu {
    position: fixed;
    /* Header ink 246.4 → first row 291.5: 45 frame-px of header-to-row
       air; the header's own 18px line leaves 27px×ui of margin. */
    top: calc(var(--hw-left-top) + 45px * var(--ui-scale));
    left: max(clamp(34px, 3.8vw, 68px), 3.76vw);
    z-index: 16;
    display: grid;
    /* Frame pitch 30 (baseline-uniform, nine rows): 15px×ui line boxes
       + 15px×ui gap. The wheel walks the MEASURED pitch regardless. */
    gap: calc(15px * var(--ui-scale));
    color: var(--text-soft);
  }
  #hw-class-menu .bs-item { font-weight: 300; font-size: calc(12px * var(--ui-scale)); line-height: calc(13px * var(--ui-scale)); }   /* THE TYPE PASS: their 12 (product category) — the hotness reference re-solved on it */
  #hw-class-menu .bs-item.kb-hover,
  #hw-class-menu .bs-item:focus-visible,
  #hw-class-menu .bs-item.active { font-weight: 600; }

  /* ── The product menu (right) — INTRODUCTION / CUSTOM, blue-dot
     grammar, the factored accordion mirrored to a right rail. The
     headers hold the rail when open (the frames draw no shift and no
     dot on them — weight alone marks the open header). ────────────────── */
  #hw-product-menu {
    position: fixed;
    top: var(--hw-right-top);
    right: max(clamp(34px, 3.8vw, 68px), 3.70vw);
    z-index: 16;
    display: grid;
    /* THE EIGHTH WORD (Eric, Aug 28): the INTRODUCTION↔CUSTOM gap
       halved — 18.75px×ui (pitch 32.25×ui). This SUPERSEDES the drawn
       51 frame-px header pitch; Eric's eye rules over the frame. */
    gap: calc(18.75px * var(--ui-scale));
    color: var(--text-soft);
    justify-items: end;
  }
  .hw-head {
    background: none; border: 0; padding: 0;
    color: var(--text-soft);
    /* WEIGHT 600 AT REST (Eric, Aug 28 fourth word: INTRODUCTION and
       CUSTOM read at the OASIS title's size — the rest-300 made them
       read smaller than the same 17px rung). They join the home menu's
       certified 600-rest exclusion as heading-class controls; open
       state distinguishes by ink, not weight. */
    font-family: var(--font-ui); font-weight: 600;
    /* 75% OF THE OASIS RUNG (Eric, Aug 28 seventh word — supersedes the
       fifth word's halving, which his eye read as too small): 17 × 0.75
       = 12.75px×ui, letterspaced caps sitting between the title and the
       item rows. The §5.1 live-text confirm still closes the rung class. */
    /* THE TYPE PASS (Sept 3): Eric's own rung for these heads — 10.5 (their
       14 read too big for the balance); 75% of OASIS still. */
    font-size: calc(10.5px * var(--ui-scale));
    line-height: calc(11px * var(--ui-scale));
    letter-spacing: .08em;
    text-align: right; white-space: nowrap;
    /* HOTNESS LAW: no resting glow (hoverable); lit on the one ring set,
       intensity 1.052 (the harness's median for the two heads). */
    --bloom-g: 1.12;   /* re-solved on the 10.5 rung (INTRODUCTION 1.10 · CUSTOM 1.14 per string) */
    cursor: var(--cursor-target);
    transition: color .16s;
  }
  .hw-head.kb-hover, .hw-head:focus-visible {
    color: #fff; outline: none;
    text-shadow: var(--bloom-lit);
  }
  .hw-head.is-open { color: var(--ink); font-weight: 600; }
  /* The right menu's slots consume the factored accordion; only the
     mirror is page-side: rows right-aligned, indent on the RIGHT. */
  #hw-product-menu .bs-menu-slot { justify-items: end; }
  /* POP ROOM (Eric's ninth word: "when longer text pops out, they get
     cut off") — the factored accordion clips at the flush labels' left
     edge, so a label translated inward painted outside the box. The
     sublist reserves the shift on its left; the clip now covers the
     full pop. */
  #hw-product-menu .bs-sublist {
    justify-items: end;
    padding-left: var(--side-menu-shift-x);
  }
  /* THE POP-OUT (Eric's seventh word: the blue-dot children pop out
     like the red-dot side's) — the .bs-item grammar MIRRORED, which is
     what the frames drew all along: REST sub-items sit FLUSH at the
     rail (right edge 1664); the hovered/active one slides INWARD by the
     shift (→ 1629.6) while the blue dot fades in at the rail — and the
     part numerals reveal WITH the pop (the frames draw them only on
     the active row). */
  #hw-product-menu .bs-subitem {
    padding-left: 0;
    padding-right: 0;                          /* flush at the rail at rest */
    justify-self: end;
    text-align: right;
    font-size: calc(12px * var(--ui-scale));   /* THE TYPE PASS: their 12 (left-menu children) */
    line-height: calc(14px * var(--ui-scale));
  }
  #hw-product-menu .bs-subitem .bs-nav-label {
    display: inline-block;
    transition: transform var(--side-menu-motion);
  }
  #hw-product-menu .bs-subitem.kb-hover .bs-nav-label,
  #hw-product-menu .bs-subitem:focus-visible .bs-nav-label,
  #hw-product-menu .bs-subitem.is-live .bs-nav-label {
    transform: translateX(calc(-1 * var(--side-menu-shift-x)));
  }
  #hw-product-menu .bs-subitem.is-live {
    color: #fff; font-weight: 600;
  }
  /* THE BLUE DOT — vocabulary member four (ratified): solid #125277,
     5×5×ui at the rail, y cap-mid solved (--bs-dot-y). A pseudo on
     every sub-item, revealed by the pop — hover AND active, exactly
     the red dot's fade grammar. */
  /* ═ THE HOLLOW-DOT LAW (Eric, Aug 31) ═ For menus where one item can
     POP while another stands SELECTED (this page's two side menus are
     the type's only consumers today; the law is recorded in the canon
     for future menus of the kind): the popped-UNSELECTED item wears
     the OUTLINE dot — selection FILLS it. The hollow state carries the
     soft glow rung only: a 1px ring drowns under the full ladder at
     5px×ui, so the fill is what the eye reads as the choice. */
  #hw-product-menu .bs-subitem::after {
    content: ''; position: absolute;
    right: 0;
    top: var(--bs-dot-y, 50%);
    width: calc(5px * var(--ui-scale)); height: calc(5px * var(--ui-scale));
    background: transparent;                     /* hollow until chosen */
    border: 1px solid var(--bs-marker-blue);
    box-sizing: border-box;
    border-radius: 50%;
    box-shadow: 0 0 calc(9px * var(--ui-scale)) rgba(18, 82, 119, .5);
    transform: translateY(-50%);
    opacity: 0;
    transition: opacity var(--side-menu-fade);
  }
  #hw-product-menu .bs-subitem.is-live::after {
    background: var(--bs-marker-blue);           /* the choice fills */
    /* The fitted spread ladder at the blue's own hue (PROVISIONAL —
       parity with the warm marker's ladder; one line strikes it). */
    box-shadow:
      0 0 calc(9px  * var(--ui-scale))                              rgba(18, 82, 119, .85),
      0 0 calc(32px * var(--ui-scale)) calc(3px  * var(--ui-scale)) rgba(18, 82, 119, .42);
  }
  /* the red side — the class menu obeys the same law (the pair's
     .bs-item stays untouched: /home's commit-away menu is a DIFFERENT
     type and keeps its certified filled dot) */
  #hw-class-menu .bs-item.kb-hover:not(.active)::before {
    background: transparent;
    border: 1px solid var(--color-signal-red);
    box-sizing: border-box;
    box-shadow: 0 0 8px rgba(157, 31, 0, .35);
  }
  /* THE TYPE PASS (Eric, Sept 3): the focused child carries NO dot — the glow
     alone marks focus; the filled dot marks the selection. */
  #hw-product-menu .bs-subitem.is-live::after { opacity: 1; }
  /* The chosen-ring stays available in this menu for CHOSEN semantics
     (none in phase one — the ring belongs to the panel's options). */

  /* THE NUMERALS RETIRED (Eric, Aug 31): the roman part selectors and
     the stage strip leave the custom children — the design team is
     taking the diy phase function another direction. SEL.part machinery
     stays internal (rows select their default part); the desklegs
     IV-vs-V pick has no surface until the new direction lands — on the
     record in the build report. */

  /* ── The introduction plates — three DIAGONAL windows center-stage
     (ruled: build with the bs-window subsystem; lorem via the manifest;
     picture/video + text presumed — the media slot is the dark box). ─── */
  .hw-plate {
    position: fixed;
    top: var(--hw-plate-top);
    width: var(--hw-plate-w);
    aspect-ratio: 333 / 309;        /* the frames' shape, locked (proposal) */
    z-index: 12;
    color: var(--text-soft);
  }
  #hw-plate-1 { left: 19.04vw; }
  #hw-plate-2 { left: 39.58vw; }
  #hw-plate-3 { left: 60.19vw; }
  /* TEXTLESS (Eric, Aug 28 fourth word, p1): the plates carry no copy
     in phase one — the frame IS the content slot; picture/video mounts
     into the media box at the manifest. */
  .hw-plate-body {
    position: absolute; inset: 0;
    padding: calc(14px * var(--ui-scale));
  }
  .hw-plate-media {
    width: 100%; height: 100%;
    background: #00000066;          /* the picture/video slot, dark at rest */
  }

  /* ── The options panel — THE diagonal window, right-anchored on the
     shared 3.30vw rail. ONE HEIGHT FOR EVERY VIEW (Eric, Sept 5: "they
     should all possess the same height, if the contents don't fill it
     all the way down, it's okay"): the frame's full window, 37.69vh —
     content no longer measures it; short content leaves air at the
     foot, tall content scrolls natively inside (wheelNative). ────────── */
  #hw-panel {
    position: fixed;
    right: var(--hw-panel-right);
    /* BOTTOM-ANCHORED (Eric, Aug 28 fourth word): every pop-up window
       EXPANDS UPWARD, growing out of the fixed add row. The frames'
       panel bottom is 856/1117 -> 23.37vh (8 frame-px above the row at
       864); short content hugs the row, and a face switch travels the
       TOP edge on the tempo. The 38.94vh frame top is the full-height
       cap's far end (measurePanel). */
    /* Sept 5: the bottom FOLLOWS THE CART — 23.37vh with the cart expanded
       (unchanged), 12.5vh lower with it collapsed. */
    bottom: calc(100vh - var(--hw-cart-top) + var(--hw-cart-gap) + 30px * var(--ui-scale) + var(--hw-panel-lift));
    transition:
      height     var(--pop-duration) var(--expand-curve),
      opacity    var(--pop-fade),
      visibility 0s,
      bottom     var(--pop-duration) var(--expand-curve) var(--hw-cart-delay, 0s);
    width: var(--hw-panel-w);
    min-width: calc(320px * var(--ui-scale));  /* usability floor (proposal) */
    height: var(--hw-panel-maxh);              /* the one height (Eric, Sept 5) — the frame's window, top at 38.94vh */
    z-index: 18;
    color: var(--text-soft);
  }
  #hw-panel.is-hidden { transition: height var(--pop-duration) var(--expand-curve), opacity var(--pop-fade), visibility 0s var(--pop-fade-duration), bottom var(--pop-duration) var(--expand-curve) var(--hw-cart-delay, 0s); }   /* the pair's hidden list + the cart-following bottom */
  #hw-panel .hw-body {
    position: absolute; inset: 0;
    /* Frame interior: content inset ~14-22 of 455 wide; 18px×ui the
       consistent reading (panel internals ride ui-scale). The add row
       lives OUTSIDE now — no cleared band at the foot. */
    padding: calc(18px * var(--ui-scale));
    overflow: hidden auto;
    overscroll-behavior: contain;   /* the house scrollbar (the pair) draws the lane */
  }

  /* Section head — the p1 reference's grammar: lowercase head, hairline
     rule below spanning the panel. */
  .hw-sec {
    display: block;
    color: var(--ink);
    font-family: var(--font-ui); font-weight: 600;
    font-size: calc(12px * var(--ui-scale));   /* THE TYPE PASS: the customization interface is 12 (titles WideSemiBold) */
    line-height: calc(15px * var(--ui-scale));
    letter-spacing: .02em;
    padding-bottom: calc(8px * var(--ui-scale));
    border-bottom: 1px solid var(--bs-rule);
    margin: calc(32px * var(--ui-scale)) 0 calc(10px * var(--ui-scale));   /* Eric, Sept 5: the gap between the first and second section DOUBLED (16 → 32) */
  }
  .hw-sec:first-child { margin-top: 0; }

  /* Materials: family column + finish column (the frames' own split). */
  .hw-mat-grid {
    display: grid; grid-template-columns: 1fr 1fr;
    column-gap: calc(24px * var(--ui-scale));
    align-items: start;
  }
  .hw-optlist { display: grid; gap: calc(6px * var(--ui-scale)); }
  .hw-opt {
    position: relative;
    background: none; border: 0;
    padding: 0;
    width: max-content; max-width: 100%;
    text-align: left;
    color: var(--text-soft);
    font-family: var(--font-ui); font-weight: 300;
    font-size: calc(12px * var(--ui-scale));   /* THE TYPE PASS: options 12 — rest WideLight, focused WideSemiBold */
    line-height: calc(17px * var(--ui-scale));
    letter-spacing: 0;
    /* HOTNESS LAW: no resting glow (hoverable); the LIT ring set on hover,
       intensity 2.359 (small 300-weight rows need two pastes). */
    --bloom-g: 2.19;   /* THE CHILDREN LAW (Eric, Sept 5): the focused option stays 300 and only glows — the default is the MEAN of all sixteen option strings solved LIVE over the window's plate (2.04–2.44); each string carries its own value from BLOOM.hwopt[300] */
    cursor: var(--cursor-target);
    transition: color .16s;
  }
  .hw-opt.is-chosen { --bloom-g: 1.12; }   /* the CHOSEN option (600 + standing glow): the mean of all sixteen strings solved LIVE over the window's plate (1.03–1.32); per string from BLOOM.hwopt[600]. ON THE OPT, not the row — the material and finish options have no row, and at the row-only rule they sat at the 300 value: 1.6–1.7× the reference with a wider halo (Eric's eye, Sept 5) */
  .hw-opt.kb-hover, .hw-opt:hover, .hw-opt:focus-visible {
    color: #fff; outline: none;   /* glow only — bold is the CHOSEN option's mark (Aug 28 law, restated Sept 5) */
    text-shadow: var(--bloom-lit);
  }
  /* NO DOTS IN THE PANELS (Eric, Aug 28 fourth word, p4: "all
     customization selection indication shouldn't be dots") — the outer
     GLOW is the focused indicator, BOLD is the selected indicator.
     Sept 5 (Eric: "options do count as children"): THE CHILDREN LAW
     applies — a focused option only glows (300); the CHOSEN option is
     bold AND glows, standing, at the 600 value. The menu dots (red,
     blue) are menu grammar and untouched. */
  .hw-opt.is-chosen { color: #fff; font-weight: 600; text-shadow: var(--bloom-lit); }

  /* Color rows — Eric's p1 reference: label left, TICK SCRUBBER filling
     the row's right; the active row is bold+lit; A/D scrubs it. The
     strip is the tick bed; the WAVE cursor standing at t IS the value
     (the design team's p4 — Eric, Aug 31). */
  .hw-colrow {
    display: grid;
    grid-template-columns: minmax(calc(96px * var(--ui-scale)), auto) 1fr;
    align-items: center;
    column-gap: calc(14px * var(--ui-scale));
    min-height: calc(24px * var(--ui-scale));
  }
  .hw-scrub {
    position: relative;
    height: calc(11px * var(--ui-scale));
    cursor: var(--cursor-target);
  }
  /* THE HIT SURFACE (Eric, Aug 31: "a little too tight — same idea as
     the other menu items"): an invisible border-box widens the strip's
     target to the row's own band (11 → 25px×ui) — the minus-box /
     bs-hit grammar; the ink never moves. */
  .hw-scrub::before {
    content: '';
    position: absolute;
    left: 0; right: 0;
    top: calc(-7px * var(--ui-scale));
    bottom: calc(-7px * var(--ui-scale));
  }
  /* THE TEETH (Eric, Aug 31, second word: "it's the homepage slide bar
     interaction — the teeth grow as the mouse slides through, not a
     static block"): the home strip's own certified mechanics, ported —
     heat = 1 − distance/10%-of-width, scaleY(1 + 1.55·heat) from the
     floor, opacity .55 + .45·heat, the strip's .12s micro tempo. The
     ticks are also the VALUE: lit ≤ t is the row's scrub memory (the
     third word holds). The parked bell + rings retire; the two-ring
     house cursor riding the bar IS the p4 circle. One deviation on
     the record: home's resting 8px tick glow is dropped here — six
     rows × 64 teeth pay it where twenty ticks could (the 96px law's
     spirit); glow arrives WITH heat. */
  .hw-tick {
    --hw-heat: 0; --hw-heat-pct: 0%;
    position: absolute;
    left: var(--hw-tick-x);
    bottom: calc(2px * var(--ui-scale));
    width: 1px; height: calc(7px * var(--ui-scale));
    background: color-mix(in srgb, #fefefe2e, #ffffff var(--hw-heat-pct));
    opacity: calc(.55 + var(--hw-heat) * .45);
    transform: translateX(-50%) scaleY(calc(1 + var(--hw-heat) * 1.55));
    transform-origin: bottom;
    box-shadow: 0 0 calc(12px * var(--hw-heat) * var(--ui-scale)) rgba(255, 255, 255, .4);
    transition: background .12s, opacity .12s, transform .12s, box-shadow .12s;
    pointer-events: none;
  }
  .hw-tick.is-lit { background: color-mix(in srgb, #fefefe59, #ffffff var(--hw-heat-pct)); }
  .hw-colrow.is-chosen .hw-tick.is-lit { background: color-mix(in srgb, #fefefeb8, #ffffff var(--hw-heat-pct)); }
  /* HOVER: the bar glows WITH its text (Eric, Aug 31) */
  .hw-colrow:hover .hw-opt { color: #fff; text-shadow: var(--bloom-lit); }   /* glow only (the chosen row is bold by its own rule) */
  .hw-colrow:hover .hw-scrub {
    filter: drop-shadow(0 0 calc(6px * var(--ui-scale)) rgba(255, 255, 255, .35));
  }

  /* Size view — presets (label + dims readout) then the custom inputs:
     the form subsystem's second consumer, .bs-field verbatim with the
     values reading LEFT (dimension entry, not address entry). */
  .hw-sizerow {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: calc(18px * var(--ui-scale));
    width: 100%; max-width: none;
    /* the whole row is ONE target (Eric, Sept 2) — dims included */
    cursor: var(--cursor-target);
  }
  .hw-sizerow:hover .hw-opt { color: #fff; text-shadow: var(--bloom-lit); }   /* glow only (the chosen row is bold by its own rule) */
  .hw-sizerow:hover .hw-sizedims { color: #fff; }
  .hw-sizedims {
    color: var(--bs-label);
    font-family: var(--font-ui); font-weight: 300;
    font-size: calc(12px * var(--ui-scale));   /* THE TYPE PASS: the dims column rides the options' 12 */
    letter-spacing: .04em;
    white-space: nowrap;
    transition: color .16s;
  }
  /* The chosen preset bolds label AND dims (the design's own reading). */
  .hw-sizerow.is-chosen .hw-sizedims { color: var(--ink); font-weight: 600; }
  /* The section head can carry the unit toggle at its right — the
     design's placement (p2): "options" left, CM / IN right. */
  .hw-sec--row { display: flex; align-items: baseline; justify-content: space-between; }
  .hw-unit {
    display: inline-flex; align-items: baseline;
    gap: calc(5px * var(--ui-scale));
  }
  .hw-unit button {
    background: none; border: 0; padding: 0 calc(2px * var(--ui-scale));
    color: var(--text-soft);
    font-family: var(--font-ui); font-weight: 300;
    font-size: calc(10px * var(--ui-scale));   /* Eric, Sept 5: the unit toggle is RULED AT 10 (their 8 sat at the glow cap — accepted, then re-rung) */
    line-height: calc(12px * var(--ui-scale));
    letter-spacing: .06em;
    cursor: var(--cursor-target);
    transition: color .16s;
  }
  .hw-unit button { --bloom-g: 3.53; }               /* THE CHILDREN LAW: the focused unit stays 300 and only glows — solved LIVE at the 10 rung over the plate (IN: 3.529 → 0.993); the cap is behind it */
  .hw-unit button:hover, .hw-unit button:focus-visible { color: #fff; outline: none; text-shadow: var(--bloom-lit); }   /* glow only — bold is the LIVE unit's mark */
  .hw-unit button.is-live { color: #fff; font-weight: 600; text-shadow: var(--bloom-lit); --bloom-g: 1.59; }   /* Eric, Sept 5: options are children — the LIVE unit is bold AND glows, standing (600 value solved LIVE over the plate: CM 1.591 → 1.011) */
  .hw-unit .hw-unit-slash { color: var(--bs-label); font-size: calc(10px * var(--ui-scale)); }   /* rides the toggle's rung */
  /* THE PILL FIELDS (Eric, Aug 28 fourth word, p2: "size dimension
     inputs happen within a pill") — the design team's capsule: hairline
     outline, full radius, label inside-left, the value bold right, the
     unit inside the right end. The frames drew them at 278.7×21.7
     (extracted rects in the sizs frame). No marker dots — the pill is
     the affordance. */
  .hw-custom {
    display: grid; grid-template-columns: auto 1fr;
    column-gap: calc(14px * var(--ui-scale));
    align-items: start;
  }
  .hw-custom-label {
    color: var(--text-soft);
    font-family: var(--font-ui); font-weight: 300;
    font-size: calc(10px * var(--ui-scale));   /* THE TYPE PASS: "enter the size you want" is their 10 */
    line-height: calc(24px * var(--ui-scale));   /* centers on the first pill */
    letter-spacing: .02em;
    white-space: nowrap;
  }
  .hw-pills { display: grid; gap: calc(8px * var(--ui-scale)); }
  .hw-pill-field {
    display: flex; align-items: center;
    gap: calc(8px * var(--ui-scale));
    height: calc(24px * var(--ui-scale));
    padding: 0 calc(12px * var(--ui-scale));
    border: 1px solid var(--panel-line);
    border-radius: 999px;
    transition: border-color .16s, box-shadow .2s ease;
  }
  .hw-pill-field:focus-within {
    border-color: #fefefe73;
    box-shadow: 0 0 calc(14px * var(--ui-scale)) rgba(255, 255, 255, .14);
  }
  .hw-pill-field > label {
    flex: none;
    color: var(--bs-label);
    font-family: var(--font-ui); font-weight: 300;
    font-size: calc(10px * var(--ui-scale));   /* THE TYPE PASS: length / width are their 10 */
    letter-spacing: .04em;
  }
  .hw-pill-field .bs-input { flex: 1; width: auto; font-size: calc(12px * var(--ui-scale)); }   /* THE TYPE PASS: the typed number is their 12 WideSemiBold */
  .hw-pill-unit {
    flex: none;
    color: var(--bs-label);
    font-family: var(--font-ui); font-weight: 300;
    font-size: calc(12px * var(--ui-scale));   /* THE TYPE PASS: the unit is their 12 WideLight */
    letter-spacing: .04em;
  }

  /* The add row — FIXED PAGE FURNITURE (Eric, Aug 28 fourth word:
     "the add to cart tab should always remain on the page at a fixed
     location"). The frames' y864 -> 77.35vh, the panel's own column;
     present whenever a real product is selected, panel open or not.
     The price slot stays a MARKED SEAM: no price source is ruled; the
     static $3,499 is the on-record bug and never returns. */
  .hw-addrow {
    position: fixed;
    right: var(--hw-panel-right);
    /* Sept 5: berthed off the cart's top edge (77.35vh with the cart
       expanded — the frames' berth, unchanged; lower with it collapsed). */
    bottom: calc(100vh - var(--hw-cart-top) + var(--hw-cart-gap));
    width: var(--hw-panel-w);
    min-width: calc(320px * var(--ui-scale));
    height: calc(30px * var(--ui-scale));
    display: flex; align-items: stretch;
    z-index: 17;
    transition: opacity var(--pop-fade), visibility 0s, bottom var(--pop-duration) var(--expand-curve) var(--hw-cart-delay, 0s);
  }
  .hw-addrow.is-off {
    opacity: 0; visibility: hidden; pointer-events: none;
    transition: opacity var(--pop-fade), visibility 0s var(--pop-fade-duration), bottom var(--pop-duration) var(--expand-curve) var(--hw-cart-delay, 0s);
  }
  .hw-addrow .hw-add-chip {
    flex: none;
    width: calc(30px * var(--ui-scale));
    display: grid; place-items: center;
    background: #ededed; color: #0b0b0a;
    border: 0; padding: 0;
    font-family: var(--font-sans); font-weight: 300;
    font-size: calc(13px * var(--ui-scale));
  }
  /* the bloom + cursor + transitions ride .bs-fillpill (Eric, Aug 31:
     the factored filled pill); the lift line stays the consumer's */
  .hw-addrow .hw-add-chip:hover, .hw-addrow .hw-add-chip:focus-visible {
    background: #fff;
  }
  /* THE THREE ZONES, re-corrected (Eric, Aug 29: "add to cart is
     actually the plus icon, not the add to cart button text itself"):
     ONLY the + ADDS · the gray bar just SAYS "add to cart" — a caption
     for the plus, not a control (no cursor, no lift, no handler) · the
     white box SHOWS THE PRICE — the ruled fake $1, see the manifest. */
  .hw-addrow .hw-add-bar {
    flex: 1;
    display: flex; align-items: center;
    padding: 0 calc(12px * var(--ui-scale));
    background: #4a4a4a5c;
    color: var(--ink);
    font-family: var(--font-ui); font-weight: 600;
    font-size: calc(12px * var(--ui-scale));
    letter-spacing: .04em;
    text-align: left;
  }
  .hw-addrow .hw-add-price {
    flex: none;
    display: flex; align-items: center;
    padding: 0 calc(14px * var(--ui-scale));
    background: #ededed; color: #040402;
    font-family: var(--font-ui); font-weight: 600;
    font-size: calc(12px * var(--ui-scale));
    letter-spacing: .04em;
  }

  /* ── THE CART ROW — ruled INTO phase one (Eric, Aug 28, second word:
     "the cart row is very important for the product page"; the same-day
     phase-2 hold now covers only the dedicated FULL CART PAGE, which is
     a coming page). Geometry from the proportional layer: band rails
     84.51→98.12vh on the 3.76vw / 3.30vw rails, center rule 87.11vh at
     1.91vw insets, divider 70.78vw; slots 160×90 ×ui, gap 25×ui, row
     from 5.50vw at 89.08vh — SIX (the frames' count; the values doc's
     "seven" is the flagged miscount). Occupancy rides the frames' tick
     grammar: lit #fefefe filled, #fefefe2b empty. The price column's
     total renders "—" to its marked seam (source unruled; the $3,499
     bug never returns); view cart + checkout DENY to seams until the
     cart page and the commerce ruling land. */
  /* EXPANDABLE (Eric's sixth word, p1): clicking the CART text calls
     the row up and collapses it. Collapsed = the B-2 strip — a slim
     surface bar at the stage's own center span (322..1379 → 18.63vw,
     w 61.17vw, top 95.34vh) with the corner triangle, an inset rule
     and the label. Expanded = the full band. Both travel on the house
     tempo; adding to cart calls the row up. */
  #hw-tray { position: fixed; inset: 0; z-index: 14; pointer-events: none; }
  #hw-tray-strip {
    position: absolute;
    /* Eric, Sept 5: the collapsed bar EXTENDS to the text insets — its
       sides sit where OASIS begins and INTRODUCTION ends, no longer the
       stage's 18.63..79.80vw center span. */
    left: var(--hw-text-inset); right: var(--hw-text-inset); top: 95.34vh;
    height: calc(100vh - 95.34vh);
    background: var(--bsw-fill);
    border: 0; padding: 0;
    pointer-events: auto;
    cursor: var(--cursor-target);
    opacity: 1;
    transition: opacity var(--pop-fade), visibility 0s, background .16s;
  }
  #hw-tray-strip:hover, #hw-tray-strip:focus-visible { background: #fefefe24; outline: none; }
  #hw-tray.is-open #hw-tray-strip {
    opacity: 0; visibility: hidden; pointer-events: none;
    transition: opacity var(--pop-fade), visibility 0s var(--pop-fade-duration);
  }
  .hw-strip-tri {
    position: absolute; top: 0; left: 0;
    width: calc(9px * var(--ui-scale)); height: calc(12px * var(--ui-scale));
    background: linear-gradient(to bottom right,
      var(--ink) calc(50% - .5px), transparent calc(50% + .5px));
  }
  .hw-strip-rule {
    position: absolute;
    left: calc(30px * var(--ui-scale)); right: calc(35px * var(--ui-scale));
    top: calc(25px * var(--ui-scale));
    height: 1px; background: var(--panel-line);
  }
  .hw-strip-label {
    position: absolute;
    left: calc(31px * var(--ui-scale)); top: calc(33px * var(--ui-scale));
    color: var(--text-soft);
    font-family: var(--font-ui); font-weight: 300;
    font-size: calc(11px * var(--ui-scale));
    letter-spacing: .08em;
  }
  /* THE EXPANSION CHOREOGRAPHY (thirteenth word, Eric, Aug 29): the
     strip's translucent box FADES · the line GROWS horizontally at the
     strip's own height (scaleX .96 — the text-inset strip against the
     1.91vw band rule, at the frame; was .62 for the center span) · then PULLS UP to the band rule's 87.11vh while
     the two rails DRAW · and the full row's contents reveal. One clock,
     keyframe percentage splits — the waterfall's own discipline; tempo
     tokens only, zero local durations. The close stays a plain fade
     (the house's closing grammar). */
  #hw-tray-band {
    position: absolute; inset: 0;
    pointer-events: none;
    opacity: 0; visibility: hidden;
    /* NO base fade (the fifteenth word's flash fix): the reverse
       choreography IS the close — when .is-closing releases, the
       un-animated rule/rails stand at full expansion again, so the band
       must vanish INSTANTLY at that moment, never fade through it. */
    transition: none;
  }
  #hw-tray.is-open #hw-tray-band {
    opacity: 1; visibility: visible;
    transition: opacity 0s, visibility 0s;   /* the children carry the entrance */
  }
  #hw-tray-band > * { pointer-events: auto; }
  @keyframes hw-rule-in {
    0% {
      transform: translateY(calc(95.34vh + 25px * var(--ui-scale) - 87.11vh)) scaleX(0.96);
      animation-timing-function: var(--expand-curve);
    }
    45% {
      transform: translateY(calc(95.34vh + 25px * var(--ui-scale) - 87.11vh)) scaleX(1);
      animation-timing-function: var(--expand-curve);
    }
    100% { transform: translateY(0) scaleX(1); }
  }
  #hw-tray.is-open .hw-tray-rule { animation: hw-rule-in var(--pop-duration) both; }
  @keyframes hw-rail-in {
    0%, 45% { transform: scaleY(0); }
    100%    { transform: scaleY(1); }
  }
  #hw-tray.is-open .hw-tray-rail--l,
  #hw-tray.is-open .hw-tray-rail--r {
    /* the rails draw out from where the rising rule crosses them:
       (87.11 − 84.51) / 13.61 of their own height */
    transform-origin: 50% 19.1%;
    animation: hw-rail-in var(--pop-duration) var(--expand-curve) both;
  }
  /* the contents wait for the line to land — the waterfall's own
     content grammar (delays drink from the token, never local). */
  #hw-tray-band .hw-tray-label,
  #hw-tray-band #hw-slots,
  #hw-tray-band .hw-tray-price,
  #hw-tray-band .hw-tray-rail--div {
    opacity: 0;
    transition: opacity var(--pop-fade);
  }
  #hw-tray.is-open #hw-tray-band .hw-tray-label,
  #hw-tray.is-open #hw-tray-band #hw-slots,
  #hw-tray.is-open #hw-tray-band .hw-tray-price,
  #hw-tray.is-open #hw-tray-band .hw-tray-rail--div {
    opacity: 1;
    transition-delay: var(--pop-duration);
  }
  /* THE COLLAPSE MIRRORS IT (fourteenth word, Eric, Aug 29): contents
     fade first · then the rule descends while the rails undraw · the
     line shrinks back to the strip's width · the strip fades in on cue.
     Driven by .is-closing (JS holds it for exactly the choreography's
     token-derived length, then releases to the hidden base state — by
     which time the strip's own rule stands where the animated one
     lands, so the hand-off is seamless). */
  #hw-tray.is-closing #hw-tray-band {
    opacity: 1; visibility: visible;
    transition: none;
  }
  #hw-tray.is-closing #hw-tray-band > * { pointer-events: none; }
  @keyframes hw-rule-out {
    0% {
      transform: translateY(0) scaleX(1);
      animation-timing-function: var(--expand-curve);
    }
    55% {
      transform: translateY(calc(95.34vh + 25px * var(--ui-scale) - 87.11vh)) scaleX(1);
      animation-timing-function: var(--expand-curve);
    }
    100% { transform: translateY(calc(95.34vh + 25px * var(--ui-scale) - 87.11vh)) scaleX(0.96); }
  }
  #hw-tray.is-closing .hw-tray-rule {
    animation: hw-rule-out var(--pop-duration) var(--pop-fade-duration) both;
  }
  @keyframes hw-rail-out {
    0%        { transform: scaleY(1); }
    55%, 100% { transform: scaleY(0); }
  }
  #hw-tray.is-closing .hw-tray-rail--l,
  #hw-tray.is-closing .hw-tray-rail--r {
    transform-origin: 50% 19.1%;
    animation: hw-rail-out var(--pop-duration) var(--expand-curve) var(--pop-fade-duration) both;
  }
  /* the strip returns only after the line has come home */
  #hw-tray.is-closing #hw-tray-strip {
    transition-delay: calc(var(--pop-fade-duration) + var(--pop-duration));
  }
  @media (prefers-reduced-motion: reduce) {
    #hw-tray.is-open .hw-tray-rule,
    #hw-tray.is-open .hw-tray-rail--l,
    #hw-tray.is-open .hw-tray-rail--r,
    #hw-tray.is-closing .hw-tray-rule,
    #hw-tray.is-closing .hw-tray-rail--l,
    #hw-tray.is-closing .hw-tray-rail--r { animation: none; }
    #hw-tray.is-open #hw-tray-band .hw-tray-label,
    #hw-tray.is-open #hw-tray-band #hw-slots,
    #hw-tray.is-open #hw-tray-band .hw-tray-price,
    #hw-tray.is-open #hw-tray-band .hw-tray-rail--div { transition-delay: 0s; }
    #hw-tray.is-closing #hw-tray-band {
      opacity: 0; visibility: hidden;
      transition: opacity var(--pop-fade), visibility 0s var(--pop-fade-duration);
    }
    #hw-tray.is-closing #hw-tray-strip { transition-delay: 0s; }
  }
  .hw-tray-rule, .hw-tray-rail {
    position: absolute; background: var(--panel-line); pointer-events: none;
  }
  .hw-tray-rule { left: 1.91vw; right: 1.91vw; top: 87.11vh; height: 1px; }
  .hw-tray-rail { width: 1px; top: 84.51vh; height: 13.61vh; }
  .hw-tray-rail--l   { left: max(clamp(34px, 3.8vw, 68px), 3.76vw); }
  .hw-tray-rail--r   { right: 3.30vw; }
  .hw-tray-rail--div { left: 70.78vw; }
  /* THE OPEN LABEL (Eric, Aug 29, off the design's p2): the word rode
     too close to the rule — the design centers it HIGH in the rail-to-
     rule window (cap center ≈ 30% down, ~16px of air above the line),
     so the label anchors at 85.29vh and self-centers. And the open row
     wears the away-nav's you-are-here treatment: ink, 600, the house
     word glow (static tokens — the label is outside rule 6's fitted
     scope). The band only exists expanded, so no .is-open scoping:
     styling the label IS styling the open state, and the close fade
     carries the glow out with it. */
  .hw-tray-label {
    position: absolute; left: 5.50vw; top: 85.29vh;
    transform: translateY(-50%);
    color: var(--ink);
    background: none; border: 0; padding: 0;
    font-family: var(--font-ui); font-weight: 600;
    font-size: calc(12px * var(--ui-scale));   /* THE TYPE PASS: the cart button is their 12 */
    letter-spacing: .08em;
    --bloom-g: 1.055;   /* HOTNESS LAW: no resting glow (hoverable); lit intensity re-solved on the 12 rung */
    cursor: var(--cursor-target);
    transition: color .16s;
  }
  .hw-tray-label:hover, .hw-tray-label:focus-visible {
    color: #fff; outline: none; text-shadow: var(--bloom-lit);
  }
  /* UNLIMITED items (Eric's sixth word): the slot row is a horizontal
     SCROLLER spanning the rail-to-divider region; the wheel belongs to
     it natively when it can scroll (the wheelNative seam). */
  #hw-slots {
    position: absolute; left: 5.50vw; top: 89.08vh;
    right: calc(29.22vw + 14px);
    display: flex; gap: calc(25px * var(--ui-scale));
    overflow-x: auto; overflow-y: hidden;
    padding-bottom: calc(6px * var(--ui-scale));
    overscroll-behavior: contain;   /* the house scrollbar (the pair) draws the lane */
    pointer-events: auto;
  }
  .hw-slot {
    position: relative;
    flex: none;
    width: calc(160px * var(--ui-scale)); height: calc(90px * var(--ui-scale));
    background: #4a4a4a5c;
    border: 0; padding: 0;
    transition: background .16s;
  }
  .hw-slot.is-filled { cursor: var(--cursor-target); }   /* body click = preview */
  /* Photo hover lifts THROUGH the render (sixteenth word — the grey
     backdrop stays underneath; the image brightens, the frame glows). */
  .hw-slot.is-filled:hover, .hw-slot.is-filled:focus-visible {
    background: #5c5c5c5c; outline: none;
    box-shadow: 0 0 calc(14px * var(--ui-scale)) rgba(255, 255, 255, .16);
  }
  .hw-slot.is-filled:hover .hw-slot-img,
  .hw-slot.is-filled:focus-visible .hw-slot-img { filter: brightness(1.28); }
  /* THE SLOT MINUS (Eric, Aug 29: the row's thumbnails carry it too —
     supersedes the cart-page-only scoping): every filled slot removes
     from its top-right corner, quiet at rest, lit under its own
     pointer. A role-button span — a real <button> may not nest inside
     the slot button. */
  .hw-slot-minus {
    position: absolute; top: 0; right: 0;
    width: calc(28px * var(--ui-scale)); height: calc(28px * var(--ui-scale));
    color: var(--text-soft);
    cursor: var(--cursor-target);
    z-index: 2;
    opacity: .6;
    transition: color .16s, opacity .16s;
  }
  /* The dash is DRAWN, not typeset (Eric, Aug 29: the glyph read
     off-center — a dash's ink is wide and short, so a centered box
     leaves more air above than beside). Equal insets by construction,
     DOUBLED on Eric's next word (Aug 29): 10px×ui to the top, 10px×ui
     to the right; the hit box grows 18→28 so the ink keeps its
     symmetric surround (inset + ink + inset). */
  .hw-slot-minus::after {
    content: '';
    position: absolute;
    top: calc(10px * var(--ui-scale));
    right: calc(10px * var(--ui-scale));
    width: calc(8px * var(--ui-scale));
    height: max(1px, calc(1.2px * var(--ui-scale)));
    background: currentColor;
    transition: box-shadow .2s ease;
  }
  .hw-slot-minus:hover, .hw-slot-minus:focus-visible {
    color: #fff; opacity: 1; outline: none;
  }
  .hw-slot-minus:hover::after, .hw-slot-minus:focus-visible::after {
    box-shadow: 0 0 calc(6px * var(--ui-scale)) rgba(255, 255, 255, .65);
  }
  /* THE TRIANGLE CHECKBOX (Eric's sixth word + the B-2 note: 实心 =

    scale = Math.max(0.5, Math.min(1.6, scale));

    scale = HW.sizes[size.preset].scale;

  return { color: rgb, metal: fin.metal, rough: fin.rough, scale: scale };

// THE BALANCED GROUP (Eric's eighth word: the plates and the resized
// showcase "should find their center together"). Solved at runtime —
// Class S: the group's height depends on the window's aspect (the
// plates are aspect-locked) and the ball's live size scale, so the
// machine centers [plates · gap · ball] in the stage band on every
// open and every resize. Band: below the nav zone (12vh) to the cart
// strip (95.34vh); the fixed 31.51vh plate top yields to the solve
// while the plates stand and returns when they leave.
var INTRO_GAP_PX = 36;                            // ×ui — the group's breathing gap
function layoutIntroStage(){
  if (introSub < 0) return;
  var w = window.innerWidth, h = window.innerHeight;
  var ui = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--ui-scale')) || 1;
  var topBound = h * 0.12;
  var bottomBound = h * 0.9534;                   // the collapsed cart strip
  var plateH = plates[0].getBoundingClientRect().height;
  var scale = stageParamsFor(SEL.parts, SEL.size, SEL.part).scale;
  var D = 2 * Math.min(w, h) * 0.125 * scale;     // the pushed ball's diameter
  var gap = INTRO_GAP_PX * ui;
  var total = plateH + gap + D;
  var top = Math.max(topBound, (topBound + bottomBound - total) / 2);
  document.body.style.setProperty('--hw-plate-top', top + 'px');
  var cy = (top + plateH + gap + D / 2) / h;
  Ball.stage({ cx: 0.50, cy: cy, rad: 0.125 });
}

  plates.forEach(function(pl){

    pl.classList.remove('is-open');

  introSub = -1; customSub = -1; SEL.part = null; panelView = null;
  var a = document.activeElement;
  if (a && (panel.contains(a) || productMenuEl.contains(a)) && a.blur) a.blur();
  hidePanel(); hidePlates();
  render();
}

// ── THE ESC LADDER — C.makeLadder, one honest level per press ───────────
var ladder = C.makeLadder([
  { name: 'field',
    when: function(){
      var a = document.activeElement;
      return !!(a && panel.contains(a) && a.tagName === 'INPUT');
    },
    step: function(){ document.activeElement.blur(); } },
  { name: 'panel',
    when: function(){ return panelView !== null || introSub >= 0; },
    step: closePanelLevel },
  { name: 'header',
    when: function(){ return openHead >= 0; },
    step: closeHead },
  { name: 'cursor',
    when: function(){ return focusIdx >= 0; },
    step: function(){ setFocus(-1); } },
  { name: 'boundary',
    when: function(){ return true; },
    step: function(){ if (arrival) popBoundary(); } }
]);
function goBack(){ ladder.back(); }

// ── Render from state ────────────────────────────────────────────────────
function render(){
  classItems.forEach(function(b, i){
    b.classList.toggle('kb-hover', i === focusIdx);
    b.classList.toggle('active', i === SEL.classIdx);
  });
  headEls.forEach(function(b, h){
    b.classList.toggle('kb-hover', h === rightFocus && openHead !== h);
    b.classList.toggle('is-open', h === openHead);
  });
  var isReal = realClass(SEL.classIdx);
  // The right menu exists only for a REAL product; unreal classes
  // preview the coming-soon stage (the locked-classes game pattern).
  productMenuEl.style.visibility = isReal ? '' : 'hidden';
  comingEl.classList.toggle('is-on', !isReal);
  document.getElementById('hw-addrow').classList.toggle('is-off', !isReal);
  priceEl.textContent = isReal ? '$' + PLACEHOLDER_PRICE_USD : '—';
  Ball.show(isReal);
  backBtn.setAttribute('aria-label', openHead >= 0 ? T('navBack') : T('navHome'));
  subWrapEls.forEach(function(w, h){
    var on = (h === openHead);
    w.classList.toggle('is-on', on);
  });
  introSubEls.forEach(function(b, i){
    b.classList.toggle('is-live', openHead === 0 && i === introSub);
    b.tabIndex = openHead === 0 ? 0 : -1;
  });
  customSubEls.forEach(function(b, i){
    b.classList.toggle('is-live', openHead === 1 && i === customSub);
    b.tabIndex = openHead === 1 ? 0 : -1;
  });
  var panelOn = panelView !== null;
  panelBody.querySelectorAll('button, input').forEach(function(e2){ e2.tabIndex = panelOn ? 0 : -1; });
}

function setFocus(i){
  if (i === focusIdx) return;
  if (i >= 0){
    if (C.rail.index() >= 0) C.rail.focus(-1);
    if (rightFocus >= 0){ rightFocus = -1; }
  }
  focusIdx = i;
  if (i >= 0){ SoundBus.play('detent'); hapticTick(); }
  render();
}
function focusStep(dir){
  var next;
  if (focusIdx < 0) next = dir > 0 ? 0 : HW.classes.length - 1;
  else {
    next = focusIdx + dir;
    if (next < 0 || next >= HW.classes.length) return false;   // ends clamp
  }
  setFocus(next);
  return true;
}

// ── The panel owns its keys while it stands — W/S walks the color rows,
// A/D scrubs the active row (the slotted-row ruling; axes never
// double-book), Esc walks THE ladder. ───────────────────────────────────
panel.addEventListener('keydown', function(e){
  if (panelView === null) return;
  e.stopPropagation();
  var k = e.key;
  if (k === 'Escape'){ e.preventDefault(); wake(); goBack(); return; }
  if (panelView !== 'part') return;
  if (k === 'w' || k === 'W' || k === 'ArrowUp' || k === 's' || k === 'S' || k === 'ArrowDown'){
    e.preventDefault(); wake();
    var down = (k === 's' || k === 'S' || k === 'ArrowDown');
    var n = colorFocus < 0 ? (down ? 0 : HW.colors.length - 1) : colorFocus + (down ? 1 : -1);
    if (n < 0 || n >= HW.colors.length) return;              // ends clamp silently
    setColorFocus(n);
    SoundBus.play('detent'); hapticTick();
    return;
  }
  if (k === 'a' || k === 'A' || k === 'ArrowLeft' || k === 'd' || k === 'D' || k === 'ArrowRight'){
    e.preventDefault(); wake();
    var p = partState();
    if (!p) return;
    var row = colorFocus >= 0 ? colorFocus : p.color.idx;
    p.color.idx = row;
    var right = (k === 'd' || k === 'D' || k === 'ArrowRight');
    p.color.t[row] = Math.max(0, Math.min(1, p.color.t[row] + (right ? 0.04 : -0.04)));
    refreshPanel();
    return;
  }
  if (k === 'Enter' && colorFocus >= 0){
    e.preventDefault(); wake();
    chooseColor(colorFocus);
  }
});

// THE ADD ROW COMMITS — ONLY the + chip adds (Eric, Aug 29: "add to
// cart is actually the plus icon"); the gray bar is a caption and the
// white price box is display only.
(function(){
  var b = document.getElementById('hw-add-chip');
  b.addEventListener('click', function(e){
    e.stopPropagation();
    wake();
    if (clickOk()) addToCart(b);
  });
})();
// VIEW CART commits — the cart page landed (Eric's sixth word) and
// ROUTES.cart carries it; CHECKOUT stays a deny seam until the commerce
// wiring ruling (phase 2+).
(function(){
  var vc = document.getElementById('hw-viewcart');
  vc.addEventListener('click', function(e){
    e.stopPropagation();
    wake();
    if (!C.ROUTES.cart){ denyOn(vc); return; }
    if (clickOk()) C.nav.commit('cart');
  });
  var co = document.getElementById('hw-checkout');
  co.addEventListener('click', function(e){
    e.stopPropagation();
    wake();
    denyOn(co);
  });
})();

// ── Corner nav — witness grammar; the ‹ is level-aware ──────────────────
var pillPrimary = C.bindPill(primary, fwdBtn);
pillPrimary.onOpenChange = function(open){
  links.forEach(function(l){ l.tabIndex = open ? 0 : -1; });
  primary.setAttribute('aria-expanded', String(open));
};
pillPrimary.onOpenChange(false);

var _leaving = false;
function leaveHome(){
  if (_leaving || !clickOk()) return;
  _leaving = true;
  if (arrival && arrivalFrom === 'home'){
    setTimeout(function(){
      if (_leaving && !document.hidden){ _leaving = false; location.assign(C.ROUTES.home); }
    }, 350);
    history.back();
    return;
  }
  location.assign(C.ROUTES.home);
}
function popBoundary(){
  if (_leaving) return;
  _leaving = true;
  setTimeout(function(){
    if (_leaving && !document.hidden){ _leaving = false; location.assign(C.ROUTES.home); }
  }, 350);
  history.back();
}
function cornerBack(){
  if (openHead >= 0 || panelView !== null){ if (clickOk()) goBack(); return; }
  leaveHome();
}
(backBtn.closest('.bs-hit') || backBtn).addEventListener('click', function(){ wake(); cornerBack(); });

// HARDWARE is the current section — it DENIES with the shake.
links.forEach(function(link){
  link.addEventListener('click', function(e){
    e.stopPropagation();
    wake();
    var sec = link.getAttribute('data-section');
    if (sec !== 'hardware' && C.ROUTES[sec]){
      if (clickOk()) C.nav.commit(sec);
      return;
    }
    denyOn(link);
  });
});
primary.addEventListener('click', function(e){
  if (e.target.closest('.site-primary-nav__link')) return;
  wake();
  if (pillPrimary.touchOpenConsumed()) return;
  if (C.rail.lockIndex() === RAIL_PILL) C.rail.unlock();
  else C.rail.lock(RAIL_PILL);
});

// ── Mount ────────────────────────────────────────────────────────────────
var RAIL_BACK = 0, RAIL_PILL = 1;
C.init({
  page: 'hardware',
  leadingControls: [
    { headEl: backBtn, pill: null, activate: cornerBack },
    { headEl: primary, pill: pillPrimary, trayAxis: 'x',
      trayItems: function(){ return links; } }
  ],
  touchSurfaces: [document.getElementById('bs-stage'), classMenuEl],
  sweepRoots: [cornerEl, classMenuEl, productMenuEl, panel, trayEl].concat(plates),
  hooks: {
    isLocked:       function(){ return false; },   // NO page locks (law)
    goBack:         goBack,
    escapeFromRail: function(){ setFocus(0); },
    enterAtPrimary: function(){
      // Enter is the click's twin: it claims the cursor cold, then
      // selects the cursored class (door #1 has no deeper level here —
      // a class is a selection, not a window).
      if (focusIdx < 0){ setFocus(0); return; }
      if (SEL.classIdx !== focusIdx){ chooseClass(focusIdx); return; }
    },
    verticalStep:   function(down){
      if (!down && focusIdx === 0){ setFocus(-1); C.rail.focus(0); return; }
      focusStep(down ? 1 : -1);
    },
    railVertical:   function(down){
      if (down){ C.rail.focus(-1); setFocus(0); }
    },
    horizontalCold: function(){ /* A/D drive the rail (and the panel's own keys) */ },
    wheelNative:    function(e){
      // The slot row owns its wheel while it can scroll (unlimited
      // items, Eric's sixth word).
      if (slotsEl.contains(e.target)){
        return slotsEl.scrollWidth > slotsEl.clientWidth + 1;
      }
      if (!panelBody.contains(e.target)) return false;
      return panelBody.scrollHeight > panelBody.clientHeight + 1;
    },
    wheelStep:      focusStep,
    wheelPitch:     function(){ return menuPitch; },
    clearPrimary:   function(){ if (focusIdx >= 0) setFocus(-1); },
    idleReset:      function(){
      // Attract restores the resting state — desk selected, everything
      // closed — but NEVER sweeps a half-filled custom-size input (the
      // one state on this page with something to lose).
      var dirty = (SEL.size.custom.len || SEL.size.custom.wid) &&
                  panelView === 'size';
      setFocus(-1); C.rail.focus(-1);
      if (dirty) return;
      if (SEL.classIdx !== 0) chooseClass(0);
      else closeHead();
    },
    onLangChange:   function(T2){
      links.forEach(function(l){ l.textContent = T2(l.getAttribute('data-section')); });
      renderStrings();
      if (panelView !== null) buildPanelContent();
      renderTray();
      document.title = T2('hardwareTitle');
    },
    onFontsReady:   function(){
      measurePitch();
      alignPanelMarkers();
      if (panelView !== null) sizePanel();
    },
    devState:       function(){
      window.__hwBall = Ball;   // ?dev only — devState is only wired under ?dev
      return { cart: CART.length, trayOpen: trayOpen, focusIdx: focusIdx, rightFocus: rightFocus, openHead: openHead,
               introSub: introSub, customSub: customSub, part: SEL.part,
               panelView: panelView, classIdx: SEL.classIdx, rung: ladder.last(),
               colorFocus: colorFocus, sel: JSON.parse(JSON.stringify(SEL)),
               menuPitch: menuPitch, arrival: arrival };
    }
  }
});

// ── Boot — interactive at first paint; the ball lights the stage ────────
renderStrings();
links.forEach(function(l){ l.textContent = T(l.getAttribute('data-section')); });
C.normalizeWordGlow();     // the right menu's sub-items joined rule-6 scope at build
measurePitch();
alignPanelMarkers();
Ball.boot();
// THE VIEWING HAND (Eric, Aug 31): press the model and drag to orbit —
// yaw follows the hand (the presentation turn pauses in the grip and
// resumes from where the hand leaves it); pitch clamps at the poles.
// The press lands on the STAGE (the canvas is pointer-transparent);
// the ball's own hit disc decides whether it is a grab, so every other
// stage press keeps its old meaning. Mouse-first per the word — the
// touch refinement (touch-action carve-out) rides its own ruling.
(function(){
  var stageEl = document.getElementById('bs-stage');
  var held = false, lx = 0, ly = 0;
  stageEl.addEventListener('pointerdown', function(e){
    if (!Ball.hit(e.clientX, e.clientY)) return;
    wake();
    held = true; lx = e.clientX; ly = e.clientY;
    Ball.grab(true);
    try { stageEl.setPointerCapture(e.pointerId); } catch (err) {}
    e.preventDefault();
  });
  stageEl.addEventListener('pointermove', function(e){
    if (!held) return;
    Ball.orbit((e.clientX - lx) * 0.005, (e.clientY - ly) * 0.004);
    lx = e.clientX; ly = e.clientY;
  });
  var endGrab = function(){ if (held){ held = false; Ball.grab(false); } };
  stageEl.addEventListener('pointerup', endGrab);
  stageEl.addEventListener('pointercancel', endGrab);
})();
applySelectionToStage();
renderTray();
render();
// PHOTO BACKFILL (Eric, Aug 29: "nothing seems to be implemented to the
// cart row" — his items predate the snapshots, so only new adds carried
// photos). Any stored item without one gets its render now, once, and
// the store heals for every surface.
(function backfillPhotos(){
  var dirty = false;
  CART.forEach(function(it){
    // missing photos AND the black-background jpeg era both re-snap —
    // the grey plate must read through (alpha PNGs, Aug 29).
    var stale = !it.img || it.img.slice(0, 15) === 'data:image/jpeg';
    if (stale && it.sel){
      var img = snapshotOf(stageParamsFor(it.sel.parts, it.sel.size, null));
      if (img){ it.img = img; dirty = true; }
    }
  });
  if (dirty){ saveCart(); renderTray(); }
})();

window.addEventListener('resize', function(){
  alignPanelMarkers();
  if (panelView !== null) sizePanel();
  layoutIntroStage();                             // the balanced group re-centers
});
window.addEventListener('pageshow', function(e){
  if (e.persisted){
    _leaving = false;
    closeHead();
    setFocus(-1);
    C.rail.focus(-1);
    // THE ROW WAS ONE ITERATION BEHIND (Eric, Aug 29): a back-forward
    // return from /cart restored this page with the OLD cart in hand.
    // Re-read the one truth on every restore.
    CART = C.cartStore.load();
    renderTray();
  }
});
// Cross-tab, same truth: another tab's cart writes re-render this row.
window.addEventListener('storage', function(e){
  if (e.key === C.cartStore.key){
    CART = C.cartStore.load();
    renderTray();
  }
});

})();
</script>
</body>
</html>
